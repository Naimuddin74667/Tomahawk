<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QR Test Scanner</title>
<script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h2 { color: #f0b429; margin-bottom: 16px; font-size: 18px; }
  video {
    width: 100%;
    max-width: 400px;
    border: 2px solid #f0b429;
    border-radius: 10px;
    background: #111;
  }
  #result {
    margin-top: 20px;
    width: 100%;
    max-width: 400px;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 16px;
    min-height: 80px;
    word-break: break-all;
  }
  #result .label { color: #888; font-size: 11px; margin-bottom: 6px; }
  #result .value { color: #4ade80; font-size: 16px; font-weight: bold; }
  #status { margin-top: 12px; font-size: 12px; color: #aaa; text-align: center; }
  button {
    margin-top: 20px;
    background: #f0b429;
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    padding: 14px 32px;
    cursor: pointer;
    width: 100%;
    max-width: 400px;
  }
  #log {
    margin-top: 16px;
    width: 100%;
    max-width: 400px;
    font-size: 10px;
    color: #666;
    height: 120px;
    overflow-y: auto;
    background: #0a0a0a;
    padding: 8px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<h2>📷 QR Test Scanner</h2>
<video id="video" playsinline autoplay muted></video>

<div id="result">
  <div class="label">SCANNED DATA</div>
  <div class="value" id="result-text">Waiting for scan...</div>
</div>

<div id="status">Tap Start to open camera</div>
<button id="btn" onclick="toggleScan()">▶ Start Scan</button>
<div id="log"></div>

<script>
let reader = null;
let running = false;

function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML = new Date().toLocaleTimeString() + ' — ' + msg + '<br>' + el.innerHTML;
}
function status(msg) {
  document.getElementById('status').textContent = msg;
  log(msg);
}

async function toggleScan() {
  running ? stopScan() : await startScan();
}

async function startScan() {
  try {
    status('Requesting camera...');

    // Use browser API directly to get rear camera stream
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }
    });

    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();

    // Log which camera we got
    const track = stream.getVideoTracks()[0];
    log('Camera: ' + track.label);
    status('Camera open. Loading ZXing...');

    // Init ZXing reader
    reader = new ZXing.BrowserMultiFormatReader();
    status('ZXing ready. Point at QR code...');

    running = true;
    document.getElementById('btn').textContent = '⏹ Stop Scan';

    // Decode directly from the video element (no device enumeration needed)
    reader.decodeFromStream(stream, video, (result, err) => {
      if (result) {
        const text = result.getText();
        document.getElementById('result-text').textContent = text;
        status('✅ READ: ' + text);
        if (navigator.vibrate) navigator.vibrate(100);
      }
      if (err && !(err instanceof ZXing.NotFoundException)) {
        log('ZXing err: ' + err.message);
      }
    });

  } catch(e) {
    status('ERROR: ' + e.message);
    log('Stack: ' + e.stack);
    running = false;
    document.getElementById('btn').textContent = '▶ Start Scan';
  }
}

function stopScan() {
  if (reader) { try { reader.reset(); } catch(e){} reader = null; }
  const video = document.getElementById('video');
  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  running = false;
  document.getElementById('btn').textContent = '▶ Start Scan';
  status('Stopped');
}
</script>
</body>
</html>
