<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2e22">
<title>Nisha Journal Store</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nisha">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Nisha Journal Store — wholesale ordering, catalogue & stock (copied from Nisha Journal Store, store = nisha)
   Tobacco / pan masala wholesale: every variant is sold per piece, per box/carton, or per kg (0.25 kg steps), with MRP
   Owner catalogue + stock, Staff view-only, Shopkeeper ordering preview
   Data: cloud only (Cloudflare Worker + D1). The phone keeps settings only (owner key, theme, cart).
   Look: clean, static business app — light default, minimal motion
   ========================================================= */
:root{
  --bg:#f5f3ea; --bg2:#ffffff; --card:#ffffff; --card2:#eef2e9; --line:#dfe6d9;
  --text:#132019; --muted:#5d6b62;
  --primary:#123d2c; --primary-ink:#f1d79a; --primary-soft:#e6efe8;
  --accent:#C9A24A; --accent-ink:#132019; --accent-soft:#f6efd9; --accent-txt:#6f5414;
  --head:radial-gradient(120% 90% at 100% 0%,#1f5a41 0%,#123d2c 45%,#0b2419 90%);
  --gold:#8a6a1c; --gold-soft:#f6efdc;
  --ok:#14915f; --ok-soft:#e3f5ec; --warn:#b86e00; --warn-soft:#fdf0dc; --bad:#d23a4f; --bad-soft:#fbe6e9;
  --r:14px; --shadow:0 1px 3px rgba(0,0,0,.06); --nav-h:64px;
}
[data-theme="dark"]{
  --bg:#0a130f; --bg2:#0f1b16; --card:#13221b; --card2:#192c23; --line:#24392f;
  --text:#edf3ee; --muted:#9bb0a3;
  --primary:#D8B96A; --primary-ink:#0f1b16; --primary-soft:#1d3127;
  --accent:#D4AD55; --accent-ink:#0f1b16; --accent-soft:#2a2c1d; --accent-txt:#E2C47A;
  --head:radial-gradient(120% 90% at 100% 0%,#1c4a36 0%,#0f2a1f 45%,#071510 90%);
  --gold:#d9b356; --gold-soft:#2a2a1b;
  --ok:#3fcf8e; --ok-soft:#173026; --warn:#f0a63a; --warn-soft:#33281a; --bad:#ff6b7e; --bad-soft:#3a1e24;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;font-size:15px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
.muted{color:var(--muted)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--head);color:#fff}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#0f2e22;border:1px solid rgba(226,176,79,.4);flex:none}
.logo svg{width:auto;height:30px}
.brand b{font-family:Georgia,'Times New Roman',serif;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#F1D79A;display:block;line-height:1.15}
.brand small{color:rgba(255,255,255,.75);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hdr-actions{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn:active{background:var(--card2)}
.appbar .iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff}

main{padding:14px 16px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}

/* ---------- Bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.bnav button.on{color:var(--accent-txt)}
.bnav button.on svg{stroke-width:2.3}

/* ---------- Common blocks ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px;font-size:16px}
.sec small{font-weight:500;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--card2);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:10px;font-weight:600;font-size:15px}
.btn:active{opacity:.85}
.btn.gold{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgba(201,150,46,.25)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}

.search{position:relative;margin:2px 0 12px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{width:100%;padding:11px 12px 11px 38px;border-radius:10px;border:1px solid var(--line);background:var(--card);outline:none;font-size:15px}
.search input:focus{border-color:var(--primary)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--text)}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ---------- Owner home ---------- */
.greet{margin:4px 2px 2px}
.greet h1{font-size:21px}
.greet p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat .v{font-size:22px;font-weight:700;margin-top:8px}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .ic{color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
.qa:active{background:var(--card2)}
.qa span{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}

/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.row img,.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:var(--card2)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stockn{font-weight:700;font-size:18px;text-align:right;min-width:44px}
.stockn.low{color:var(--warn)} .stockn.out{color:var(--bad)} .stockn.ok{color:var(--text)}
.stockn small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.adj{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}

.pcard{display:flex;gap:12px;padding:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer}
.pcard img{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none}
.pcard .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pcard b{font-size:15px;font-weight:600}
.pcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}

/* ---------- FAB ---------- */
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:55;width:54px;height:54px;border-radius:16px;
  display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(201,150,46,.35)}
.fab svg{width:24px;height:24px;stroke-width:2.4}

/* ---------- Bottom sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:100;background:rgba(15,18,30,.45);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.sheet-wrap.open{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;margin:0 auto;max-width:760px;
  background:var(--bg);border-radius:18px 18px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .25s ease-out}
.sheet-wrap.open .sheet{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-h h2{font-size:18px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);outline:none;font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field input:disabled{background:var(--card2);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.photo-pick{display:grid;place-items:center;height:130px;border-radius:var(--r);border:1.5px dashed var(--line);background:var(--card);margin-bottom:14px;overflow:hidden;cursor:pointer;color:var(--muted);font-weight:500;text-align:center}
.photo-pick{grid-template:minmax(0,1fr)/minmax(0,1fr)}
.photo-pick img{width:100%;height:100%;min-height:0;object-fit:contain;background:var(--card2)}
.vblock{padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.vblock-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600}
.vphoto{width:44px;height:44px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);flex:none;cursor:pointer}
.vphoto img{width:100%;height:100%;object-fit:cover}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ---------- Product detail (owner) ---------- */
.pd-img{width:100%;height:210px;border-radius:var(--r);object-fit:contain;background:var(--card2)}
.vcard{padding:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.vcard-top{display:flex;align-items:center;gap:10px}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:10px}
.prices div{padding:7px;border-radius:8px;background:var(--card2);text-align:center}
.prices small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.prices b{font-size:14.5px}

/* ---------- Shop view (Purple Rush) ---------- */
body.shop .appbar{display:none}
body.shop main{padding-top:0}
.ps-top{margin:0 -16px;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;background:var(--head);color:#fff;border-radius:0 0 26px 26px}
.ps-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ps-eta{font-size:21px;font-weight:800;letter-spacing:-.02em;min-width:0}
.ps-eta small{display:block;font-size:12.5px;font-weight:500;opacity:.8;letter-spacing:0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-acts{display:flex;gap:8px;flex:none}
.ps-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.ps-search{position:relative;margin-top:14px}
.ps-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#8a8170;width:18px;height:18px}
.ps-search input{width:100%;border:0;outline:none;border-radius:14px;padding:12px 12px 12px 38px;font-size:15px;background:#fff;color:#17140f}
/* padding leaves room for the selected outline, which the scroll box would otherwise clip */
.ps-cats{display:flex;align-items:flex-start;gap:12px;margin:10px -4px 0;padding:6px 4px 2px;overflow-x:auto;scrollbar-width:none}
.ps-cats::-webkit-scrollbar{display:none}
.ps-cat{flex:none;width:64px;text-align:center;font-size:11.5px;font-weight:600;color:#fff;opacity:.72;line-height:1.2}
.ps-cat.on{opacity:1}
.ps-cat .ci{width:52px;height:52px;border-radius:16px;margin:0 auto 6px;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.ps-cat .ci img{width:38px;height:38px}
.ps-cat.on .ci{background:rgba(226,176,79,.22);outline:2px solid #E2B04F;outline-offset:2px}
.ps-bans{display:flex;gap:10px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.ps-bans::-webkit-scrollbar{display:none}
.ps-ban{flex:none;width:78%;max-width:300px;scroll-snap-align:start;padding:14px 16px;border-radius:18px;color:#fff}
.ps-ban b{display:block;font-size:16px}
.ps-ban small{font-size:12.5px;opacity:.9}
.ps-brands{display:flex;align-items:center;gap:10px;overflow-x:auto;margin:0 -4px;padding:14px 4px 4px;scrollbar-width:none}
.ps-brands::-webkit-scrollbar{display:none}
.ps-brand{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.ps-brand.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
/* brand chips that show the brand's own logo on its own background colour */
.ps-brand.blogo{height:40px;padding:0 12px;display:flex;align-items:center;border-radius:12px}
.ps-brand.blogo img{height:30px;width:auto;max-width:none;flex:none;display:block}
.ps-brand.blogo.on{outline:2px solid var(--accent);outline-offset:2px}
.ps-brand.txt{height:40px;border-radius:12px}
.ps-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 10px}
.ps-h b{font-size:17px;font-weight:800}
.ps-h small{color:var(--muted);font-size:12.5px}
.ps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:620px){.ps-grid{grid-template-columns:repeat(4,1fr)}}
.ps-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;cursor:pointer;position:relative}
.ps-img{position:relative}
.ps-img img{width:100%;aspect-ratio:1/1;border-radius:10px;object-fit:cover;display:block;background:var(--card2)}
.ps-oos{position:absolute;inset:0;border-radius:10px;background:rgba(255,255,255,.65);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--bad)}
[data-theme="dark"] .ps-oos{background:rgba(13,12,10,.65)}
.ps-addw{position:absolute;right:0;bottom:-8px}
.ps-add{height:30px;min-width:52px;padding:0 8px;border-radius:9px;background:var(--card);border:1.5px solid var(--accent);color:var(--accent-txt);font-weight:800;font-size:12px;box-shadow:0 4px 10px rgba(201,150,46,.18)}
.ps-step{height:30px;min-width:64px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(201,150,46,.3)}
.ps-step button{width:21px;height:30px;color:var(--accent-ink);font-size:16px;font-weight:800}
.ps-step span{padding:0 4px;display:flex;align-items:center;gap:2px}
.ps-pr{margin:12px 2px 0;font-size:14px;font-weight:800}
.ps-pr s{font-size:10.5px;color:var(--muted);font-weight:500;margin-left:3px}
.ps-nm{font-size:12px;font-weight:600;line-height:1.25;margin:2px 2px 0;min-height:30px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ps-op{font-size:10.5px;color:var(--muted);margin:2px 2px 2px}

.gal{position:relative;margin:0 auto 14px;max-width:320px}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;background:#fff;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-track img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:center;background:#fff}
.gal-btn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(10,9,7,.55);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0 0 3px}
.gal-btn:hover{background:rgba(10,9,7,.8)}.gal-btn.prev{left:8px}.gal-btn.next{right:8px}
.gal-dots i{cursor:pointer}
.gal-n{position:absolute;right:10px;bottom:10px;background:rgba(10,9,7,.7);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.gal-dots{display:flex;justify-content:center;gap:5px;margin-top:8px}.gal-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.gal-dots i.on{background:var(--accent);width:16px;border-radius:3px}
.gstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.gstrip .g{position:relative;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.gstrip .g img{width:100%;height:100%;object-fit:cover}
.gstrip .g button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(10,9,7,.75);color:#fff;font-size:13px;line-height:20px;padding:0}
.gstrip .g.main{border:2px solid var(--accent)}
.gstrip .add{display:grid;place-items:center;color:var(--muted);border-style:dashed;cursor:pointer}
.sp-img{display:block;height:210px;width:210px;max-width:100%;margin:0 auto 14px;border-radius:20px;object-fit:cover}
.sp-title{font-size:20px;font-weight:800}
.namerow{display:flex;gap:8px}.namerow input{flex:1;min-width:0}.namerow .btn{flex:none;padding:0 12px;font-size:13px;white-space:nowrap}
.gem2{display:flex;gap:8px;margin:-6px 0 10px}.gem2 .btn{flex:1;padding:8px 10px;font-size:13px;text-align:center;text-decoration:none;color:var(--text)}
.vblock .field{margin-bottom:8px}.vblock{padding:12px}
.addres .row{cursor:pointer;padding:8px 10px}.addres .row img{width:44px;height:44px;background:#fff;object-fit:contain}
/* Product sheets on a desktop/tablet screen: photos left, variants right — everything in one view.
   Phones keep the single column (same order: photos first, then variants). */
@media(min-width:900px){
  .sheet.wide{max-width:1120px}
  .pd2{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:28px;align-items:start}
  .pd2-l{position:sticky;top:0}
  .pd2 .gal{max-width:none;margin:0 0 10px}
  .pf2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .pf2-r{position:sticky;top:0}
  .pf2 .photo-pick{height:150px}

// Nisha Journal Store monogram — gold "NJS" in a double ring, used in the header, login and connect screens
const CROWN = `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lionGold" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E3B0"/><stop offset=".5" stop-color="#E0BB6A"/><stop offset="1" stop-color="#B58635"/></linearGradient></defs><circle cx="50" cy="50" r="46" fill="none" stroke="url(#lionGold)" stroke-width="3.5"/><circle cx="50" cy="50" r="39" fill="none" stroke="url(#lionGold)" stroke-width="1.2"/><text x="50" y="61" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="30" letter-spacing="1" fill="url(#lionGold)">NJS</text></svg>`;

/* ---------- placeholder product art (used when no photo uploaded) ---------- */
const ART = {
  pack:'<rect x="62" y="40" width="76" height="120" rx="8"/><path d="M62 70h76M80 40v-8h40v8"/>',
  pouch:'<path d="M66 50h68l-6 110H72z"/><path d="M66 50l6-12h56l6 12M84 90h32"/>',
  charger:'<rect x="62" y="70" width="76" height="80" rx="14"/><path d="M85 70V45M115 70V45"/><path d="M104 92l-14 20h20l-14 20"/>',
  cable:'<path d="M60 150c0-40 80-30 80-70 0-20-15-30-30-30"/><rect x="92" y="28" width="30" height="24" rx="6"/><rect x="48" y="146" width="24" height="26" rx="5"/>',

  cover:'<rect x="66" y="35" width="68" height="130" rx="16"/><circle cx="88" cy="58" r="8"/><circle cx="88" cy="81" r="8"/>',
  glass:'<rect x="66" y="35" width="68" height="130" rx="16"/><path d="M82 72l36-18M82 102l36-18M82 132l36-18"/>',
  speaker:'<rect x="62" y="40" width="76" height="120" rx="18"/><circle cx="100" cy="115" r="22"/><circle cx="100" cy="68" r="8"/>',
  default:'<path d="M60 82h80l-8 68H68z"/><path d="M80 82a20 20 0 0 1 40 0"/>'

const HUE = { charger:262, cable:205, earphone:325, power:150, cover:22, glass:188, speaker:290, default:245 };
function artKind(catName) {
  const c = (catName || '').toLowerCase();
  if (/cigar|bidi|carton/.test(c)) return 'pack';
  if (/tobacco|khaini|pan|supari|masala|gutkha|fresh/.test(c)) return 'pouch';
  if (/charg|adapter/.test(c)) return 'charger';
  if (/cable|wire|cord/.test(c)) return 'cable';
  if (/ear|neck|head|bud/.test(c)) return 'earphone';
  if (/power ?bank|bank/.test(c)) return 'power';
  if (/cover|case|back/.test(c)) return 'cover';
  if (/glass|guard|screen/.test(c)) return 'glass';
  if (/speaker/.test(c)) return 'speaker';
  return 'default';
}
const artCache = {};
function art(kind) {
  if (artCache[kind]) return artCache[kind];
  // placeholder art: one warm gold tone for all categories (black & gold brand)
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#f4ede0"/><g transform="translate(40 40) scale(.6)" fill="none" stroke="#9a6b14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">${ART[kind]}</g></svg>`;
  return (artCache[kind] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
}

/* =========================================================
   DATA
   ========================================================= */
// The catalogue lives ONLY in the cloud. Nothing is kept on the phone except settings,
// so every phone always shows exactly what is in the cloud.
const DEFAULT_CATS = ['Cigarettes', 'Bidi', 'Chewing Tobacco / Khaini', 'Pan Masala & Supari'];
const emptyState = () => ({ brands: [], cats: [], products: [], log: [], orders: [], meta: { nextOrder: 1001 } });
let S = emptyState();
let loaded = false;                                    // true once the cloud copy has arrived
try { localStorage.removeItem(KEY); } catch (e) {}     // remove the old on-phone copy from earlier versions
let cart = loadJSON(CART_KEY, {});            // { variantId: qty }
let ui = Object.assign({ role: 'owner', tab: 'home', theme: 'light' }, loadJSON(UI_KEY, {}));
const savedRole = ui.role;
const view = { q: '', brand: 'all', cat: 'all', stock: 'all' };

let saveTimer;
function save() {                              // 400ms debounce, same pattern as other apps
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!cloud.key) return toast('Not connected to cloud — this change was not saved');
    cloudPush();
  }, 400);
}
const saveCart = () => localStorage.setItem(CART_KEY, JSON.stringify(cart));
/* =========================================================
   CLOUD SYNC (Cloudflare Worker + D1)
   - Everyone loads the catalogue from the cloud on open.
   - Only a phone with the owner key (OWNER_KEY secret) can save to the cloud.
   - Whole-state save, last write wins (fine with one owner).
   ========================================================= */
const API = 'https://royal-enterprises.naimuddinshaikh74667.workers.dev/';   // shared with Royal for now — data kept apart by STORE
const STORE = 'nisha';
// The Worker is pasted into Cloudflare by hand — if it is older than this, newer features (box sizes for shops,
// fast box reading, …) silently fall back. The app checks once and warns the owner.
const NEED_WORKER = '2026-11-12';
let workerVersion = null, nishaKeySet = true;     // null = not checked yet, '' = old Worker without a version
async function checkWorker() {
  try { const r = await fetch(API + '?action=ping&store=' + STORE).then(x => x.json()); workerVersion = r.version || ''; nishaKeySet = !!r.ownerKeySet && r.store === STORE; } catch (e) { return; }
  if (workerVersion < NEED_WORKER && cloud.key && !SHOP_MODE) toast('Cloudflare Worker is out of date — paste the latest worker.js (see More)');
  if (ui.tab === 'more' && !SHOP_MODE) render();
}
const CLOUD_KEY = 'nj_cloud_v1';
let cloud = Object.assign({ key: '', updated: 0 }, loadJSON(CLOUD_KEY, {}));
let BASE = null;     // the cloud copy this screen last loaded or saved (JSON) — used to merge with other phones/tabs
/* Merge three copies by record id: base = what we started from, mine = this screen, theirs = cloud now.
   A record I changed keeps my version; anything I did not touch takes the cloud's version,
   so an older tab or phone can never wipe edits made somewhere else. */
function mergeList(b = [], m = [], t = [], newFirst = true) {
  const B = new Map(b.map(x => [x.id, JSON.stringify(x)])), M = new Map(m.map(x => [x.id, x])), out = [], seen = new Set();
  for (const x of t) {
    seen.add(x.id);
    if (M.has(x.id)) { const mine = M.get(x.id); out.push(JSON.stringify(mine) !== B.get(x.id) ? mine : x); }
    else if (!B.has(x.id) || JSON.stringify(x) !== B.get(x.id)) out.push(x);   // added there, or changed there after I deleted it
  }
  const mineNew = m.filter(x => !seen.has(x.id) && !B.has(x.id));            // added on this screen
  return newFirst ? [...mineNew, ...out] : [...out, ...mineNew];
}
function mergeStates(base, mine, theirs) {
  return Object.assign({}, theirs, {
    brands: mergeList(base.brands, mine.brands, theirs.brands, false), cats: mergeList(base.cats, mine.cats, theirs.cats, false),
    products: mergeList(base.products, mine.products, theirs.products, true),
    log: mergeList(base.log, mine.log, theirs.log, false).sort((a, b) => a.ts - b.ts),
    orders: mergeList(base.orders, mine.orders, theirs.orders, false),
    meta: Object.assign({}, theirs.meta, { nextOrder: Math.max(num(mine.meta?.nextOrder), num(theirs.meta?.nextOrder)) || 1001 })
  });
}
let cloudStatus = 'idle';       // idle | syncing | ok | error | offline
const saveCloud = () => localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud));

/* ---------- Real shop login ----------
   Each shop gets a private link (…/?s=TOKEN). The shopkeeper opens it and types the shop's mobile.
   The session stays on that phone, so the app (or home-screen icon) opens straight into the shop next time. */
const SHOP_KEY = 'nj_shop_v1';
const LINK_TOKEN = new URLSearchParams(location.search).get('s') || '';
let SHOP = loadJSON(SHOP_KEY, null);                    // { token, sess, shop: { id, name, owner, area } }
if (SHOP && LINK_TOKEN && SHOP.token !== LINK_TOKEN) SHOP = { token: LINK_TOKEN, sess: '' };   // another shop's link → log in again
if (!SHOP && LINK_TOKEN) SHOP = { token: LINK_TOKEN, sess: '' };
const saveShop = () => localStorage.setItem(SHOP_KEY, JSON.stringify(SHOP));
// This phone is a shop phone when it was opened from a shop link, or it has a shop session and no owner key
const SHOP_MODE = !!LINK_TOKEN || (!!(SHOP && SHOP.sess) && !cloud.key);
const shopLoggedIn = () => !!(SHOP && SHOP.sess && SHOP.shop);
const curShop = () => SHOP_MODE ? (SHOP && SHOP.shop) || { id: '', name: 'Shop' } : DEMO_SHOP;
async function api(action, body, timeoutMs) {
  const headers = {};
  if (SHOP_MODE) { if (SHOP && SHOP.sess) headers['X-Shop-Session'] = SHOP.sess; }   // shop phone never sends the owner key
  else if (cloud.key) headers['X-Owner-Key'] = cloud.key;
  const opt = body ? { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { headers };
  if (timeoutMs) opt.signal = AbortSignal.timeout(timeoutMs);
  let r;
  try { r = await fetch(API + '?action=' + action + '&store=' + STORE, opt); }
  catch (e) { throw new Error(e.name === 'TimeoutError' ? 'took too long — try again' : 'no internet'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}
function setCloudStatus(st) { cloudStatus = st; const el = $('#cloudPill'); if (el) el.outerHTML = cloudPill(); }
function cloudPill() {
  const t = { idle: 'Not synced', syncing: 'Syncing…', ok: cloud.key ? 'Synced' : 'Cloud (view only)', error: 'Sync error', offline: 'Offline' }[cloudStatus];
  return `<span id="cloudPill" class="cloudpill ${cloudStatus === 'ok' ? 'ok' : cloudStatus === 'error' ? 'err' : ''}">${ic('cloud', 'style="width:13px;height:13px"')}${t}</span>`;
}
// Load the shared catalogue; replaces this phone's copy when the cloud has newer data
async function cloudLoad(quiet) {
  if (!cloud.key) { setCloudStatus('idle'); render(); return null; }
  setCloudStatus('syncing');
  try {
    const r = await api('getAll');
    S = Object.assign(emptyState(), r.state || {}); cloud.updated = r.updated; saveCloud(); BASE = JSON.stringify(S);
    loaded = true; render();
    if (!quiet) toast('Catalogue refreshed');
    setCloudStatus('ok');
    return r;
  } catch (e) {
    if (e.status === 401) { cloud.key = ''; saveCloud(); toast('Owner key rejected — connect again'); }
    setCloudStatus(navigator.onLine ? 'error' : 'offline'); render(); return null;
  }
}
let pushTimer, pushing = false, pendingPush = false;
function cloudPush() {
  if (!cloud.key) return;
  clearTimeout(pushTimer); pendingPush = true;
  pushTimer = setTimeout(async () => {
    if (pushing) return cloudPush();
    pushing = true; pendingPush = false; setCloudStatus('syncing');
    try {
      // someone saved from another phone/tab since we loaded → merge instead of overwriting their edits
      const cur = await api('getAll');
      let merged = false;
      if (cur.state && cur.updated !== cloud.updated && BASE) { S = mergeStates(JSON.parse(BASE), S, Object.assign(emptyState(), cur.state)); merged = true; }
      const r = await api('saveAll', { state: S }); cloud.updated = r.updated; saveCloud(); BASE = JSON.stringify(S); setCloudStatus('ok');
      if (merged) { render(); toast('Saved · merged with changes from another phone/tab'); }

/* ---------- Box (pack) quantities ----------
   v.box = pieces in one box. Stock and orders are always counted in PIECES underneath;
   boxes are only how they are shown and how shops pick quantities (whole boxes only when box > 1). */
/* ---------- Sale units (Nisha) ----------
   unit 'pc'  : sold per piece / packet          → shops order pieces
   unit 'box' : box / carton / bundle of N pieces → shops order whole boxes (stock still counted in pieces)
   unit 'kg'  : weighed (loose)                   → shops order in 0.25 kg steps (stock counted in kg) */
const KG_STEP = 0.25;
const r3 = n => Math.round(num(n) * 1000) / 1000;                        // kg maths without 0.30000000004
const unitOf = v => (v && v.unit) || 'pc';
const isKg = v => unitOf(v) === 'kg';
const kgStep = v => num(v && v.step) > 0 ? num(v.step) : KG_STEP;
const perBox = v => unitOf(v) === 'box' ? Math.max(1, Math.round(num(v.box)) || 1) : 1;

function qtyTxt(v, q) {               // 25 pcs, box of 10 → "2 box + 5 pcs"; kg → "1.75 kg"
  if (isKg(v)) return r3(q) + ' kg';
  const b = perBox(v), pcs = Math.round(num(q));
  if (b <= 1) return pcs + ' pcs';
  const n = Math.floor(Math.abs(pcs) / b) * Math.sign(pcs || 1), r = pcs - n * b;
  return [n ? n + ' box' : '', r ? r + ' pcs' : ''].filter(Boolean).join(' + ') || '0 box';
}
const boxTag = v => isKg(v) ? `Sold by kg (${kgStep(v)} kg steps)` : perBox(v) > 1 ? `Box of ${perBox(v)}` : 'Sold per piece';
const shopStep = v => isKg(v) ? kgStep(v) : perBox(v);                   // added per tap of +
const shopMax = v => isKg(v) ? r3(Math.floor(num(v.stock) / kgStep(v) + 1e-9) * kgStep(v)) : Math.floor(num(v.stock) / perBox(v)) * perBox(v);

const shownStep = v => isKg(v) ? kgStep(v) : 1;

// "12 pcs · 1.5 kg" for a mix of counted and weighed items
function mixTxt(list) {                // list of [variant, qty]
  let pcs = 0, kg = 0;
  list.forEach(([v, q]) => { if (isKg(v)) kg += num(q); else pcs += num(q); });
  return [pcs ? pcs + ' pcs' : '', kg ? r3(kg) + ' kg' : ''].filter(Boolean).join(' · ') || '0';

}

async function setOrderStatus(id, status) {

    if (short.length) return toast('Not enough stock: ' + short.map(x => x.name + ' ' + x.label).join(', '));
  }
  if (status === 'cancelled' && !confirm(wasOut ? 'Cancel this confirmed order? Its items go back into stock.' : 'Cancel this order?')) return;

    try { await api('orderSetStatus', { id: o.id, status }); }
    catch (e) { return toast('Could not update the order — ' + e.message); }
  }
  // stock moves only after the cloud accepted the new status
  if (status === 'confirmed' && !wasOut) o.items.forEach(x => { const f = findV(x.vid); if (f) applyStock(f.p.id, f.v.id, -x.qty, 'order', o.no); });

function useMyLocation() {
  if (!navigator.geolocation) return toast('Location is not available on this phone');
  toast('Finding location…');
  navigator.geolocation.getCurrentPosition(
    p => { const el = $('#sfMap'); if (el) el.value = p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6); toast('Location added (stand inside the shop for best result)'); },
    () => toast('Could not get location — allow location access and try again'),

async function saveShopForm() {
  const v = id => ($(id).value || '').trim();
  const shop = { id: SF.id, name: v('#sfName'), owner: v('#sfOwner'), mobile: v('#sfMobile').replace(/\D/g, '').slice(-10), area: v('#sfArea'), address: v('#sfAddr'), map: v('#sfMap'), credit_limit: v('#sfCredit') };
  if (!shop.name) return toast('Enter the shop name');
  if (shop.mobile.length !== 10) return toast('Enter a 10-digit mobile number');
  const btn = $('#sfSave'); btn.disabled = true;
  let r;
  try { r = await api('shopSave', { shop }); }
  catch (e) { btn.disabled = false; return toast(e.message); }
  const i = SHOPS.list.findIndex(x => x.id === r.shop.id);
  if (i >= 0) SHOPS.list[i] = r.shop; else SHOPS.list.push(r.shop);
  renderShopList();
  openShop(r.shop.id);
  toast(shop.id ? 'Shop saved' : 'Shop added — now send the link');
}
async function toggleShop(id) {
  const sh = SHOPS.list.find(x => x.id === id); if (!sh) return;
  if (sh.active && !confirm(`Disable ${sh.name}? Their link stops working and they cannot order until you enable them again.`)) return;
  try { await api('shopToggle', { id, active: !sh.active }); } catch (e) { return toast(e.message); }
  sh.active = sh.active ? 0 : 1; renderShopList(); openShop(id);
  toast(sh.active ? 'Shop enabled' : 'Shop disabled');
}
async function resetShopLink(id) {
  const sh = SHOPS.list.find(x => x.id === id); if (!sh) return;
  if (!confirm(`Make a new link for ${sh.name}? The old link stops working and their phone is logged out.`)) return;
  let r; try { r = await api('shopResetLink', { id }); } catch (e) { return toast(e.message); }

}
async function copyShopLink(id) {
  const sh = SHOPS.list.find(x => x.id === id); if (!sh) return;
  try { await navigator.clipboard.writeText(shopLink(sh)); toast('Link copied'); }

function sendShopLink(id) {
  const sh = SHOPS.list.find(x => x.id === id); if (!sh) return;
  const msg = `Namaste ${sh.owner || sh.name} 🙏\n\nYou can now order from *Nisha Journal Store* on your phone:\n${shopLink(sh)}\n\nOpen the link and log in with this mobile number. Tip: in Chrome tap ⋮ → "Add to Home screen" to keep it as an app.`;
  window.open('https://wa.me/91' + sh.mobile + '?text=' + encodeURIComponent(msg), '_blank');

function filterChips(kind) {
  const list = kind === 'brand' ? S.brands : S.cats;

  return `<div class="chips"><button class="chip ${cur === 'all' ? 'on' : ''}" onclick="${fn}('all')">All ${kind === 'brand' ? 'brands' : 'categories'}</button>` +
    list.map(x => `<button class="chip ${cur === x.id ? 'on' : ''}" onclick="${fn}('${x.id}')">${esc(x.name)}</button>`).join('') + '</div>';
}
function setBrandF(id) { view.brand = id; ui.role === 'shop' ? renderShopGrid() : renderProducts(); }
function setCatF(id) { view.cat = id; ui.role === 'shop' ? (renderCatChips(), renderShopGrid()) : renderProducts(); }
function matchP(p) {
  const q = view.q.trim().toLowerCase();
  if (view.brand !== 'all' && p.brandId !== view.brand) return false;
  if (view.cat !== 'all' && p.catId !== view.cat) return false;

  return (p.name + ' ' + brandName(p.brandId) + ' ' + catName(p.catId) + ' ' + p.variants.map(v => v.label + ' ' + v.sku).join(' ')).toLowerCase().includes(q);
}
function renderProducts() {

/* ---------- Photo gallery (product photos + variant photos, swipeable) ---------- */
function galleryOf(p) {
  // product photos (main first); variant photos only if the product has none of its own
  let list = [p.photo, ...(p.photos || [])].filter(Boolean);
  if (!list.length) list = p.variants.map(v => v.photo).filter(Boolean);
  const out = [...new Set(list)];
  return out.length ? out : [imgP(p)];
}
function galleryHTML(p) {
  const imgs = galleryOf(p), gid = 'g' + p.id;
  if (imgs.length === 1) return `<div class="gal"><div class="gal-track"><img src="${imgs[0]}" alt=""></div></div>`;
  return `<div class="gal"><div class="gal-track" id="${gid}" onscroll="galScroll(this,${imgs.length})">${imgs.map(u => `<img src="${u}" alt="" loading="lazy">`).join('')}</div>
    <button class="gal-btn prev" onclick="galGo('${gid}',-1)" aria-label="Previous photo">&#8249;</button>
    <button class="gal-btn next" onclick="galGo('${gid}',1)" aria-label="Next photo">&#8250;</button>
    <span class="gal-n" id="${gid}-n">1/${imgs.length}</span></div>
    <div class="gal-dots" id="${gid}-d">${imgs.map((_, i) => `<i class="${i ? '' : 'on'}" onclick="galGo('${gid}',0,${i})"></i>`).join('')}</div>`;
}
// Arrow / dot navigation (desktop has no swipe). step = ±1, or jump to index `to`; wraps around.
function galGo(gid, step, to) {
  const el = $('#' + gid); if (!el) return;
  const n = el.children.length, cur = Math.round(el.scrollLeft / el.clientWidth);
  const i = to != null ? to : (cur + step + n) % n;
  el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' });
}
function galScroll(el, n) {
  const i = Math.round(el.scrollLeft / el.clientWidth);
  const c = $('#' + el.id + '-n'); if (c) c.textContent = (i + 1) + '/' + n;
  $('#' + el.id + '-d')?.querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === i));
}

function pickOrAdd(sel, kind) {

/* ---------- SKU rule (Nisha): NJ-BRAND-PRODUCT-PACK, e.g. NJ-GFL-KINGS-20, NJ-VML-PM-10, NJ-RJN-SUP-1KG ----------
   BRAND: 3 letters — initials of a 2-word brand + next consonant (Gold Flake → GFL), else first letter + next 2 consonants (Vimal → VML).
   PRODUCT: the product name without the brand — several words → initials (Pan Masala → PM); one word → itself if ≤5 letters (Kings), else first 3 (Supari → SUP).
   PACK: weight with unit (100 g → 100G, 1 kg → 1KG), else the first number (20 Sticks → 20, ₹10 Pouch → 10). */
const words = t => String(t || '').replace(/[^A-Za-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
function brandCode(name) {
  const w = words(name); if (!w.length) return 'GEN';
  const cons = t => t.slice(1).replace(/[^bcdfghjklmnpqrstvwxyz0-9]/gi, '');

  if (w.length > 1) return w.map(x => /\d/.test(x) ? x : x[0]).join('').slice(0, 5).toUpperCase();

/* Make an uploaded product photo look like the brand-website images:
   off-white / light-grey background → pure white, then trim empty margins
   so the product fills ~88% of a square white canvas. Runs on the phone, free.
   Skipped if the photo's edges are not a light, plain background. */
// Encode a canvas as JPEG at the best quality that still fits the cloud's ~1 MB photo limit.
function encodeFit(c) {
  for (const q of [.95, .92, .88, .84, .8]) { const u = c.toDataURL('image/jpeg', q); if (u.length < 1_350_000) return u; }
  const s = document.createElement('canvas'); s.width = Math.round(c.width * .75); s.height = Math.round(c.height * .75);
  s.getContext('2d').drawImage(c, 0, 0, s.width, s.height); return encodeFit(s);
}
// Scale a canvas down so its longest side is at most `max` (never up).
function fitCanvas(c, max) {
  const k = Math.min(1, max / Math.max(c.width, c.height)); if (k === 1) return c;
  const s = document.createElement('canvas'); s.width = Math.round(c.width * k); s.height = Math.round(c.height * k);
  const g = s.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, s.width, s.height); return s;
}
function catalogueClean(dataUrl, out = 1600, onlyIfGrey = false) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const w = img.width, h = img.height;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0);   // transparent PNG → white
      const id = g.getImageData(0, 0, w, h), d = id.data;
      // 1. background level = median brightness of the border pixels
      // Sample rings at several insets: older photos have a white frame around a grey
      // inner background, so the outermost ring alone would look "already white".
      const at = (x, y) => { const i = (y * w + x) * 4; return [d[i], d[i + 1], d[i + 2]]; };
      let bg = 999, sat = 0;
      for (const f of [0, .03, .06, .09, .12]) {
        const ix = Math.round(w * f), iy = Math.round(h * f), ring = [];
        for (let x = ix; x < w - ix; x += 2) ring.push(at(x, iy), at(x, h - 1 - iy));
        for (let y = iy; y < h - iy; y += 2) ring.push(at(ix, y), at(w - 1 - ix, y));
        const lum = ring.map(p => (p[0] + p[1] + p[2]) / 3).sort((a, b) => a - b);
        const med = lum[Math.floor(lum.length / 2)];
        const rs = ring.reduce((m, p) => m + Math.max(...p) - Math.min(...p), 0) / ring.length;
        if (med >= 200 && rs <= 25 && med < bg) { bg = med; sat = rs; }   // darkest plain light ring = real background
      }
      if (bg === 999) { bg = 0; sat = 99; }
      if (bg < 200 || sat > 25) return res(onlyIfGrey ? null : encodeFit(fitCanvas(c, out)));   // not a plain light background — leave as is
      if (onlyIfGrey && bg >= 252) return res(null);          // already white (e.g. brand-website photo) — nothing to fix
      // 2. lift the background to pure white (gentle gain, then snap near-white to 255)
      const gain = Math.min(1.15, 255 / Math.max(bg - 4, 1));
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        let r = Math.min(255, d[i] * gain), gg = Math.min(255, d[i + 1] * gain), b = Math.min(255, d[i + 2] * gain);
        const mn = Math.min(r, gg, b), mx = Math.max(r, gg, b);
        if (mx - mn < 12 && mn > 236) {                        // near-white, colourless → fade smoothly to pure white
          const t = Math.min(1, (mn - 236) / 14), k = t * t * (3 - 2 * t);   // smoothstep: no hard edges
          r += (255 - r) * k; gg += (255 - gg) * k; b += (255 - b) * k;
        }
        else if (mn < 240 || mx - mn > 18) {                    // real product pixel → grow bounding box
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
        d[i] = r; d[i + 1] = gg; d[i + 2] = b;
      }
      g.putImageData(id, 0, 0);
      if (x1 < 0) return res(onlyIfGrey ? null : encodeFit(fitCanvas(c, out)));
      // 3. trim + centre on a square white canvas, product ≈ 88% of the frame
      const bw = x1 - x0 + 1, bh = y1 - y0 + 1, side = Math.max(bw, bh) / .88;
      out = Math.min(out, Math.round(side));                 // never upscale (keeps it sharp)
      const o = document.createElement('canvas'); o.width = o.height = out;
      const og = o.getContext('2d'); og.fillStyle = '#fff'; og.fillRect(0, 0, out, out);
      const k = out / side; og.imageSmoothingQuality = 'high';
      og.drawImage(c, x0, y0, bw, bh, (out - bw * k) / 2, (out - bh * k) / 2, bw * k, bh * k);
      res(encodeFit(o));
    };
    img.onerror = () => res(onlyIfGrey ? null : dataUrl);
    if (!dataUrl.startsWith('data:')) { img.crossOrigin = 'anonymous'; dataUrl += (dataUrl.includes('?') ? '&' : '?') + 'cors=1'; }
    img.src = dataUrl;
  });
}

// Shrinks phone photos (often 3–5 MB) to ~60 KB so storage stays small
function compressImage(file, max = 720, quality = .72) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const g = c.getContext('2d'); g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);   // transparent PNG → white
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ---------- Product name from a box photo (Gemini reads the box) ----------
   The Worker asks Gemini. If Google blocks the Worker's location, it hands back the request
   and this phone (India) makes the same call itself. */
// When Google blocks the Worker's location, the phone remembers that (for this session only) and
// asks Gemini directly next time — saving the Worker's wasted attempt on every box.
let directGemini = null;      // { models, body, key } from the Worker's first hand-over
async function readBox(base64) {
  let r;
  if (directGemini) {
    const body = JSON.parse(JSON.stringify(directGemini.body));
    body.contents[0].parts[0].inline_data.data = base64;
    r = { clientCall: { models: directGemini.models, body }, key: directGemini.key };
  } else {
    r = await api('analyzePhoto', { image: base64, mode: 'pack' }, 35000);   // never hang longer than this
    if (!r.clientCall) return r;
    try { r.clientCall.body.contents[0].parts[0].inline_data.data = base64; } catch (e) {}
    directGemini = { models: r.clientCall.models, body: r.clientCall.body, key: r.key };
  }
  let last = '';
  for (const model of r.clientCall.models) {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': r.key }, body: JSON.stringify(r.clientCall.body), signal: AbortSignal.timeout(20000) }).catch(e => ({ ok: false, json: async () => ({ error: { message: 'took too long' } }) }));
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { last = (j.error && j.error.message) || 'HTTP ' + res.status; continue; }   // busy / retired → next model
    const text = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    try { return JSON.parse(text); } catch (e) { last = 'unreadable answer'; }
  }
  throw new Error('Gemini busy — ' + last);
}

function setAdjMode(m, btn) {
  adj.mode = m;
  document.querySelectorAll('#adjSeg button').forEach(b => b.classList.toggle('on', b === btn));
  const box = !!$('#adjBox'), kg = isKg(getV(getP(adj.pid), adj.vid));
  $('#adjLbl').textContent = { in: box ? 'Boxes received' : kg ? 'Kg received' : 'Quantity received', out: box ? 'Boxes removed' : kg ? 'Kg removed' : 'Quantity removed', set: box ? 'Boxes on shelf' : kg ? 'Kg on shelf' : 'Actual count on shelf' }[m];
}
// pieces typed in the adjust sheet (boxes × pcs-per-box + loose pieces, or plain pieces)
function adjPieces(v) { return $('#adjBox') ? Math.round(num($('#adjBox').value)) * perBox(v) + Math.round(num($('#adjPcs').value)) : isKg(v) ? r3($('#adjQty').value) : Math.round(num($('#adjQty').value)); }
function adjShow() { const v = getV(getP(adj.pid), adj.vid), el = $('#adjSum'); if (v && el) el.textContent = `= ${adjPieces(v)} pcs (1 box = ${perBox(v)} pcs)`; }
function saveAdjust() {
  const p = getP(adj.pid), v = getV(p, adj.vid);
  const q = adjPieces(v);
  if (adj.mode !== 'set' && q <= 0) return toast('Enter a quantity');
  if (adj.mode === 'set' && q < 0) return toast('Count cannot be negative');
  const delta = r3(adj.mode === 'in' ? q : adj.mode === 'out' ? -q : q - v.stock);
  if (v.stock + delta < 0) return toast('Stock cannot go below zero');
  if (delta === 0) { closeSheet(); return; }
  applyStock(p.id, v.id, delta, adj.mode === 'set' ? 'count' : adj.mode, $('#adjNote').value.trim());
  save(); closeSheet(); render(); toast(`Stock ${delta > 0 ? '+' : ''}${delta} → ${v.stock}`);
}
// Every stock change goes through here so the history log is always complete
function applyStock(pid, vid, delta, type, note = '') {
  const v = getV(getP(pid), vid); if (!v) return;
  v.stock = r3(num(v.stock) + delta);                 // r3: kg stock stays clean (1.75, not 1.7500000001)
  S.log.push({ id: uid(), ts: Date.now(), pid, vid, qty: delta, type, note, by: ui.role });
}
function openHistory() {

  const list = kind === 'brand' ? S.brands : S.cats, it = list.find(x => x.id === id);

      ${shopMax(v) > 0 && num(v.dist) > 0 ? `<div class="stepper ${tmp[v.id] ? '' : 'zero'}" id="st-${v.id}"><button onclick="stepTmp('${v.id}',-1)">−</button><input id="tq-${v.id}" type="number" inputmode="${isKg(v) ? 'decimal' : 'numeric'}" step="${shownStep(v)}" value="${showQ(v, tmp[v.id] || 0)}" onchange="setTmp('${v.id}',this.value)"><button onclick="stepTmp('${v.id}',1)">+</button></div>` : ''}</div>`).join('')}

function setTmp(vid, val, fromStep) {           // val = kg, boxes or pieces (what the stepper shows); tmp keeps pieces / kg
  const f = findV(vid); if (!f) return;
  let q = fromShown(f.v, Math.max(0, num(val)));
  if (q > shopMax(f.v)) { q = shopMax(f.v); toast(`Only ${qtyTxt(f.v, q)} available`); }
  if (q) tmp[vid] = q; else delete tmp[vid];
  const inp = $('#tq-' + vid), n = showQ(f.v, q); if (inp && (fromStep || String(n) !== inp.value)) inp.value = n;
  $('#vo-' + vid)?.classList.toggle('sel', q > 0);
  $('#st-' + vid)?.classList.toggle('zero', q === 0);
  updateAddBtn();
}
function stepTmp(vid, d) { const f = findV(vid); if (f) setTmp(vid, showQ(f.v, tmp[vid] || 0) + d * shownStep(f.v), true); }
function updateAddBtn() {
  const p = getP(tmpPid);
  const ent = Object.entries(tmp).map(([vid, q]) => [getV(p, vid), q]).filter(x => x[0]);
  const amt = ent.reduce((a, [v, q]) => a + q * num(v.dist), 0);
  const hadInCart = p.variants.some(v => cart[v.id]);
  const b = $('#addBtn'); if (!b) return;
  const boxes = ent.reduce((a, [v, q]) => a + (perBox(v) > 1 ? q / perBox(v) : 0), 0);
  b.innerHTML = ent.length ? `${ic('cart')} ${hadInCart ? 'Update cart' : 'Add to cart'} · ${boxes ? boxes + ' box · ' : ''}${mixTxt(ent)} · ${inr(amt)}` : (hadInCart ? `${ic('trash')} Remove from cart` : 'Select a quantity');
  b.disabled = !ent.length && !hadInCart;
}
function commitTmp() {
  const p = getP(tmpPid);
  p.variants.forEach(v => { if (tmp[v.id]) cart[v.id] = tmp[v.id]; else delete cart[v.id]; });
  saveCart();
  const added = Object.keys(tmp).length > 0;
  closeSheet(); renderShopGrid(); updateCartBar();
  toast(added ? 'Cart updated' : 'Removed from cart');
}
function cartTotals() {
  // unknown items are dropped only once the catalogue has loaded (else the cart would empty on startup)
  let amt = 0, lines = 0; const ent = [];
  for (const [vid, q] of Object.entries(cart)) { const f = findV(vid); if (!f) { if (loaded) delete cart[vid]; continue; } ent.push([f.v, q]); amt += q * num(f.v.dist); lines++; }
  return { qty: ent.length, amt, lines, txt: mixTxt(ent) };
}
function updateCartBar() {
  const bar = $('#cartbar');
  if (ui.role !== 'shop') { bar.classList.remove('show'); return; }
  const t = cartTotals();
  bar.innerHTML = `<div><small>${t.lines} item${t.lines > 1 ? 's' : ''} · ${t.txt}</small><br><b>${inr(t.amt)}</b></div><div class="go">View cart ${ic('arrow', 'style="width:16px;height:16px"')}</div>`;
  bar.classList.toggle('show', t.qty > 0);
}
function openCart() {
  const t = cartTotals();
  if (!t.qty) { closeSheet(); updateCartBar(); return; }
  const lines = Object.entries(cart).map(([vid, q]) => {
    const { p, v } = findV(vid);
    const b = perBox(v);
    return `<div class="vopt"><img src="${imgV(p, v)}" alt=""><div class="grow"><b>${esc(p.name)}</b><div class="muted" style="font-size:12.5px">${esc(v.label)} · ${inr(v.dist)}/${uWord(v)}${b > 1 ? ` · ${q / b} box × ${b} = ${q} pcs` : isKg(v) ? ` · ${r3(q)} kg` : ''}</div><div class="price">${inr(q * v.dist)}</div></div>
      <div class="stepper"><button onclick="stepCart('${vid}',-1)">−</button><input type="number" inputmode="${isKg(v) ? 'decimal' : 'numeric'}" step="${shownStep(v)}" value="${showQ(v, q)}" onchange="setCart('${vid}',this.value)"><button onclick="stepCart('${vid}',1)">+</button></div></div>`;
  }).join('');
  openSheet(sheetHead('Your order', `${esc(curShop().name)}${curShop().id ? ' · ' + esc(curShop().id) : ''}`) + lines + `
    <div class="total-row"><span>Total <small class="muted" style="font-size:13px;font-weight:500">${t.txt}</small></span><span>${inr(t.amt)}</span></div>
    ${SHOP_MODE ? `<div class="field" style="margin-top:8px"><label>Note for Nisha Journal Store (optional)</label><input id="orderNote" placeholder="e.g. deliver after 4 pm"></div>
    <button class="btn gold block" id="placeBtn" onclick="submitOrder()">${ic('check')} Place order</button>`
    : `<div class="note">Preview only — orders are placed by shops from their own link (Shops tab → Send link).</div>`}`);
}
function setCart(vid, val) {                      // val = kg, boxes or pieces (what the stepper shows)
  const f = findV(vid); if (!f) return;
  let q = fromShown(f.v, Math.max(0, num(val)));
  if (q > shopMax(f.v)) { q = shopMax(f.v); toast(`Only ${qtyTxt(f.v, q)} available`); }
  if (q) cart[vid] = q; else delete cart[vid];
  saveCart(); updateCartBar(); renderShopGrid(); openCart();
}
function stepCart(vid, d) { const f = findV(vid); if (f) setCart(vid, showQ(f.v, cart[vid] || 0) + d * shownStep(f.v)); }
async function submitOrder() {
  if (!SHOP_MODE) return toast('Preview only');
  const items = Object.entries(cart).map(([vid, qty]) => ({ vid, qty }));
  if (!items.length) return;
  const btn = $('#placeBtn'); btn.disabled = true; btn.textContent = 'Placing order…';
  let r;
  try { r = await api('shopPlaceOrder', { items, note: ($('#orderNote')?.value || '').trim() }); }
  catch (e) {
    btn.disabled = false; btn.innerHTML = `${ic('check')} Place order`;
    if (e.status === 401) return shopSessionLost();
    return toast(e.message);
  }
  cart = {}; saveCart(); updateCartBar(); renderShopGrid();
  openSheet(`<div class="success"><div class="tick">${ic('check')}</div><h2>Order placed!</h2>
    <p class="muted" style="margin:8px 0 2px">Order <b style="color:var(--text)">${esc(r.no)}</b> · ${inr(r.total)}</p>
    <p class="muted" style="font-size:13px;margin:0 0 18px">Nisha Journal Store will confirm and deliver soon.</p>
    <div class="grid2"><button class="btn ghost" onclick="openMyOrders()">My orders</button><button class="btn gold" onclick="closeSheet()">Continue shopping</button></div></div>`);
}

/* ---------- Shop phone: login, catalogue, account, my orders ---------- */
let shopLinkName = '';
function renderShopLogin() {
  main.innerHTML = `<div class="card" style="margin-top:34px;padding:26px 20px;text-align:center">
    <div style="width:84px;height:84px;margin:0 auto 14px;border-radius:22px;background:#0f2e22;display:grid;place-items:center">${CROWN.replace(/lionGold/g, 'lionGoldLogin').replace('<svg ', '<svg style="height:62px;width:auto" ')}</div>
    <div class="muted" style="font-size:12.5px;letter-spacing:.08em;text-transform:uppercase">Nisha Journal Store</div>
    <h2 style="margin:6px 0 4px" id="loginShop">${esc(shopLinkName || 'Shop login')}</h2>
    <p class="muted" style="margin:0 0 18px" id="loginMsg">Enter your shop's mobile number to start ordering.</p>
    <div class="field" style="text-align:left"><label>Mobile number</label><input id="loginMob" type="tel" inputmode="numeric" maxlength="14" placeholder="10-digit mobile" onkeydown="if(event.key==='Enter')doShopLogin()"></div>
    <button class="btn gold block" id="loginBtn" onclick="doShopLogin()">Log in</button></div>`;
  if (!SHOP || !SHOP.token) { $('#loginMsg').textContent = 'Open your shop link again to log in.'; $('#loginBtn').disabled = true; return; }
  if (!shopLinkName) api('shopInfo&s=' + encodeURIComponent(SHOP.token))
    .then(r => { shopLinkName = r.name; const h = $('#loginShop'); if (h) h.textContent = r.name; })
    .catch(e => { const m = $('#loginMsg'); if (m) m.textContent = e.message; const b = $('#loginBtn'); if (b) b.disabled = true; });
}
async function doShopLogin() {
  const mobile = ($('#loginMob').value || '').replace(/\D/g, '').slice(-10);
  if (mobile.length !== 10) return toast('Enter your 10-digit mobile number');
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const r = await api('shopLogin', { token: SHOP.token, mobile });
    SHOP.sess = r.sess; SHOP.shop = r.shop; saveShop();
    // the link has done its job — keep the address bar clean so the token is not shared by accident
    if (LINK_TOKEN) history.replaceState(null, '', location.pathname);
    loaded = false; render(); shopLoad(true);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Log in';
    const m = $('#loginMsg'); if (m) { m.textContent = e.message; m.style.color = 'var(--bad)'; }
  }
}
function shopSessionLost() {
  SHOP.sess = ''; saveShop(); loaded = false; S = emptyState(); closeSheet(); render();
  toast('Please log in again');
}
async function shopLoad(quiet) {
  if (!shopLoggedIn()) return;
  const first = !loaded;
  try {
    const r = await api('shopCatalog');
    S = Object.assign(emptyState(), r.state || {}); loaded = true;
    if (first || !$('#shopGrid')) render(); else { renderCatChips(); renderBrandBar(); renderShopGrid(); updateCartBar(); }
    if (!quiet) toast('Products refreshed');
  } catch (e) {
    if (e.status === 401) return shopSessionLost();
    if (first) main.innerHTML = `<div class="empty card" style="margin-top:30px">Could not load products — ${esc(navigator.onLine ? e.message : 'no internet')}<br><br><button class="btn gold" onclick="shopLoad()">Try again</button></div>`;
    else toast('Could not refresh — check internet');
  }
}
function openShopAccount() {
  const sh = curShop();
  const row = (icon, t, sub, on) => `<button class="row" onclick="${on}"><span class="adj">${ic(icon)}</span><div class="grow" style="text-align:left"><b>${t}</b>${sub ? `<div class="sub">${sub}</div>` : ''}</div></button>`;
  openSheet(sheetHead(esc(sh.name), [sh.id, sh.owner, sh.area].filter(Boolean).map(esc).join(' · ')) + `<div class="list">
    ${row('cart', 'My orders', 'Orders you placed and their status', 'openMyOrders()')}
    ${row('sync', 'Refresh products', 'Get the latest rates and stock', 'closeSheet();shopLoad()')}
    ${installRow()}
    ${row(ui.theme === 'dark' ? 'sun' : 'moon', (ui.theme === 'dark' ? 'Light' : 'Dark') + ' mode', '', 'closeSheet();toggleTheme()')}
    ${row('x', 'Log out', 'You can log in again with your mobile number', 'shopLogout()')}</div>`);
}
function shopLogout() {
  if (!confirm('Log out of this phone?')) return;
  cart = {}; saveCart(); shopSessionLost();
}
let MYORD = [];
async function openMyOrders() {
  openSheet(sheetHead('My orders', esc(curShop().name)) + '<div class="list" id="myOrd"><div class="empty card">Loading…</div></div>');
  try { MYORD = (await api('shopMyOrders')).orders || []; }
  catch (e) { if (e.status === 401) return shopSessionLost(); const el = $('#myOrd'); if (el) el.innerHTML = `<div class="empty card">${esc(e.message)}</div>`; return; }
  const el = $('#myOrd'); if (!el) return;
  el.innerHTML = MYORD.map((o, i) => orderRow(o, `openMyOrder(${i})`)).join('') || '<div class="empty card">No orders yet</div>';
}
function openMyOrder(i) {
  const o = MYORD[i]; if (!o) return;
  const lbl = o.status === 'new' ? 'Placed — waiting for confirmation' : ORDER_LBL[o.status] || o.status;
  openSheet(sheetHead(esc(o.no), `${fmtDT(o.ts)} · <span class="pill ${ORDER_PILL[o.status] || ''}">${lbl}</span>`) + orderLinesHTML(o)
    + `<button class="btn ghost block" style="margin-top:14px" onclick="openMyOrders()">← All my orders</button>`);
}

/* =========================================================
   BOOT
   ========================================================= */
$('#logoCrown').innerHTML = CROWN;
applyTheme();
render();
if (SHOP_MODE) shopLoad(true);
else { cloudLoad(true); loadOrders(); checkWorker(); }
/* ---------- Install as an app (home-screen icon) ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let installEvt = null;
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (ui.tab === 'more' || ui.role === 'shop') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Installed — open Nisha from your home screen'); render(); });
async function installApp() {
  if (installEvt) { installEvt.prompt(); await installEvt.userChoice; installEvt = null; render(); return; }
  if (isIOS) return alert('On iPhone: tap the Share button (square with arrow) in Safari → "Add to Home Screen".');
  alert('Open this page in Chrome → tap ⋮ (top right) → "Install app" or "Add to Home screen".');
}
function installRow() {
  if (isInstalled()) return '';
  return `<button class="row" onclick="installApp()"><span class="adj" style="color:var(--accent-txt)">${ic('in')}</span><div class="grow" style="text-align:left"><b>Install app on this phone</b><div class="sub">Adds the Nisha icon to your home screen</div></div></button>`;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (SHOP_MODE) return shopLoad(true);                 // shop phone: fresh rates & stock when reopened
  if (!cloud.key) return cloudLoad(true);
  loadOrders();                                          // owner phone: pick up new orders
  if (!pushing && !pendingPush && !$('#sheetWrap').classList.contains('open')) cloudLoad(true);   // and other phones' edits
});
</script>
</body>
