/* ════════════ Driver Ledger (kept by the Driver Manager) ════════════
   Drivers under the manager pay him; platform money for their trips lands in his bank.
     driver owes = daily rent − platform money to bank − cash given
   Entered by the manager in his app; shown here for you to check. Same maths as driver.html. */
let LEDGER = null, ledgerAll = {};
async function loadLedger() {
  if (!cloudCfg()) return;
  try {
    const r = await cloudFetch('/ledger');
    if (r.status < 400) { LEDGER = r.body; const box = document.getElementById('ledgerBox'); if (box) box.innerHTML = ledgerHtml(); }
  } catch {}
}
function inr2(n) { const a = Math.abs(Math.round(n * 100) / 100);
  return (n < -0.004 ? '−₹' : '₹') + a.toLocaleString('en-IN', { minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
function ledgerDays(drv) {
  const es = LEDGER.entries.filter(e => e.driverId === drv.id), today = todayStr();
  const last = drv.endDate && drv.endDate < today ? drv.endDate : today;
  const dates = new Set();
  for (let d = parseYmd(drv.startDate), i = 0; ymd(d) <= last && i < 3000; d = addDays(d, 1), i++) dates.add(ymd(d));
  es.forEach(e => dates.add(e.date));
  let bal = 0;
  return [...dates].sort().map(date => {
    const of = k => es.filter(e => e.date === date && e.kind === k).reduce((t, e) => t + num(e.amount), 0);
    const rentDay = date >= drv.startDate && date <= last ? num(drv.rent) : 0;
    const waive = Math.min(of('waive'), rentDay), rent = rentDay - waive, credit = of('credit'), cash = of('cash');
    bal = Math.round((bal + rent - credit - cash) * 100) / 100;
    return { date, rent, waive, credit, cash, bal };
  });
}
function ledgerHtml() {
  if (!LEDGER) return '';
  if (!LEDGER.drivers.length) return '<div class="card"><h3>Driver ledger</h3><div class="muted" style="font-size:13px">No drivers under the Driver Manager yet.</div></div>';
  return LEDGER.drivers.map(drv => {
    const days = ledgerDays(drv), es = LEDGER.entries.filter(e => e.driverId === drv.id);
    const s = k => days.reduce((t, d) => t + d[k], 0), bal = days.length ? days[days.length - 1].bal : 0;
    const byPlat = {}; es.filter(e => e.kind === 'credit').forEach(e => byPlat[e.platform || 'Other'] = (byPlat[e.platform || 'Other'] || 0) + num(e.amount));
    const rev = days.slice().reverse(), shown = ledgerAll[drv.id] ? rev : rev.slice(0, 7);
    return `<div class="card section">
      <div class="driver-head"><div><h3 style="margin:0">Driver ledger · ${esc(drv.name)}</h3>
        <div class="meta">Kept by the Driver Manager · ${inr2(drv.rent)} per day since ${fmtDate(drv.startDate)}${drv.endDate ? ' · left ' + fmtDate(drv.endDate) : ''}${drv.hasLogin ? ' · has login' : ''}</div></div>
        <div class="btn-row actions"><button class="btn sm" onclick="loadLedger()">↻ Refresh</button></div></div>
      <div class="mini-kpis" style="grid-template-columns:repeat(2,1fr)">
        <div><small>Rent</small><b>${inr2(s('rent'))}</b></div>
        <div><small>Platform → bank</small><b>${inr2(s('credit'))}</b></div>
        <div><small>Cash given</small><b>${inr2(s('cash'))}</b></div>
        <div><small>${bal > 0.004 ? 'Driver still owes' : bal < -0.004 ? 'Manager owes driver' : 'Balance'}</small><b class="${bal > 0.004 ? 'neg' : 'pos'}">${inr2(Math.abs(bal))}</b></div>
      </div>
      ${Object.keys(byPlat).length ? `<div class="muted" style="font-size:12px;margin:-4px 0 10px">${Object.keys(byPlat).sort().map(p => esc(p) + ' ' + inr2(byPlat[p])).join(' · ')}</div>` : ''}
      <table><thead><tr><th>Day</th><th class="num">Rent</th><th class="num">Platform</th><th class="num">Cash</th><th class="num">Balance</th></tr></thead><tbody>
        ${shown.map(d => `<tr><td style="white-space:nowrap">${fmtShort(d.date)}</td><td class="num">${d.waive && !d.rent ? 'off' : inr2(d.rent)}</td><td class="num">${d.credit ? inr2(d.credit) : '—'}</td>
          <td class="num">${d.cash ? inr2(d.cash) : '—'}</td><td class="num ${d.bal > 0.004 ? 'neg' : d.bal < -0.004 ? 'pos' : ''}"><b>${inr2(d.bal)}</b></td></tr>`).join('')}
      </tbody></table>
      ${rev.length > 7 ? `<button class="link-btn" onclick="ledgerAll['${drv.id}']=!ledgerAll['${drv.id}'];document.getElementById('ledgerBox').innerHTML=ledgerHtml()">${ledgerAll[drv.id] ? 'Show latest only' : 'Show all ' + rev.length + ' days'}</button>` : ''}
    </div>`;
  }).join('');
}

/* ════════════ Driver statement (WhatsApp + PDF) ════════════ */
function statementLines(d) {
  const L = driverLedger(d);
  const last = L.pays.slice(-5).reverse().map(p => `  ${fmtDate(p.date)} — ${inr(p.amount)} (${p.mode})`).join('\n') || '  none';
  const pendingPeriods = L.periods.filter(p => p.paid < p.due);
  return { L, text:
`*MNS Tours & Travels — Rent statement*
Driver: ${d.name}
Car: ${vehById(d.vehicleId).name}${vehById(d.vehicleId).regNo ? ' (' + vehById(d.vehicleId).regNo + ')' : ''}
Rent: ${inr(d.rentAmount)} ${CYCLES[d.rentCycle].toLowerCase()}, from ${fmtDate(d.startDate)}

Total due till ${fmtDate(todayStr())}: ${inr(L.due)}
Paid: ${inr(L.paid)}
*${L.balance > 0 ? 'Pending: ' + inr(L.balance) + ' (' + pendingPeriods.length + ' period' + (pendingPeriods.length === 1 ? '' : 's') + ')' : L.balance < 0 ? 'Advance: ' + inr(-L.balance) : 'All clear ✅'}*

Last payments:
${last}` };
}
function shareWhatsApp(id) {
  const d = DB.drivers.find(x => x.id === id), { text } = statementLines(d);
  const phone = (d.phone || '').replace(/\D/g, '').slice(-10);
  window.open('https://wa.me/' + (phone ? '91' + phone : '') + '?text=' + encodeURIComponent(text), '_blank');
}
function printStatement(id) {
  const d = DB.drivers.find(x => x.id === id), { L } = statementLines(d);
  document.getElementById('printArea').innerHTML = `
    <h1>MNS Tours &amp; Travels</h1><div style="color:#555;margin-bottom:16px">Rent statement · generated ${fmtDate(todayStr())}</div>
    <table style="width:auto;margin-bottom:16px"><tbody>
      <tr><td><b>Driver</b></td><td>${esc(d.name)}${d.phone ? ' · ' + esc(d.phone) : ''}</td></tr>
      <tr><td><b>Car</b></td><td>${esc(vehById(d.vehicleId).name)}${vehById(d.vehicleId).regNo ? ' (' + esc(vehById(d.vehicleId).regNo) + ')' : ''}</td></tr>
      <tr><td><b>Rent</b></td><td>${inr(d.rentAmount)} ${CYCLES[d.rentCycle].toLowerCase()} from ${fmtDate(d.startDate)}</td></tr>
      <tr><td><b>Total due</b></td><td>${inr(L.due)}</td></tr><tr><td><b>Paid</b></td><td>${inr(L.paid)}</td></tr>
      <tr><td><b>${L.balance > 0 ? 'Pending' : 'Advance'}</b></td><td><b>${inr(Math.abs(L.balance))}</b></td></tr></tbody></table>
    <h3 style="margin:10px 0 6px">Payments</h3>
    <table><thead><tr><th>Date</th><th>Mode</th><th>Note</th><th class="num">Amount</th></tr></thead><tbody>
      ${L.pays.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${esc(p.mode)}</td><td>${esc(p.note)}</td><td class="num">${inr(p.amount)}</td></tr>`).join('') || '<tr><td colspan="4">No payments</td></tr>'}
    </tbody></table>`;
  const old = document.title; document.title = 'Rent statement - ' + d.name + ' - ' + todayStr();
  window.print(); document.title = old;
}

/* ════════════ Theme + boot ════════════ */
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch {}
}
try { const t = localStorage.getItem(THEME_KEY); if (t) document.documentElement.dataset.theme = t; } catch {}
// First open of this version: everything entered so far is real — snapshot it and start testing mode
try { if (!localStorage.getItem(TESTFLOW_KEY) && !getSnapshot() && localStorage.getItem(STORE_KEY)) { startTesting(); localStorage.setItem(TESTFLOW_KEY, 'started'); } } catch {}
// With cloud sync, get the latest copy first, then auto-mark EMIs and show the rent popup
function afterLoad() {
  const n = autoMarkEmis();
  if (n) { PAGES[currentPage](); setTimeout(() => toast(n + ' EMI' + (n > 1 ? 's' : '') + ' marked paid'), 300); }
  // No automatic rent popup — confirm from the "rent pending" banner (fewer mistaken taps)
}
go('dashboard');
if (SCREEN_ROLES.includes((cloudCfg() || {}).role)) location.replace('driver.html');
applyRole();
try { localStorage.removeItem('mnscar_cloud_v1'); } catch {}   // old manual connection, replaced by login
if (cloudCfg()) pullCloud().then(afterLoad).then(startLive); else showLogin();
(function scheduleEightPm() {
  const now = new Date(), at = new Date(now); at.setHours(RENT_DUE_HOUR, 0, 5, 0);
  if (at > now) setTimeout(() => { PAGES[currentPage](); }, at - now);
})();
// "Install app" button — shown only when Chrome offers installation and the app isn't installed yet
var installEvt = null;   // var: read by the login screen, which can render before this line runs
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  document.querySelectorAll('.install-btn').forEach(b => b.hidden = false);
});
window.addEventListener('appinstalled', () => document.querySelectorAll('.install-btn').forEach(b => b.hidden = true));
function installApp() {
  if (!installEvt) return;
  installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; document.querySelectorAll('.install-btn').forEach(b => b.hidden = true); });
}
// Installable app + offline open
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
