<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MNS Tours">
<meta name="theme-color" content="#0d7a6f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo-192.png?v=2">
<title>MNS Tours &amp; Travels</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design tokens — MNS Tours & Travels' own look (light default, teal accent) ── */
:root {
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#f1efe9; --border:#e4e0d6;
  --accent:#0d7a6f; --accent-ink:#ffffff; --accent-soft:rgba(13,122,111,.10);
  --text:#1c2333; --text2:#6b7080;
  --green:#15803d; --green-soft:rgba(21,128,61,.10);
  --red:#c2410c; --red-soft:rgba(194,65,12,.10);
  --blue:#4338ca;
  --nav-bg:#ffffff; --nav-text:#4b5163;
  --shadow:0 1px 2px rgba(28,35,51,.05), 0 4px 14px rgba(28,35,51,.04);
  --font-display:'Sora',sans-serif; --font-body:'Inter',sans-serif;
  --radius:14px; --gap:16px; --sidebar:228px;
}
html[data-theme="dark"] {
  --bg:#0f1517; --surface:#162024; --surface2:#1d2a2f; --border:#26353b;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:rgba(45,212,191,.12);
  --text:#e6eef0; --text2:#8ea0a6;
  --green:#4ade80; --green-soft:rgba(74,222,128,.12);
  --red:#fb923c; --red-soft:rgba(251,146,60,.12);
  --blue:#a5b4fc;
  --nav-bg:#121b1e; --nav-text:#a9b8bd;
  --shadow:none;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font-body); background:var(--bg); color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased; }
h1,h2,h3 { font-family:var(--font-display); font-weight:700; letter-spacing:-.2px; }
button { font-family:inherit; cursor:pointer; }
a { color:var(--accent); }
input,select,textarea { font-family:inherit; font-size:14px; }

/* ── Layout: sidebar (desktop) / bottom nav (mobile) ── */
.sidebar { position:fixed; inset:0 auto 0 0; width:var(--sidebar); background:var(--nav-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; gap:2px; padding:20px 12px; z-index:20; }
.brand { display:flex; align-items:center; gap:10px; padding:0 8px 20px; }
.brand .logo { width:36px; height:36px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:18px; }
.brand h1 { font-size:16px; color:var(--text); }
.brand small { color:var(--text2); font-size:11px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; color:var(--nav-text); background:none; border:0; border-radius:10px; text-align:left; font-size:14px; font-weight:500; width:100%; }
.nav-item:hover { background:var(--surface2); color:var(--text); }
.nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.nav-item .ico { width:18px; text-align:center; }
.side-foot { margin-top:auto; padding:8px; display:flex; gap:8px; }
.main { margin-left:var(--sidebar); padding:28px; max-width:1220px; }
.page-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.page-head h2 { font-size:24px; }
.page-head .sub { color:var(--text2); font-size:13px; margin-top:3px; }

@media (max-width:820px) {
  .sidebar { inset:auto 0 0 0; width:100%; height:64px; flex-direction:row; padding:6px; gap:0; border-right:0; border-top:1px solid var(--border); }
  .brand, .side-foot { display:none; }
  .nav-item { flex-direction:column; gap:2px; justify-content:center; font-size:10px; padding:5px 2px; }
  .nav-item .ico { font-size:17px; }
  .main { margin-left:0; padding:16px 16px 86px; }
  .mobile-top { display:flex !important; }
}
.mobile-top { display:none; align-items:center; justify-content:space-between; margin-bottom:14px; }
.mobile-top h1 { font-size:17px; display:flex; align-items:center; gap:8px; }
.mobile-top .logo { width:28px; height:28px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:14px; }

/* ── Cards / KPIs ── */
.grid { display:grid; gap:var(--gap); }
.kpis { grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); }
.two { grid-template-columns:1fr 1fr; }
@media (max-width:820px){ .two { grid-template-columns:1fr; } .kpis { grid-template-columns:1fr 1fr; gap:10px; } .kpi .value { font-size:19px; } .card { padding:13px; } }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
.card h3 { font-size:15px; margin-bottom:12px; }
.kpi .label { color:var(--text2); font-size:12px; font-weight:500; }
.kpi .value { font-family:var(--font-display); font-size:24px; font-weight:700; margin-top:6px; }
.kpi .hint { color:var(--text2); font-size:12px; margin-top:4px; }
.pos { color:var(--green); } .neg { color:var(--red); } .amb { color:var(--accent); }
.section { margin-top:var(--gap); }

/* progress bar */
.bar { height:10px; background:var(--surface2); border-radius:6px; overflow:hidden; margin-top:10px; }
.bar > span { display:block; height:100%; background:var(--accent); border-radius:6px; }

/* month chart */
.chart { display:flex; align-items:flex-end; gap:10px; height:170px; padding-top:10px; }
.chart .col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; min-width:0; }
.chart .bars { display:flex; gap:3px; align-items:flex-end; height:130px; width:100%; justify-content:center; }
.chart .b { width:42%; max-width:22px; border-radius:4px 4px 0 0; min-height:2px; }
.chart .b.in { background:var(--green); } .chart .b.out { background:var(--red); }
.chart .m { font-size:11px; color:var(--text2); }
.legend { display:flex; gap:14px; font-size:12px; color:var(--text2); margin-top:8px; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }

/* ── Tables ── */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text2); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; }
tr.click { cursor:pointer; } tr.click:hover td { background:var(--surface2); }
td.num, th.num { text-align:right; white-space:nowrap; }
.empty { color:var(--text2); text-align:center; padding:28px 10px; }

/* ── Badges ── */
.badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
.b-paid { background:var(--green-soft); color:var(--green); }
.b-due { background:var(--red-soft); color:var(--red); }
.b-part { background:var(--accent-soft); color:var(--accent); }
.b-up { background:var(--surface2); color:var(--text2); }

/* ── Buttons ── */
.btn { border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 15px; border-radius:10px; font-size:13px; font-weight:600; }
.btn:hover { border-color:var(--accent); }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.primary:hover { filter:brightness(1.08); }
.btn.danger { color:var(--red); }
.btn.sm { padding:5px 10px; font-size:12px; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; }
.icon-btn { background:var(--surface); border:1px solid var(--border); color:var(--text2); border-radius:10px; padding:7px 11px; font-size:13px; }

/* ── Filters ── */
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.filters select, .filters input { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:8px; }

/* ── Modal form ── */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
.overlay.open { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:460px; max-height:92vh; overflow-y:auto; padding:20px; }
.modal h3 { font-size:18px; margin-bottom:14px; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:12px; color:var(--text2); margin-bottom:5px; font-weight:600; }
.field input, .field select, .field textarea { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:9px 11px; border-radius:8px; }
.field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--accent); }
.field .help { font-size:11px; color:var(--text2); margin-top:4px; }
.modal-actions { display:flex; justify-content:space-between; gap:8px; margin-top:16px; }
.modal-actions .right { display:flex; gap:8px; margin-left:auto; }

/* driver block */
.driver-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.driver-head .meta { color:var(--text2); font-size:13px; margin-top:3px; }
.mini-kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
.mini-kpis div { background:var(--surface2); border-radius:8px; padding:10px; }
.mini-kpis small { color:var(--text2); font-size:11px; display:block; }
.mini-kpis b { font-family:var(--font-display); font-size:17px; }

.note { background:var(--accent-soft); border:1px solid transparent; color:var(--text); border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:var(--gap); }
.muted { color:var(--text2); }
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:8px; font-weight:700; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; }
.toast.show { opacity:1; }
/* Setup: collapsible sections */
.secs { display:flex; flex-direction:column; gap:10px; max-width:760px; }
.card.sec { padding:0; overflow:hidden; }
.sec-head { width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; min-height:62px; background:none; border:0; color:inherit; font:inherit; text-align:left; cursor:pointer; }
.sec-head:active { background:var(--surface2); }
.sec-ico { font-size:20px; width:28px; text-align:center; flex-shrink:0; }
.sec-t { flex:1; min-width:0; display:flex; flex-direction:column; }
.sec-t b { font-size:15px; }
.sec-t small { color:var(--text2); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sec-chev { font-size:24px; line-height:1; color:var(--text2); transition:transform .2s; flex-shrink:0; }
.sec.open .sec-chev { transform:rotate(90deg); }
.sec-body { display:none; padding:14px 16px 16px; border-top:1px solid var(--border); }
.sec.open .sec-body { display:block; }
.sec-sub { font-size:14px; margin:18px 0 10px; }
/* Change log */
.log .lrow .s { white-space:normal; }
.log-undone { text-decoration:line-through; color:var(--text2); font-weight:500; }
.log-day { margin-top:12px; }
.log-day:first-child { margin-top:0; }
/* Undo bar: shown for a few seconds after "Received" in the rent popup. Sits at the top so it never covers the popup's buttons. */
.undo-bar { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-140%); display:flex; align-items:center; gap:14px;
  background:var(--text); color:var(--bg); padding:8px 8px 8px 16px; border-radius:10px; font-weight:700; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.25);
  z-index:65; transition:transform .2s; max-width:calc(100vw - 32px); }
.undo-bar.show { transform:translate(-50%,0); }
.undo-bar button { background:var(--accent); color:var(--accent-ink); border:0; border-radius:7px; padding:8px 14px; font:inherit; font-weight:800; cursor:pointer; white-space:nowrap; }


/* ── List rows (used everywhere instead of wide tables — phone first) ── */
.list-title { color:var(--text2); font-size:12px; font-weight:600; margin:4px 0 4px; }
.lrow { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 2px; border-bottom:1px solid var(--border); min-height:52px; }
.list .lrow:last-child { border-bottom:0; }
.lrow.click { cursor:pointer; } .lrow.click:active { background:var(--surface2); }
.lrow .l { min-width:0; flex:1; }
.lrow .t { font-weight:600; font-size:14px; }
.lrow .s { color:var(--text2); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lrow .r { display:flex; align-items:center; gap:8px; flex-shrink:0; text-align:right; }
.lrow .a { font-weight:600; font-variant-numeric:tabular-nums; }
.link-btn { background:none; border:0; color:var(--accent); font-weight:600; font-size:13px; padding:12px 2px 2px; }

/* ── Floating add button + quick sheet (phone only) ── */
.fab { display:none; position:fixed; right:18px; bottom:calc(80px + env(safe-area-inset-bottom)); width:58px; height:58px; border-radius:18px; border:0;
  background:var(--accent); color:var(--accent-ink); font-size:30px; line-height:1; box-shadow:0 6px 18px rgba(13,122,111,.35); z-index:30; }
.quick { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.quick .btn { display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:18px 14px; text-align:left; font-size:15px; }
.quick .btn span { font-weight:400; font-size:12px; opacity:.8; }

/* ── Daily rent confirm popup ── */
.rc-driver { background:var(--surface2); border-radius:12px; padding:14px; margin-bottom:12px; }
.rc-driver .who { font-weight:700; font-size:15px; }
.rc-driver .what { color:var(--text2); font-size:13px; margin-top:2px; }
.rc-amt { font-family:var(--font-display); font-size:28px; font-weight:700; margin:10px 0 12px; }
.chips { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.chip { border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:20px; padding:8px 16px; font-size:14px; font-weight:600; }
.chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.rc-yes { width:100%; min-height:52px; font-size:16px !important; }
.rc-links { display:flex; justify-content:space-between; margin-top:8px; }
.test-banner { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--blue); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:var(--gap); font-size:14px; }
.test-banner .btn { background:#fff; color:#1c2333; border-color:#fff; white-space:nowrap; }
html[data-theme="dark"] .test-banner { color:#0f1517; }
.bal-card { margin-bottom:var(--gap); background:linear-gradient(135deg, var(--accent-soft), var(--surface) 60%); }
.bal-amt { font-family:var(--font-display); font-size:34px; font-weight:700; margin-top:4px; color:var(--accent); }
.bal-amt.neg { color:var(--red); }
.bal-rows { display:grid; grid-template-columns:1fr; max-width:420px; gap:6px 18px; margin-top:12px; font-size:13px; }
.bal-rows div { display:flex; justify-content:space-between; gap:8px; color:var(--text2); }
.bal-rows b { font-variant-numeric:tabular-nums; }
.bal-next { margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:13px; }
.half-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.half { border:2px solid var(--accent); background:var(--accent-soft); color:var(--text); border-radius:12px; padding:14px 12px; text-align:left; display:flex; flex-direction:column; gap:4px; font-size:14px; }
.half span { font-size:12px; color:var(--accent); font-weight:600; }
.half.off { border-color:var(--border); background:var(--surface2); }
.half.off b { text-decoration:line-through; color:var(--text2); }
.half.off span { color:var(--text2); }
.sync-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin:0 6px; vertical-align:1px; background:var(--text2); opacity:.5; }
.sync-dot[data-s="ok"] { background:var(--green); opacity:1; }
.sync-dot[data-s="syncing"] { background:var(--accent); opacity:1; }
.sync-dot[data-s="error"] { background:var(--red); opacity:1; }
#login { position:fixed; inset:0; z-index:70; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
#login[hidden] { display:none; }
.install-btn[hidden] { display:none !important; }
body.locked .sidebar, body.locked .main, body.locked .fab { display:none !important; }
body.readonly .fab, body.readonly .page-head .btn:not(.ro-ok), body.readonly .due-banner .btn, body.readonly .test-banner,
body.readonly .driver-head .btn-row .btn.primary, body.readonly .driver-head .btn-row .btn[onclick^="openDriver"],
body.readonly .lrow .btn, body.readonly .link-btn[onclick*="openPayment"], body.readonly .card .btn-row .btn.primary.sm { display:none !important; }
body.readonly .lrow.click { cursor:default; }
.login-card { width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:28px 22px; text-align:center; box-shadow:var(--shadow); }
.login-card .logo { background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; }
.login-card h2 { font-size:20px; } .login-card .field { text-align:left; }
.login-err { color:var(--red); font-size:13px; min-height:18px; margin:-2px 0 10px; }
.logo-img { width:30px; height:30px; border-radius:9px; display:inline-block; vertical-align:middle; margin-right:8px; box-shadow:0 0 0 1px var(--border); background:#fff; }
.logo-img.lg { width:40px; height:40px; border-radius:11px; margin-right:0; }
.pin-box { font-family:var(--font-display); font-size:38px; font-weight:700; letter-spacing:6px; text-align:center; background:var(--accent-soft); color:var(--accent); border-radius:14px; padding:18px 10px; }
.lrow .r .btn + .btn { margin-left:0; }
.veh-switch { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:6px 10px; margin-bottom:14px; box-shadow:var(--shadow); }
.veh-switch select { flex:1; border:0; background:transparent; color:var(--text); font-size:15px; font-weight:600; padding:6px 2px; font-family:inherit; min-width:0; }
.veh-switch select:focus { outline:none; }

.due-banner.claim-banner { background:rgba(67,56,202,.10); }
.due-banner { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--red-soft); border-radius:12px; padding:12px 14px; margin-bottom:var(--gap); font-size:14px; }

@media (max-width:820px) {
  .desk-only { display:none !important; }
  .fab { display:block; }
  .sidebar { height:calc(64px + env(safe-area-inset-bottom)); padding-bottom:calc(6px + env(safe-area-inset-bottom)); }
  .main { padding-bottom:calc(150px + env(safe-area-inset-bottom)); }
  .page-head h2 { font-size:21px; }
  /* Bottom-sheet modal */
  .overlay { align-items:flex-end; padding:0; }
  .modal { max-width:none; border-radius:20px 20px 0 0; max-height:90vh; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); border-bottom:0; }
  /* 16px stops iPhone from zooming into fields */
  .field input, .field select, .field textarea, .filters select, .inline { font-size:16px !important; }
  .field input, .field select { min-height:46px; }
  .modal-actions .btn { min-height:46px; padding:10px 20px; }
  .btn.sm { min-height:38px; padding:8px 12px; font-size:13px; }
  .filters { display:grid; grid-template-columns:1fr 1fr; }
  .filters select { min-width:0; width:100%; }
  .driver-head .actions { display:grid; grid-template-columns:repeat(4,auto); width:100%; }
  .mini-kpis { gap:8px; } .mini-kpis b { font-size:15px; }
  .toast { bottom:calc(150px + env(safe-area-inset-bottom)); }
}

/* ── Print: only the statement ── */
#printArea { display:none; }
@media print {
  body { background:#fff; color:#000; }
  .sidebar, .main, .overlay, .toast, .undo-bar { display:none !important; }
  #printArea { display:block; padding:24px; font-family:var(--font-body); color:#000; }
  #printArea h1 { font-size:20px; margin-bottom:2px; }
  #printArea table td, #printArea table th { border-bottom:1px solid #ccc; color:#000; }
}
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="brand"><img class="logo-img lg" src="logo.png?v=2" alt="MNS"><div><h1>MNS Tours &amp; Travels</h1><small><span class="sync-dot" data-s="off"></span>Car rent &amp; expense book</small></div></div>
  <button class="nav-item" data-page="dashboard"><span class="ico">◧</span>Dashboard</button>
  <button class="nav-item" data-page="rent"><span class="ico">₹</span>Rent</button>
  <button class="nav-item" data-page="expenses"><span class="ico">⇣</span>Expenses</button>

<script>
/* ════════════════════════════════════════════════════════════
   STORAGE LAYER
   Everything reads/writes through load()/save(). When we move to
   a real backend, only these two functions need to change.
   ════════════════════════════════════════════════════════════ */
const STORE_KEY = 'mnscar_data_v1';
const ACCOUNT = 'account';   // rent goes into the business account by default, not to a partner
// Change log (Setup → Change log): which lists are tracked, and the last state the log has seen
const LOG_ARR = ['payments','expenses','transfers','offs','drivers','vehicles','partners'];
const LOG_DAYS = 60, LOG_MAX = 400;
let LOG_BASE = null, LOG_TAG = '', LOG_UNDO_OF = null, LAST_LOG_ID = null;
const THEME_KEY = 'mnscar_theme_v1';

const EXPENSE_CATEGORIES = ['EMI','Insurance','Permit & Road Tax','Fitness / PUC','Service','Repair','Tyres & Battery',
  'Fuel / CNG','Fine / Challan','Uber / Platform fee','Accessories','Cleaning','Self use','Other'];
const PAY_MODES = ['Online','Cash','Other'];
const RENT_DUE_HOUR = 20;   // daily rent is collected at 8 PM (covers last night + today)
const CYCLES = { daily:'Daily', weekly:'Weekly', monthly:'Monthly' };

function defaultVehicle(id) {
  return { id: id || uid(), name:'', regNo:'', purchaseDate:'', price:0, downPayment:0, downPaidBy:'',
           loanAmount:0, netDisbursed:0, irr:0, emi:0, tenure:0, emiStartDate:'', emiPaidBy:'rent' };
}
function defaultData() {
  const me = uid(), uncle = uid();
  return {
    vehicles: [ Object.assign(defaultVehicle('v1'), { name:'Maruti Dzire Tour S (CNG)', price:830000, downPayment:200000,
           downPaidBy:uncle, loanAmount:622128, netDisbursed:603000, irr:14.01, emi:21314, tenure:36, emiStartDate:'2026-11-05' }) ],
    settings: { upiId:'', upiName:'' },
    partners: [ { id:me, name:'Me', share:50 }, { id:uncle, name:'Uncle', share:50 } ],
    drivers: [], payments: [], expenses: [], transfers: [], offs: [], rentToAccount: true, log: []
  };
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { console.warn('Load failed', e); }
  return defaultData();
}
/* Bring any saved copy (this phone's or the cloud's) up to the current format. */
function migrate(parsed) {
  const d = Object.assign(defaultData(), parsed);
  // ── Older single-car format: fix earlier placeholder values, then turn the car into Vehicle 1
  if (d.car) {
    const c = d.car;
    if (c.price === 840000 && !num(c.emi)) Object.assign(c, { price:830000, emi:21314 });
    if ([630000, 640000].includes(num(c.loanAmount))) c.loanAmount = 622128;
    if (c.netDisbursed === undefined) c.netDisbursed = 603000;
    if (c.irr === undefined) c.irr = 14.01;
    if (!c.emiStartDate) c.emiStartDate = '2026-11-05';
    if (!c.downPaidBy) { const u = d.partners.find(p => /uncle/i.test(p.name)); if (u) c.downPaidBy = u.id; }
    if (!parsed.vehicles || !parsed.vehicles.length) d.vehicles = [Object.assign(defaultVehicle('v1'), c, { id: 'v1' })];
    if (!parsed.settings) d.settings = { upiId: c.upiId || '', upiName: c.upiName || '' };
    delete d.car;
  }
  d.vehicles.forEach(v => { delete v.upiId; delete v.upiName; if (!v.emiPaidBy) v.emiPaidBy = 'rent'; });
  d.settings = Object.assign({ upiId:'', upiName:'' }, d.settings || {});
  // ── Every record belongs to a vehicle (by its ID, so editing a number plate never breaks links)
  const v0 = d.vehicles[0].id;
  d.drivers.forEach(x => { if (!x.vehicleId || !d.vehicles.some(v => v.id === x.vehicleId)) x.vehicleId = v0; });
  d.payments.forEach(x => { if (!x.vehicleId) { const dr = d.drivers.find(y => y.id === x.driverId); x.vehicleId = dr ? dr.vehicleId : v0; } });
  d.expenses.forEach(x => { if (!x.vehicleId) x.vehicleId = v0; });
  d.offs.forEach(x => { if (!x.vehicleId) { const dr = d.drivers.find(y => y.id === x.driverId); x.vehicleId = dr ? dr.vehicleId : v0; } });
  d.emiNoAuto = (d.emiNoAuto || []).map(n => typeof n === 'number' ? v0 + ':' + n : n);
  // Category renamed: "Registration & Accessories" → "Accessories"
  d.expenses.forEach(e => { if (e.category === 'Registration & Accessories') e.category = 'Accessories'; });
  // Rent belongs to the business account, not a partner (one-time move of earlier entries)
  if (!parsed.rentToAccount) { d.payments.forEach(x => x.receivedBy = 'account'); d.rentToAccount = true; }
  d.drivers.forEach(x => { if (!x.accessCode) x.accessCode = newCode(); });
  // Change log: every tracked record needs an ID so a change can be undone later
  LOG_ARR.forEach(c => { d[c] = Array.isArray(d[c]) ? d[c] : []; d[c].forEach(x => { if (x && !x.id) x.id = uid(); }); });
  d.log = Array.isArray(d.log) ? d.log : [];
  return d;
}
function newCode() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 10; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
let saveTimer = null;
function viewOnly() { return isViewer(); }   // view-only logins: edit actions silently do nothing
/* View-only logins (e.g. Uncle) see everything but can't change anything. */
const isViewer = () => (cloudCfg() || {}).role === 'viewer';
function applyRole() { document.body.classList.toggle('readonly', isViewer()); }
let saveTimerPending = false;
function save() {
  if (isViewer()) return;                       // 400ms debounce, same pattern as other apps
  logChanges();                                 // note what this action changed (Setup → Change log)
  clearTimeout(saveTimer); saveTimerPending = true;
  saveTimer = setTimeout(() => {
    saveTimerPending = false;
    DB._savedAt = new Date().toISOString();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
    catch (e) { alert('Could not save — browser storage is full or blocked.'); }
    pushCloud();
  }, 400);
}

/* ════════════ Cloud sync (your own Cloudflare Worker + D1) ════════════
   This phone keeps a copy in localStorage so the app opens instantly and works offline.
   When a Worker URL + key are set in Setup, every save is also sent to the cloud,
   and on opening, the newer of (this phone, cloud) wins. */
const WORKER_URL = 'https://mns-enterprises.naimuddinshaikh74667.workers.dev';
const AUTH_KEY = 'mnscar_auth_v1';        // { token, name, mobile } after login
const apiBase = () => { try { return localStorage.getItem('mnscar_api_override') || WORKER_URL; } catch { return WORKER_URL; } };
function cloudCfg() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch { return null; } }
let cloudState = 'off';   // off | syncing | ok | error
const SYNC_TEXT = { off:'Not connected', syncing:'Syncing…', ok:'Synced', error:'Sync error' };
function setCloudState(s, msg) {
  cloudState = s;
  document.querySelectorAll('.sync-text').forEach(el => el.textContent = SYNC_TEXT[s]);
  document.querySelectorAll('.sync-dot').forEach(el => {
    el.dataset.s = s; el.title = msg || ({ off:'Saved on this phone only', syncing:'Syncing…', ok:'Synced to cloud', error:'Cloud sync failed' })[s];
  });
}
async function cloudFetch(path, opts = {}) {
  const c = cloudCfg();
  const res = await fetch(apiBase() + path, { ...opts,
    headers: { 'Content-Type': 'application/json', ...(c ? { Authorization: 'Bearer ' + c.token } : {}), ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && c && path !== '/login') { logout(true); throw new Error('Logged out'); }
  return { status: res.status, body };
}
let pushing = null, pushAgain = false;
async function pushCloud(force) {
  if (!cloudCfg() || isViewer()) return;
  if (pushing) { pushAgain = true; return; }
  setCloudState('syncing');
  pushing = (async () => {
    try {
      const r = await cloudFetch('/state', { method:'PUT', body: JSON.stringify({ data: DB, savedAt: DB._savedAt, force: !!force }) });
      if (r.status === 409) {
        // Another device saved newer data — take it, so nothing newer is overwritten
        applyCloud(r.body.data); toast('Updated with newer data from another device');
      } else if (r.status >= 400) throw new Error(r.body.error || r.status);
      setCloudState('ok');
    } catch (e) { setCloudState('error', 'Cloud sync failed: ' + e.message); }
    pushing = null;
    if (pushAgain) { pushAgain = false; pushCloud(); }
  })();
}
function applyCloud(data) {
  DB = migrate(data); logResetBase();   // changes from another device were logged there
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch {}
  if (typeof PAGES !== 'undefined') PAGES[currentPage]();
}
/* Live updates: while the app is on screen, check the cloud every 5 s for changes made on
   another device (1 s would use up Cloudflare's free daily request limit). Skips while you're
   typing in a form or a save is still on its way up, so nothing you're doing gets overwritten. */
const LIVE_EVERY_MS = 5000;
let liveTimer = null, liveBusy = false;
async function liveCheck() {
  if (!cloudCfg() || document.hidden || liveBusy || pushing || saveTimer && saveTimerPending) return;
  if (document.getElementById('overlay').classList.contains('open')) return;
  liveBusy = true;
  try {
    const r = await cloudFetch('/state');
    if (r.status < 400 && r.body.data && r.body.savedAt > (DB._savedAt || '')) {
      applyCloud(r.body.data); setCloudState('ok'); if (!isViewer()) toast('Updated');
    } else if (r.status < 400) setCloudState('ok');
    if (r.status < 400) setClaims(r.body.claims);
  } catch { setCloudState('error', 'Offline — will sync when back online'); }
  liveBusy = false;
}
function startLive() {
  clearInterval(liveTimer);
  if (cloudCfg()) liveTimer = setInterval(liveCheck, LIVE_EVERY_MS);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) liveCheck(); });
window.addEventListener('online', () => { pushCloud(); liveCheck(); });
async function pullCloud() {
  if (!cloudCfg()) { setCloudState('off'); return; }
  setCloudState('syncing');
  try {
    const r = await cloudFetch('/state');
    if (r.status >= 400) throw new Error(r.body.error || r.status);
    const remote = r.body;
    setClaims(remote.claims, true);
    if (remote.data && (isViewer() || !DB._savedAt || remote.savedAt > DB._savedAt)) { applyCloud(remote.data); setCloudState('ok'); }
    else if (!remote.data || remote.savedAt < DB._savedAt) { if (!DB._savedAt) DB._savedAt = new Date().toISOString(); await pushCloud(); }
    else setCloudState('ok');
  } catch (e) { setCloudState('error', 'Cloud sync failed: ' + e.message); }
}
let DB = load();
logResetBase();

/* ════════════ Helpers ════════════ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function inr(n) { const r = Math.round(n); return (r < 0 ? '−₹' : '₹') + Math.abs(r).toLocaleString('en-IN'); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr() { const d = new Date(); return ymd(d); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseYmd(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s) { if (!s) return '—'; return parseYmd(s).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }); }
// Add months keeping the day where possible (31 Jan + 1 month → 28/29 Feb)
function addMonths(d, n) {
  const r = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
  r.setDate(Math.min(d.getDate(), last)); return r;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
const FROM_RENT = 'rent';   // special payer: paid out of rent collected, not by a partner
function partnerName(id) { if (id === FROM_RENT) return 'From rent'; if (id === ACCOUNT || !id) return 'Account'; const p = DB.partners.find(p => p.id === id); return p ? p.name : '—'; }
function driverName(id) { const d = DB.drivers.find(d => d.id === id); return d ? d.name : '—'; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
function sum(arr, f) { return arr.reduce((s, x) => s + f(x), 0); }

/* ════════════ Calculations ════════════ */

/* Rent periods for a driver, from start date until end date (or today).
   Rent for a period is due once that period has started. */
function rentPeriods(drv) {
  if (!drv.startDate || !drv.rentAmount) return [];
  // Daily rent for a day only falls due at 8 PM that day; before that, count up to yesterday.
  let last = todayStr();
  if (drv.rentCycle === 'daily' && new Date().getHours() < RENT_DUE_HOUR) last = ymd(addDays(new Date(), -1));
  const until = parseYmd(drv.endDate && drv.endDate < last ? drv.endDate : last);
  const out = []; let from = parseYmd(drv.startDate); let i = 0;
  while (from <= until && i < 3000) {
    const next = drv.rentCycle === 'daily' ? addDays(from, 1)
               : drv.rentCycle === 'weekly' ? addDays(from, 7)
               : addMonths(parseYmd(drv.startDate), i + 1);
    const p = { from: ymd(from), to: ymd(addDays(next, -1)), due: num(drv.rentAmount), paid: 0, off: [] };
    if (drv.rentCycle === 'daily') {
      // Each daily period = previous night + this day; each half is half the rent.
      const halves = periodHalves(p.from);
      p.off = halves.filter(x => isOff(drv.id, x.date, x.half));
      p.due = num(drv.rentAmount) * (2 - p.off.length) / 2;
    }
    out.push(p);
    from = next; i++;
  }
  return out;
}

/* Spread a driver's payments over periods oldest-first (FIFO). */
function driverLedger(drv) {
  const periods = rentPeriods(drv);
  const pays = DB.payments.filter(p => p.driverId === drv.id).sort((a,b) => a.date.localeCompare(b.date));
  let pool = sum(pays, p => num(p.amount));
  for (const p of periods) { const take = Math.min(pool, p.due); p.paid = take; pool -= take; }
  const due = sum(periods, p => p.due), paid = sum(pays, p => num(p.amount));
  return { periods, pays, due, paid, balance: due - paid, advance: Math.max(0, pool) };
}

/* ── Car off / out of service, tracked per half day (night or day) ── */
function periodHalves(day) {   // the two halves a daily period covers
  return [{ date: ymd(addDays(parseYmd(day), -1)), half: 'night' }, { date: day, half: 'day' }];
}
function isOff(driverId, date, half) { return (DB.offs || []).some(o => o.driverId === driverId && o.date === date && o.half === half); }
function setOff(driverId, date, half, off) {
  DB.offs = (DB.offs || []).filter(o => !(o.driverId === driverId && o.date === date && o.half === half));
  if (off) DB.offs.push({ id: uid(), driverId, date, half });
}
function halfLabel(x) { return fmtShort(x.date) + ' ' + x.half; }

/* Tap a daily period → say which halves the car ran, and optionally record the rent for it. */
function openPeriod(driverId, day) {
  if (viewOnly()) return;
  const drv = DB.drivers.find(d => d.id === driverId); if (!drv) return;
  const halves = periodHalves(day), half = num(drv.rentAmount) / 2;
  const ran = halves.map(x => !isOff(driverId, x.date, x.half));
  const draw = () => {
    const n = ran.filter(Boolean).length, amt = half * n;
    const per = driverLedger(drv).periods.find(p => p.from === day);
    const alreadyPaid = per ? per.paid : 0;
    const toPay = Math.max(0, amt - alreadyPaid);
    document.getElementById('modal').innerHTML = `<h3>${esc(drv.name)}</h3>
      <p class="muted" style="margin:-6px 0 14px;font-size:13px">Rent for ${periodLabel(drv, { from: day })} · tap to mark the car off</p>
      <div class="half-grid">${halves.map((x, i) => `<button class="half ${ran[i] ? 'on' : 'off'}" onclick="window._pt(${i})">
          <b>${halfLabel(x)}</b><span>${ran[i] ? 'Ran · ' + inr(half) : 'Car off · ₹0'}</span></button>`).join('')}</div>
      <div class="rc-amt" style="margin-top:14px">${inr(amt)}</div>
      ${alreadyPaid ? `<div class="muted" style="font-size:13px;margin:-6px 0 12px">Already received ${inr(alreadyPaid)}</div>` : ''}
      ${toPay > 0 ? `<button class="btn primary rc-yes" onclick="window._ps(true)">✓ Save &amp; received ${inr(toPay)}</button>` : ''}
      <button class="btn rc-yes" style="margin-top:8px" onclick="window._ps(false)">Save${toPay > 0 ? ' (not received yet)' : ''}</button>
      <button class="btn rc-yes" style="margin-top:8px" onclick="closeModal()">Cancel</button>`;
  };
  window._pt = i => { ran[i] = !ran[i]; draw(); };
  window._ps = received => {
    halves.forEach((x, i) => setOff(driverId, x.date, x.half, !ran[i]));
    const per = driverLedger(drv).periods.find(p => p.from === day);
    const toPay = per ? Math.max(0, per.due - per.paid) : 0;
    const paid = received && toPay > 0;
    if (paid) DB.payments.push({ id: uid(), driverId, vehicleId: vehOfDriver(drv), date: todayStr(), amount: toPay, mode: 'Online',
      receivedBy: ACCOUNT, note: 'Rent for ' + periodLabel(drv, { from: day }) });
    LAST_LOG_ID = null; save(); PAGES[currentPage]();
    if (paid) showUndo(LAST_LOG_ID, toPay); else toast('Saved');
    if (pendingRent().length && document.getElementById('modal').dataset.from === 'prompt') openRentConfirm(); else closeModal();
  };
  draw();
  document.getElementById('overlay').classList.add('open');
}

function periodStatus(p) {
  if (p.due === 0) return '<span class="badge b-up">Car off</span>';
  if (p.paid >= p.due) return '<span class="badge b-paid">Paid</span>';
  if (p.paid > 0) return '<span class="badge b-part">Part ' + inr(p.paid) + '</span>';
  return '<span class="badge b-due">Pending</span>';
}

/* ════════════ Vehicles ════════════
   The top selector picks "All vehicles" or one vehicle; every page shows that selection.
   Records point to a vehicle by its ID (not the number plate). */
const SEL_KEY = 'mnscar_vehicle_v1';
let SEL = (() => { try { return localStorage.getItem(SEL_KEY) || 'all'; } catch { return 'all'; } })();
const vehById = id => DB.vehicles.find(v => v.id === id) || DB.vehicles[0];
const selValid = () => DB.vehicles.some(v => v.id === SEL);
const selVehicles = () => selValid() ? DB.vehicles.filter(v => v.id === SEL) : DB.vehicles;
const curVeh = () => selValid() ? vehById(SEL) : (DB.vehicles.length === 1 ? DB.vehicles[0] : null);   // null = "All" with several
const vehOfDriver = d => (d && d.vehicleId) || DB.vehicles[0].id;
function vidOf(x) { return x.vehicleId || (x.driverId ? vehOfDriver(DB.drivers.find(d => d.id === x.driverId)) : DB.vehicles[0].id); }
const inSel = x => !selValid() || vidOf(x) === SEL;
const selDrivers = () => DB.drivers.filter(d => !selValid() || vehOfDriver(d) === SEL);
const vehLabel = v => v ? (v.regNo || v.name || 'Vehicle') : '';
const multiVeh = () => DB.vehicles.length > 1;
function setSel(id) { SEL = id; try { localStorage.setItem(SEL_KEY, id); } catch {} PAGES[currentPage](); window.scrollTo(0, 0); }
function vehSwitcher() {
  if (!multiVeh()) return '';
  return `<div class="veh-switch"><span>🚗</span><select onchange="setSel(this.value)">
    <option value="all">All vehicles (${DB.vehicles.length})</option>
    ${DB.vehicles.map(v => `<option value="${v.id}" ${v.id === SEL ? 'selected' : ''}>${esc(vehLabel(v))}${v.regNo && v.name ? ' · ' + esc(v.name) : ''}</option>`).join('')}</select></div>`;
}
const vehTag = id => multiVeh() && !selValid() ? ' · ' + esc(vehLabel(vehById(id))) : '';

/* EMI schedule for one vehicle: one row per month from its first EMI date. */
function emiSchedule(v) {
  v = v || curVeh() || DB.vehicles[0];
  if (!v.emiStartDate || !v.tenure) return [];
  const start = parseYmd(v.emiStartDate);
  return Array.from({ length: num(v.tenure) }, (_, i) => {
    const date = ymd(addMonths(start, i));
    const exp = DB.expenses.find(e => e.category === 'EMI' && num(e.emiNo) === i + 1 && vidOf(e) === v.id);
    return { no: i + 1, date, amount: num(v.emi), expense: exp };
  });
}

/* Real cost of a vehicle = upfront + every EMI over the full tenure. Interest = that total − cash price. */
function carCost(v) {
  v = v || curVeh() || DB.vehicles[0];
  const total = num(v.downPayment) + num(v.emi) * num(v.tenure);
  return { total, interest: Math.max(0, total - num(v.price)) };
}

function totals() {
  const vs = selVehicles();
  const pays = DB.payments.filter(inSel), exps = DB.expenses.filter(inSel);
  const rent = sum(pays, p => num(p.amount));
  const emiPaid = sum(exps.filter(e => e.category === 'EMI'), e => num(e.amount));
  const running = sum(exps.filter(e => e.category !== 'EMI'), e => num(e.amount));
  const down = sum(vs, v => num(v.downPayment));
  const cashOut = down + emiPaid + running;
  const emisLeft = sum(vs, v => emiSchedule(v).filter(r => !r.expense).length);
  const loanLeft = sum(vs, v => emiSchedule(v).filter(r => !r.expense).length * num(v.emi));
  const pending = sum(selDrivers(), d => Math.max(0, driverLedger(d).balance));
  const carTotal = sum(vs, v => carCost(v).total), interest = sum(vs, v => carCost(v).interest), price = sum(vs, v => num(v.price));
  // Break-even = full vehicle cost (incl. interest) + running costs so far, all covered by rent
  const toBreakEven = Math.max(0, carTotal + running - rent);
  return { rent, emiPaid, running, down, cashOut, net: rent - cashOut, operating: rent - running,
           emisLeft, loanLeft, pending, carTotal, interest, price, toBreakEven };
}

let currentPage = 'dashboard';
function go(page) {
  if (page === 'setup' && currentPage !== 'setup') { OPEN_SECS.clear(); logShown = 30; }   // Setup opens with every section closed
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  PAGES[page](); window.scrollTo(0, 0);
}
document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));

/* Collapsible Setup sections: closed by default, and a section you're working in stays open while the page redraws. */
const OPEN_SECS = new Set();
function sec(key, ico, title, summary, body) {
  const open = OPEN_SECS.has(key);
  return `<div class="card sec${open ? ' open' : ''}" data-sec="${key}">
    <button type="button" class="sec-head" onclick="toggleSec('${key}')" aria-expanded="${open}">
      <span class="sec-ico" aria-hidden="true">${ico}</span>
      <span class="sec-t"><b>${title}</b><small id="sum_${key}">${esc(summary)}</small></span>
      <span class="sec-chev" aria-hidden="true">›</span></button>
    <div class="sec-body">${body}</div></div>`;
}
function toggleSec(key) {
  const el = document.querySelector('.sec[data-sec="' + key + '"]'); if (!el) return;
  const open = !el.classList.contains('open');
  if (open && key === 'log') refreshLogSection();   // always show the latest changes
  el.classList.toggle('open', open); el.querySelector('.sec-head').setAttribute('aria-expanded', open);
  if (open) OPEN_SECS.add(key); else OPEN_SECS.delete(key);
}
// Redraw just the Change log section (used after edits that don't redraw the whole page)
function refreshLogSection() {
  const el = document.querySelector('.sec[data-sec="log"]'); if (!el) return;
  el.querySelector('.sec-body').innerHTML = changeLogHtml();
  const n = logTodayCount(), sum = document.getElementById('sum_log');
  if (sum) sum.textContent = n ? n + ' change' + (n > 1 ? 's' : '') + ' today' : (DB.log || []).length ? 'No changes today' : 'Nothing recorded yet';
}

function kpi(label, value, cls, hint) {

function monthLabel(ym) { const [y,m] = ym.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('en-IN', { month:'short', year:'2-digit' }); }
function monthChart() {
  const now = new Date(), months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(ymd(d).slice(0,7)); }
  const data = months.map(m => ({ m,
    in: sum(DB.payments.filter(p => inSel(p) && p.date.startsWith(m)), p => num(p.amount)),
    out: sum(DB.expenses.filter(e => inSel(e) && e.date.startsWith(m)), e => num(e.amount)) }));
  const max = Math.max(1, ...data.map(d => Math.max(d.in, d.out)));
  return `<div class="chart">${data.map(d => `<div class="col" title="${monthLabel(d.m)}: rent ${inr(d.in)}, spent ${inr(d.out)}">
      <div class="bars"><div class="b in" style="height:${d.in / max * 100}%"></div><div class="b out" style="height:${d.out / max * 100}%"></div></div>
      <div class="m">${monthLabel(d.m)}</div></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>Rent</span><span><i style="background:var(--red)"></i>Spent (incl. EMI)</span></div>`;
}

    return lrow(esc(d.name), (multiVeh() ? esc(vehLabel(vehById(d.vehicleId))) + ' · ' : '') + 'Paid ' + inr(L.paid),
      L.balance > 0 ? '<span class="neg">' + inr(L.balance) + '</span>' : '', L.balance > 0 ? '<span class="badge b-due">Pending</span>' : '<span class="badge b-paid">Clear</span>', "go('rent')");
  }).join('') + '</div>';

function recentActivity() {

    ...DB.expenses.filter(inSel).map(e => ({ date:e.date, txt:e.category + (e.note ? ' · ' + e.note : ''), amt:-num(e.amount), id:e.id, kind:'e', v:vidOf(e) }))

/* One tappable list row: title + sub on the left, amount + extra (badge/button) on the right. */
function lrow(title, sub, amount, extra, onclick) {

/* Daily rent at 8 PM covers the previous night + that day, shown as "16–17 Oct". */
function periodLabel(drv, p) {
  if (drv.rentCycle === 'daily') {
    // "16–17 Oct" = 16th night + 17th day
    const base = fmtRange(ymd(addDays(parseYmd(p.from), -1)), p.from);
    return p.off && p.off.length === 1 ? base + ' (' + p.off[0].half + ' off)' : base;
  }
  return fmtRange(p.from, p.to);
}
function fmtShort(s) { return parseYmd(s).toLocaleDateString('en-IN', { day:'numeric', month:'short' }); }
function fmtRange(a, b) {
  if (a === b) return fmtDate(a);
  const A = parseYmd(a), B = parseYmd(b);
  return A.getMonth() === B.getMonth() ? A.getDate() + '–' + fmtShort(b) : fmtShort(a) + ' – ' + fmtShort(b);
}

/* Partner settlement.
   Rent goes into the shared business account, and EMIs/expenses "From rent" come out of it —
   none of that belongs to either partner, so it doesn't affect the split.
   What counts per partner: own money put in (+), money paid to the other partner (+),
   rent personally kept, profit taken out, money received from the other partner (−).
   Fair = share% of the total; Balance > 0 → this partner is owed money. */
function partnerSettlement() {
  const T = DB.transfers || [];
  const settles = T.filter(t => t.type === 'settle'), withdraws = T.filter(t => t.type === 'withdraw');
  const rows = DB.partners.map(p => {
    const paidOut = sum(DB.vehicles.filter(v => v.downPaidBy === p.id), v => num(v.downPayment))
                  + sum(DB.expenses.filter(e => e.paidBy === p.id), e => num(e.amount));
    const rentKept = sum(DB.payments.filter(x => x.receivedBy === p.id), x => num(x.amount));
    const profitTaken = sum(withdraws.filter(t => t.to === p.id), t => num(t.amount));
    const settleOut = sum(settles.filter(t => t.from === p.id), t => num(t.amount));
    const settleIn = sum(settles.filter(t => t.to === p.id), t => num(t.amount));
    const net = paidOut + settleOut - rentKept - profitTaken - settleIn;
    return { name:p.name, share:num(p.share), paidOut, rentKept, profitTaken, settleOut, settleIn, net };
  });
  const totalNet = sum(rows, r => r.net), totalShare = sum(rows, r => r.share) || 100;
  rows.forEach(r => { r.fair = totalNet * r.share / totalShare; r.balance = r.net - r.fair; });
  return rows;
}

/* Partner → partner payment ("settle") or profit taken out of rent ("withdraw"). */
function openTransfer(id, type) {
  if (viewOnly()) return;
  if (DB.partners.length < 1) { alert('Add partners first.'); return; }
  const existing = id ? (DB.transfers || []).find(t => t.id === id) : null;
  type = existing ? existing.type : type;
  const P = DB.partners.map(p => [p.id, p.name]);
  const me = defaultReceiver(), other = (DB.partners.find(p => p.id !== me) || {}).id || me;
  const fields = type === 'settle' ? [
    { k:'amount', label:'Amount (₹)', type:'number', req:true },

    { k:'date', label:'Date', type:'date', req:true, def: todayStr() },
    { k:'note', label:'Note', type:'text', help:'e.g. from salary, to even up 50-50' }
  ] : [
    { k:'amount', label:'Amount (₹)', type:'number', req:true },
    { k:'to', label:'Taken by', type:'select', options:P },
    { k:'date', label:'Date', type:'date', req:true, def: todayStr() },
    { k:'note', label:'Note', type:'text', help:'Taken out of the rent money — not a car expense.' }
  ];
  openForm(existing ? 'Edit' : type === 'settle' ? 'Paid to partner' : 'Took profit', fields,
    existing || { from: me, to: type === 'settle' ? other : me },
    d => {
      if (type === 'settle' && d.from === d.to) { alert('Paid by and Paid to must be different.'); return false; }
      d.amount = num(d.amount); DB.transfers = DB.transfers || [];
      if (existing) Object.assign(existing, d); else DB.transfers.push({ id:uid(), type, ...d });
    },
    existing ? () => DB.transfers = DB.transfers.filter(t => t.id !== id) : null);
}

/* Available balance = money that should be in the car's account right now:
   rent received − EMIs/expenses paid "From rent" − profit taken out. */
const inAccount = x => !DB.partners.some(p => p.id === x.receivedBy);
/* One business account for all vehicles. With one vehicle selected, shows just that vehicle's share of it
   (profit taken out is business-wide, so it only appears under "All vehicles"). */
function accountBalance() {
  const rentIn = sum(DB.payments.filter(x => inAccount(x) && inSel(x)), p => num(p.amount));
  const emiOut = sum(DB.expenses.filter(e => inSel(e) && e.paidBy === FROM_RENT && e.category === 'EMI'), e => num(e.amount));
  const otherOut = sum(DB.expenses.filter(e => inSel(e) && e.paidBy === FROM_RENT && e.category !== 'EMI'), e => num(e.amount));
  const profitOut = selValid() ? 0 : sum((DB.transfers || []).filter(t => t.type === 'withdraw'), t => num(t.amount));
  return { rentIn, emiOut, otherOut, profitOut, balance: rentIn - emiOut - otherOut - profitOut };
}

function rentPoolCard() {

/* ════════════ Daily rent confirm ════════════
   On opening the app, pop up any rent that has fallen due and isn't paid.
   One tap records it. "Not yet" hides the popup until tomorrow. */
const SNOOZE_KEY = 'mnscar_rentprompt_v1';

function pendingRent() {
  return DB.drivers.filter(d => !d.endDate).map(d => {
    const pend = driverLedger(d).periods.filter(p => p.paid < p.due);
    return { d, pend, total: sum(pend, p => p.due - p.paid) };
  }).filter(x => x.pend.length);
}
/* ════════════ Driver "I've paid" notices ════════════
   The driver marks a payment in his app → it waits here until you confirm it. */
let CLAIMS = [], claimLater = new Set();
function setClaims(list, quiet) {
  const before = CLAIMS.map(c => c.id).join();

  if (CLAIMS.map(c => c.id).join() !== before && !quiet && !document.getElementById('overlay').classList.contains('open')) PAGES[currentPage]();

}
function claimDriver(c) { return DB.drivers.find(d => d.id === c.driver_id) || { id: c.driver_id, name: c.driver_name || 'Driver' }; }
function openClaimConfirm(manual) {
  const list = manual ? CLAIMS : CLAIMS.filter(c => !claimLater.has(c.id));
  const c = list[0]; if (!c) { closeModal(); return; }
  const d = claimDriver(c);
  const when = new Date(c.created_at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
  document.getElementById('modal').dataset.from = 'claim';

    <p class="muted" style="margin:-6px 0 14px;font-size:13px">${esc(d.name.split(' ')[0])} says he paid you${multiVeh() && d.vehicleId ? ' · ' + esc(vehLabel(vehById(d.vehicleId))) : ''}</p>
    <div class="rc-driver"><div class="what">${esc(c.label || 'Rent')} · marked ${when}</div>
      <div class="rc-amt">${inr(c.amount)}</div>
      <div class="muted" style="font-size:12px">Check your UPI / bank SMS before confirming.</div></div>
    <button class="btn primary rc-yes" onclick="resolveClaim('${c.id}', true)">✓ Yes, received ${inr(c.amount)}</button>
    <button class="btn rc-yes" style="margin-top:8px;color:var(--red)" onclick="resolveClaim('${c.id}', false)">Not received</button>
    <button class="btn rc-yes" style="margin-top:8px" onclick="claimLater.add('${c.id}');closeModal()">Later</button>
    ${list.length > 1 ? `<p class="muted" style="font-size:12px;text-align:center;margin-top:10px">${list.length - 1} more waiting</p>` : ''}`;

async function resolveClaim(id, ok) {
  if (viewOnly()) return;
  const c = CLAIMS.find(x => x.id === id); if (!c) { closeModal(); return; }
  if (!ok && !confirm('Mark ' + inr(c.amount) + ' as NOT received? The driver will be asked to contact you.')) return;
  try {
    const r = await cloudFetch('/claims/resolve', { method:'POST', body: JSON.stringify({ id, status: ok ? 'accepted' : 'rejected' }) });
    if (r.status >= 400) throw new Error(r.body.error || 'failed');
  } catch (e) { alert('Could not confirm — check internet and try again.'); return; }
  if (ok) {
    const d = claimDriver(c);
    DB.payments.push({ id: uid(), driverId: d.id, vehicleId: vehOfDriver(d), date: ymd(new Date(c.created_at)), amount: num(c.amount),
                       mode: 'Online', receivedBy: ACCOUNT, note: 'Driver marked paid' + (c.label ? ' · ' + c.label : ''), claimId: id });
    save();
  }
  CLAIMS = CLAIMS.filter(x => x.id !== id);
  toast(ok ? 'Recorded ' + inr(c.amount) : 'Marked not received');
  closeModal(); PAGES[currentPage]();
  if (CLAIMS.length) setTimeout(() => openClaimConfirm(true), 250);
}
function claimBanner() {
  if (!CLAIMS.length) return '';
  const total = sum(CLAIMS, c => num(c.amount));
  const who = [...new Set(CLAIMS.map(c => claimDriver(c).name))].join(', ');
  return `<div class="due-banner claim-banner"><div><b>${inr(total)}</b> marked paid by ${esc(who)} — waiting for your confirmation</div>
    ${isViewer() ? '' : '<button class="btn primary sm" onclick="openClaimConfirm(true)">Review</button>'}</div>`;
}
function dueBanner() {
  if (isViewer()) return '';            // partner view: just the numbers, no reminders
  const list = pendingRent(); if (!list.length) return claimBanner();
  // Rent the driver already marked as paid (waiting for you) isn't counted twice
  const total = sum(list, x => x.total) - sum(CLAIMS, c => num(c.amount));
  if (total <= 0) return claimBanner();
  return claimBanner() + `<div class="due-banner"><div><b>${inr(total)}</b> rent pending${list.length === 1 ? ' from ' + esc(list[0].d.name) : ''}</div>
    <button class="btn primary sm" onclick="openRentConfirm(true)">Confirm</button></div>`;
}
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

        <div class="rc-links"><button class="link-btn" onclick="closeModal();openPayment(null,'${x.d.id}')">Different amount</button>
          ${x.d.rentCycle === 'daily' ? `<button class="link-btn" onclick="document.getElementById('modal').dataset.from='prompt';openPeriod('${x.d.id}','${p.from}')">Car off / half day</button>` : ''}</div>
      </div>`;

    <button class="btn rc-yes" onclick="closeModal()">Not yet</button>`;

function pickPref(k, v, boxId) {

// Who usually collects the rent: last choice, else the partner called "Me", else the first partner
function defaultReceiver() {
  const pref = (DB.prefs || {}).receivedBy;
  if (pref && DB.partners.some(p => p.id === pref)) return pref;

/* ── Undo bar for "Received" taps ──
   Every tap made while the bar is still showing is grouped, so one Undo takes them all back.
   It undoes the matching Change log entries, so the log shows the undo too. */
const UNDO_MS = 10000;
let undoIds = [], undoAmt = 0, undoTimer = null;
function showUndo(logId, amount) {
  if (!logId) return;
  undoIds.push(logId); undoAmt += num(amount);
  document.getElementById('undoText').textContent = 'Rent ' + inr(undoAmt) + ' added';
  document.getElementById('undoBar').classList.add('show');
  clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, UNDO_MS);
}
function hideUndo() {
  clearTimeout(undoTimer); undoIds = []; undoAmt = 0;
  document.getElementById('undoBar').classList.remove('show');
}
function undoRent() {
  if (viewOnly() || !undoIds.length) { hideUndo(); return; }
  const ids = undoIds.slice().reverse(), amt = undoAmt;   // newest first
  hideUndo();
  const done = ids.filter(id => undoLog(id, true)).length;
  closeModal(); PAGES[currentPage]();
  toast(done ? 'Undone · ' + inr(amt) + ' removed' : 'Could not undo — see Setup → Change log');
}

/* ════════════ Change log (Setup → Change log) ════════════
   Every save compares the data with the last state the log saw and records what changed
   (added / deleted / edited records, setting changes) as one entry per action.
   Undo applies the opposite of an entry. The log is part of the data, so it syncs to every phone. */
function logSnap(d) {
  const s = {}; LOG_ARR.forEach(c => s[c] = d[c] || []);
  s.settings = d.settings || {}; s.emiNoAuto = d.emiNoAuto || [];
  return JSON.parse(JSON.stringify(s));
}
function logResetBase() { LOG_BASE = logSnap(DB); }
const logSame = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
function logDiff(base, cur) {
  const ops = [];
  for (const c of LOG_ARR) {
    const A = new Map(base[c].map(x => [x.id, x])), B = new Map(cur[c].map(x => [x.id, x]));
    for (const [id, x] of B) {
      const o = A.get(id);
      if (!o) { ops.push({ c, t:'add', id, after: x }); continue; }
      const before = {}, after = {};
      new Set([...Object.keys(o), ...Object.keys(x)]).forEach(k => { if (!logSame(o[k], x[k])) { before[k] = o[k] ?? null; after[k] = x[k] ?? null; } });
      if (Object.keys(after).length) {
        // a few details that say which record it was, for when it no longer exists
        const ctx = {}; ['driverId','name','regNo','category','emiNo','type','from','to','date','half','amount','note'].forEach(k => { if (x[k] !== undefined) ctx[k] = x[k]; });
        ops.push({ c, t:'edit', id, before, after, ctx });
      }
    }
    for (const [id, o] of A) if (!B.has(id)) ops.push({ c, t:'del', id, before: o });
  }
  new Set([...Object.keys(base.settings), ...Object.keys(cur.settings)]).forEach(k => {
    if (!logSame(base.settings[k], cur.settings[k])) ops.push({ c:'settings', t:'set', id:k, before: base.settings[k] ?? null, after: cur.settings[k] ?? null });
  });
  const ea = new Set(base.emiNoAuto), eb = new Set(cur.emiNoAuto);
  eb.forEach(v => { if (!ea.has(v)) ops.push({ c:'emiNoAuto', t:'add', id:v }); });
  ea.forEach(v => { if (!eb.has(v)) ops.push({ c:'emiNoAuto', t:'del', id:v }); });
  return ops;
}
function logChanges() {
  const cur = logSnap(DB);
  if (!LOG_BASE) { LOG_BASE = cur; return; }
  const ops = logDiff(LOG_BASE, cur);
  LOG_BASE = cur;
  const undoOf = LOG_UNDO_OF, tag = LOG_TAG; LOG_UNDO_OF = null; LOG_TAG = '';
  if (!ops.length) return;
  const e = { id: uid(), at: new Date().toISOString(), by: (cloudCfg() || {}).name || 'You', ops };
  if (tag) e.tag = tag;
  if (undoOf) e.undoOf = undoOf;
  const cutoff = new Date(Date.now() - LOG_DAYS * 864e5).toISOString();
  DB.log = [...(DB.log || []), e].filter(x => x.at >= cutoff).slice(-LOG_MAX);
  LAST_LOG_ID = e.id;
}

/* ── Undo one entry ── */
const logKey = op => op.c + ':' + op.id;
function logEntry(id) { return (DB.log || []).find(x => x.id === id); }
// A later change to the same record that is still in effect (a change + its own undo cancel out)
function logBlocker(e) {
  const list = DB.log || [], later = list.slice(list.indexOf(e) + 1), laterIds = new Set(later.map(x => x.id));
  const keys = new Set(e.ops.map(logKey));
  return later.find(x => !x.undone && !(x.undoOf && laterIds.has(x.undoOf)) && x.ops.some(op => keys.has(logKey(op))));
}
function logUsed(id, c) {   // is a driver / vehicle / partner still used by other records?
  const others = [DB.payments, DB.expenses, DB.offs, DB.transfers || [], DB.drivers, DB.vehicles].map(a => a.filter(x => !(x.id === id)));
  return JSON.stringify(others).includes('"' + id + '"');
}
function undoLog(id, quiet) {
  if (viewOnly()) return false;
  const e = logEntry(id); if (!e || e.undone) return false;
  const fail = msg => { if (!quiet) alert(msg); return false; };
  const b = logBlocker(e);
  if (b) return fail('This was changed again later:\n“' + logTitle(b) + '”\n\nUndo that newer change first.');
  for (const op of e.ops) {
    if (!LOG_ARR.includes(op.c)) continue;
    const exists = (DB[op.c] || []).some(x => x.id === op.id);
    if ((op.t === 'del') === exists) return fail('Can’t undo — this entry has already been changed or removed.');
    if (op.t === 'add' && ['drivers','vehicles','partners'].includes(op.c) && logUsed(op.id, op.c))
      return fail('Can’t undo — other entries still use this ' + op.c.slice(0, -1) + '. Remove those first.');
  }
  if (!quiet && !confirm('Undo this change?\n\n' + logTitle(e))) return false;
  for (const op of e.ops.slice().reverse()) {
    if (op.c === 'settings') { DB.settings = DB.settings || {}; if (op.before === null) delete DB.settings[op.id]; else DB.settings[op.id] = op.before; continue; }
    if (op.c === 'emiNoAuto') { const s = new Set(DB.emiNoAuto || []); op.t === 'add' ? s.delete(op.id) : s.add(op.id); DB.emiNoAuto = [...s]; continue; }
    if (op.t === 'add') DB[op.c] = DB[op.c].filter(x => x.id !== op.id);
    else if (op.t === 'del') DB[op.c].push(JSON.parse(JSON.stringify(op.before)));
    else { const x = DB[op.c].find(x => x.id === op.id); Object.entries(op.before).forEach(([k, v]) => { if (v === null) delete x[k]; else x[k] = v; }); }
  }
  LOG_UNDO_OF = e.id; LAST_LOG_ID = null;
  save();                                // logs the undo as its own entry, so it can be undone too
  e.undone = LAST_LOG_ID || true;
  if (!quiet) { PAGES[currentPage](); toast('Undone'); }
  return true;
}

/* ── How an entry reads in the list ── */
const LOG_FIELD = { amount:'Amount', date:'Date', note:'Note', mode:'Mode', receivedBy:'Received in', driverId:'Driver', vehicleId:'Vehicle',
  category:'Category', paidBy:'Paid by', from:'From', to:'To', name:'Name', phone:'Phone', rentAmount:'Rent', rentCycle:'Rent cycle',
  startDate:'Start date', endDate:'End date', regNo:'Reg. no.', price:'Cash price', downPayment:'Upfront', downPaidBy:'Upfront paid by',
  loanAmount:'Loan', netDisbursed:'Net disbursed', irr:'IRR %', emi:'EMI', tenure:'Tenure', emiStartDate:'First EMI', emiPaidBy:'EMI paid by',
  purchaseDate:'Purchase date', share:'Share %', emiNo:'EMI no.', half:'Half', upiId:'UPI ID', upiName:'UPI name' };
const LOG_MONEY = ['amount','rentAmount','price','downPayment','loanAmount','netDisbursed','emi'];
function logVal(k, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (LOG_MONEY.includes(k)) return inr(num(v));
  if (/date$/i.test(k) && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtShort(v);
  if (k === 'driverId') return driverName(v);
  if (k === 'vehicleId') return vehLabel(vehById(v));
  if (['receivedBy','paidBy','from','to','downPaidBy','emiPaidBy'].includes(k)) return partnerName(v);
  if (k === 'rentCycle') return CYCLES[v] || v;
  return String(v);
}
function logItem(op) {
  const cur = LOG_ARR.includes(op.c) && (DB[op.c] || []).find(x => x.id === op.id);
  if (cur) return cur;
  return op.t === 'edit' ? Object.assign({}, op.ctx, op.after) : op.after || op.before || {};
}
function logNoun(c, x) {   // [what, details]
  const note = x.note ? ' · ' + x.note : '';
  switch (c) {
    case 'payments':  return ['Rent', inr(num(x.amount)) + ' · ' + driverName(x.driverId) + note];
    case 'expenses':  return x.category === 'EMI' && x.emiNo ? ['EMI #' + x.emiNo, inr(num(x.amount))] : [x.category || 'Expense', inr(num(x.amount)) + note];
    case 'transfers': return x.type === 'withdraw' ? ['Profit taken', partnerName(x.to) + ' ' + inr(num(x.amount))]
                                                   : ['Partner payment', partnerName(x.from) + ' → ' + partnerName(x.to) + ' ' + inr(num(x.amount))];
    case 'drivers':   return ['Driver', x.name || ''];
    case 'vehicles':  return ['Vehicle', vehLabel(x)];
    case 'partners':  return ['Partner', x.name || ''];
  }
  return [c, ''];
}
function logOpText(op) {
  if (op.c === 'settings') return 'Setting changed: ' + (LOG_FIELD[op.id] || op.id) + ' ' + logVal(op.id, op.before) + ' → ' + logVal(op.id, op.after);
  const x = logItem(op);
  if (op.c === 'offs') return (op.t === 'del' ? 'Car back on · ' : 'Car off · ') + fmtShort(x.date) + ' ' + x.half;
  const [noun, det] = logNoun(op.c, x);
  if (op.t === 'add') return op.c === 'payments' ? 'Rent received ' + det : op.c === 'expenses' && x.category === 'EMI' ? noun + ' paid ' + det : noun + ' added · ' + det;
  if (op.t === 'del') return noun + ' deleted · ' + det + (x.date ? ' (' + fmtShort(x.date) + ')' : '');
  const ch = Object.keys(op.after).filter(k => !['accessCode','id'].includes(k))
    .map(k => (LOG_FIELD[k] || k) + ' ' + logVal(k, op.before[k]) + ' → ' + logVal(k, op.after[k]));
  return noun + ' edited · ' + (op.c === 'payments' ? driverName(x.driverId) : det) + (ch.length ? ': ' + ch.join(', ') : '');
}
const logVisibleOps = e => e.ops.filter(op => op.c !== 'emiNoAuto');
function logTitle(e) { const ops = logVisibleOps(e); return ops.length ? logOpText(ops[0]) : 'EMI auto-mark setting'; }
function logDayLabel(iso) {
  const d = ymd(new Date(iso));
  return d === todayStr() ? 'Today' : d === ymd(addDays(new Date(), -1)) ? 'Yesterday' : fmtDate(d);
}
let logShown = 30;
function logTodayCount() { const t = todayStr(); return (DB.log || []).filter(e => ymd(new Date(e.at)) === t).length; }
function changeLogHtml() {
  const list = (DB.log || []).slice().reverse();
  if (!list.length) return '<div class="empty">Nothing recorded yet. Everything you add, edit or delete from now on shows up here, with an Undo button.</div>';
  let out = '<div class="log">', day = '';
  for (const e of list.slice(0, logShown)) {
    const dl = logDayLabel(e.at);
    if (dl !== day) { out += (day ? '</div>' : '') + `<div class="list-title log-day">${dl}</div><div class="list">`; day = dl; }
    const orig = e.undoOf ? logEntry(e.undoOf) : null;
    const title = e.undoOf ? '↩ Undo: ' + (orig ? logTitle(orig) : 'an earlier change') : logTitle(e);
    const more = e.undoOf ? [] : logVisibleOps(e).slice(1).map(logOpText);
    const time = new Date(e.at).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' });
    const sub = time + ' · ' + esc(e.by) + (e.tag === 'auto' ? ' (automatic)' : '') + more.map(m => '<br>+ ' + esc(m)).join('');
    const right = e.undone ? '<span class="badge b-up">Undone</span>' : `<button class="btn sm" onclick="undoLog('${e.id}')">Undo</button>`;
    out += lrow(`<span class="${e.undone ? 'log-undone' : ''}">${esc(title)}</span>`, sub, '', right);
  }
  out += '</div></div>';
  if (list.length > logShown) out += `<button class="link-btn" style="margin-top:8px" onclick="logShown += 30; PAGES.setup()">Show older (${list.length - logShown} more)</button>`;
  return out + `<div class="help" style="font-size:11px;color:var(--text2);margin-top:8px">Keeps the last ${LOG_DAYS} days. Undo is saved as its own entry, so it can be undone too.</div>`;
}

/* ════════════ Testing mode ════════════
   A snapshot of the real entries is kept while you try things out.
   "Testing completed" puts the real entries back and throws away test data. */
const SNAP_KEY = 'mnscar_snapshot_v1', TESTFLOW_KEY = 'mnscar_testflow_v1';
function getSnapshot() { try { return JSON.parse(localStorage.getItem(SNAP_KEY) || 'null'); } catch { return null; } }
function startTesting() {
  try { localStorage.setItem(SNAP_KEY, JSON.stringify({ at: new Date().toISOString(), data: DB })); }
  catch { alert('Could not save a snapshot — storage is full or blocked.'); return false; }
  return true;
}
function testBanner() {
  const s = getSnapshot(); if (!s) return '';
  const at = new Date(s.at).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'numeric', minute:'2-digit' });
  return `<div class="test-banner"><div><b>Testing mode</b><div style="font-size:12px;opacity:.85">Real entries saved ${at}. Add anything you like.</div></div>
    <button class="btn sm" onclick="finishTesting()">Testing completed</button></div>`;
}
function finishTesting() {
  const s = getSnapshot(); if (!s) return;
  const m = document.getElementById('modal');
  m.innerHTML = `<h3>Testing completed?</h3>
    <p class="muted" style="font-size:14px;margin-bottom:16px">Remove everything added during testing and go back to your real entries from ${new Date(s.at).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'numeric', minute:'2-digit' })}.</p>
    <button class="btn primary rc-yes" onclick="restoreSnapshot()">Remove test entries</button>
    <button class="btn rc-yes" style="margin-top:8px" onclick="keepTestData()">Keep everything (end testing)</button>
    <button class="btn rc-yes" style="margin-top:8px" onclick="closeModal()">Cancel</button>`;
  document.getElementById('overlay').classList.add('open');
}
function restoreSnapshot() {
  const s = getSnapshot(); if (!s) return;
  try {
    clearTimeout(saveTimer);
    s.data._savedAt = new Date().toISOString();   // newest, so it replaces the test data in the cloud too
    localStorage.setItem(STORE_KEY, JSON.stringify(s.data));
    if (cloudCfg()) { DB = s.data; clearTimeout(saveTimer); pushCloud(true); }
    localStorage.removeItem(SNAP_KEY); localStorage.removeItem(SNOOZE_KEY);
    localStorage.setItem(TESTFLOW_KEY, 'done');
  } catch { alert('Could not restore.'); return; }
  setTimeout(() => location.reload(), cloudCfg() ? 1500 : 0);
}
function keepTestData() { try { localStorage.removeItem(SNAP_KEY); localStorage.setItem(TESTFLOW_KEY, 'done'); } catch {} closeModal(); refresh(); toast('Testing ended'); }
function restartTesting() { if (startTesting()) { refresh(); toast('Real entries saved — testing mode on'); } }

function autoMarkEmis() {
  if (isViewer()) return 0;
  const skip = DB.emiNoAuto || [], today = todayStr(); let added = 0;
  for (const v of DB.vehicles) for (const r of emiSchedule(v)) {
    const markOn = ymd(addDays(parseYmd(r.date), 1));
    if (!r.expense && markOn <= today && !skip.includes(v.id + ':' + r.no)) {
      DB.expenses.push({ id:uid(), category:'EMI', emiNo:r.no, vehicleId:v.id, date:markOn, amount:r.amount,
                         paidBy: v.emiPaidBy || FROM_RENT, note:'Auto-marked' });
      added++;
    }
  }
  if (added) { LOG_TAG = 'auto'; save(); }
  return added;
}

  editVeh()[k] = ['price','downPayment','loanAmount','netDisbursed','irr','emi','tenure'].includes(k) ? num(v) : v;
  if (k === 'regNo' || k === 'name') document.querySelectorAll('.veh-name-live').forEach(el => el.textContent = vehLabel(editVeh()));

}

    try {
      const r = await cloudFetch('/login', { method: 'POST', body: JSON.stringify({ mobile: f.mobile, password: f.password }) });
      if (r.status >= 400) throw new Error(r.body.error || 'Login failed');

      el.hidden = true; el.innerHTML = ''; document.body.classList.remove('locked');
      go('dashboard'); afterLoad(); startLive();

/* After logging in: the cloud copy wins. Only if the cloud is still empty does this device's data go up. */
async function firstSync() {
  setCloudState('syncing');
  const r = await cloudFetch('/state');
  if (r.status >= 400) throw new Error(r.body.error || 'Could not load data');
  setClaims(r.body.claims, true);
  if (r.body.data) applyCloud(r.body.data);
  else { DB._savedAt = new Date().toISOString(); await pushCloud(true); }
  setCloudState('ok');
}

function userPayload(d, name) {
  const out = { role: d.role };
  if (d.role === 'manager') out.driverId = d.driverId;
  if (d.role === 'driver') {
    out.managerMobile = d.managerMobile || ''; out.ledgerDriverId = d.ledgerDriverId;
    if (d.ledgerDriverId === '__new') out.newDriver = { name, rent: d.ldRent, startDate: d.ldStart };
  }
  return out;
}
async function saveUser(d, u) {
  if (u) {
    const r = await cloudFetch('/users/role', { method:'POST', body: JSON.stringify({ mobile: u.mobile, ...userPayload(d, u.name) }) });
    if (r.status >= 400) { alert(r.body.error || 'Could not change access'); return; }
    toast('Access changed'); await loadLedger(); OPEN_SECS.add('usr'); PAGES[currentPage]();
    return;
  }
  createUser({ name: d.name, mobile: d.mobile, ...userPayload(d, d.name) });
