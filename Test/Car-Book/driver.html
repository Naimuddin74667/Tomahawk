<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d7a6f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo-192.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MNS Rent">
<title>MNS Tours &amp; Travels — Rent</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same look as the owner app — driver view is read-only */
:root {
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#f1efe9; --border:#e4e0d6;
  --accent:#0d7a6f; --accent-ink:#ffffff; --accent-soft:rgba(13,122,111,.10);
  --text:#1c2333; --text2:#6b7080;
  --green:#15803d; --green-soft:rgba(21,128,61,.10);
  --red:#c2410c; --red-soft:rgba(194,65,12,.10);
  --font-display:'Sora',sans-serif; --font-body:'Inter',sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font-body); background:var(--bg); color:var(--text); font-size:15px; -webkit-font-smoothing:antialiased; }
.wrap { max-width:520px; margin:0 auto; padding:16px 16px calc(32px + env(safe-area-inset-bottom)); }
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.top h1 { font-family:var(--font-display); font-size:17px; display:flex; align-items:center; gap:8px; }
.logo { width:30px; height:30px; border-radius:9px; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:15px; }
.icon-btn { background:var(--surface); border:1px solid var(--border); color:var(--text2); border-radius:10px; padding:8px 12px; font-size:13px; font-family:inherit; }
.hello { font-family:var(--font-display); font-size:22px; font-weight:700; }
.sub { color:var(--text2); font-size:13px; margin-top:3px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; margin-top:14px; box-shadow:0 1px 2px rgba(28,35,51,.05); }
.card h3 { font-family:var(--font-display); font-size:15px; margin-bottom:8px; }
.due { text-align:center; padding:24px 18px; }
.due .label { color:var(--text2); font-size:13px; font-weight:600; }
.due .amt { font-family:var(--font-display); font-size:44px; font-weight:700; margin:6px 0 4px; }
.due.clear .amt { color:var(--green); } .due.pend .amt { color:var(--red); }
.pay { display:block; width:100%; margin-top:14px; padding:15px; border:0; border-radius:14px; background:var(--accent); color:#fff; font-family:inherit; font-size:16px; font-weight:700; text-decoration:none; }
.note { color:var(--text2); font-size:12px; margin-top:8px; }
.other-row { display:grid; grid-template-columns:1fr 100px; gap:8px; margin-top:10px; }
.other-row input { padding:14px; border:1.5px solid var(--accent); border-radius:14px; font-size:18px; font-family:inherit; background:var(--surface); min-width:0; text-align:center; }
.manual-pay { margin-top:14px; background:var(--surface2); border-radius:12px; padding:12px; text-align:left; }
.mp-title { font-weight:700; font-size:13px; margin-bottom:6px; }
.mp-row { display:grid; grid-template-columns:62px 1fr auto; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
.mp-row:last-of-type { border-bottom:0; }
.mp-row span { color:var(--text2); } .mp-row b { word-break:break-all; }
.mp-row button { border:1px solid var(--accent); background:var(--surface); color:var(--accent); border-radius:8px; padding:6px 12px; font-weight:600; font-family:inherit; font-size:13px; }
.mp-help { color:var(--text2); font-size:12px; margin-top:6px; }
.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:10px; font-weight:600; font-size:13px; z-index:99; }
.b-wait { background:rgba(67,56,202,.10); color:#4338ca; }
.paid-form { margin-top:14px; text-align:left; } .paid-form label { font-size:12px; font-weight:600; color:var(--text2); }
.card.rej { border-color:var(--red); background:var(--red-soft); font-size:13px; }
.pay-other { background:var(--surface); color:var(--accent); border:1.5px solid var(--accent); margin-top:10px; cursor:pointer; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
.row:last-child { border-bottom:0; }
.row .t { font-weight:600; } .row .s { color:var(--text2); font-size:12px; margin-top:2px; }
.row .r { display:flex; align-items:center; gap:8px; white-space:nowrap; font-weight:600; }
.badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; }
.b-paid { background:var(--green-soft); color:var(--green); } .b-due { background:var(--red-soft); color:var(--red); }
.b-part { background:var(--accent-soft); color:var(--accent); } .b-off { background:var(--surface2); color:var(--text2); }
.tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--surface2); padding:4px; border-radius:12px; margin-top:14px; }
.tabs button { border:0; background:none; padding:10px; border-radius:9px; font-family:inherit; font-weight:600; font-size:14px; color:var(--text2); }
.tabs button.on { background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.06); }
.more { background:none; border:0; color:var(--accent); font-weight:600; font-size:14px; padding:12px 0 2px; font-family:inherit; }
.msg { text-align:center; padding:60px 20px; color:var(--text2); }
.msg b { display:block; color:var(--text); font-size:17px; margin-bottom:6px; }
.foot { text-align:center; color:var(--text2); font-size:11px; margin-top:18px; }
.install-btn[hidden] { display:none !important; }
.logo-img { width:32px; height:32px; border-radius:9px; box-shadow:0 0 0 1px var(--border); background:#fff; }
/* "I've paid" confirm popup — bottom sheet, same pattern as the owner app */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:50; }
.overlay.open { display:flex; }
.modal { background:var(--surface); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:22px 18px calc(18px + env(safe-area-inset-bottom)); animation:sheet-up .18s ease-out; }
.modal h3 { font-family:var(--font-display); font-size:18px; text-align:center; }
@keyframes sheet-up { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
.cf-amt { font-family:var(--font-display); font-size:42px; font-weight:700; color:var(--accent); text-align:center; margin:12px 0 2px; }
.cf-for { text-align:center; color:var(--text2); font-size:13px; }
.half-check { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; font-size:13px; color:var(--text2); }
.half-check input { width:18px; height:18px; accent-color:var(--accent); }
.cf-cancel { display:block; width:100%; text-align:center; padding:14px 0 4px; }
.pay:disabled, .more:disabled { opacity:.75; }
/* Spinner shown on the button while the payment is being saved */
.spin { display:inline-block; width:16px; height:16px; margin-right:8px; vertical-align:-3px; border:2.5px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
/* ── Driver Ledger ── */
.main-tabs { margin-top:0; margin-bottom:4px; }
.ld-acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
.ld-acts .pay { margin-top:0; font-size:14px; padding:13px 8px; }
.ld-acts .pay.alt { background:var(--surface); color:var(--accent); border:1.5px solid var(--accent); }
.ld-links { display:flex; flex-wrap:wrap; justify-content:center; gap:4px 16px; margin-top:6px; }
.ld-links .more { padding:8px 0 0; font-size:13px; }
.plat { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
.plat span { background:var(--surface2); border-radius:20px; padding:4px 10px; font-size:12px; color:var(--text2); }
.plat b { color:var(--text); }
.dtable { width:100%; border-collapse:collapse; font-size:13px; }
.dtable th { text-align:right; color:var(--text2); font-weight:600; font-size:11px; padding:0 4px 8px; text-transform:uppercase; letter-spacing:.02em; }
.dtable th:first-child, .dtable td:first-child { text-align:left; padding-left:0; }
.dtable td { text-align:right; padding:10px 4px; border-top:1px solid var(--border); white-space:nowrap; }
.dtable td:last-child, .dtable th:last-child { padding-right:0; }
.dtable tr.click td { cursor:pointer; }
.dtable .z { color:var(--text2); opacity:.5; }
.pos { color:var(--green); } .neg { color:var(--red); }
.field { margin-top:12px; text-align:left; }
.field label { display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:5px; }
.field input, .field select { width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:16px; font-family:inherit; background:var(--surface); color:var(--text); }
.err { color:var(--red); font-size:13px; min-height:18px; margin-top:8px; text-align:center; }
.danger-link { color:var(--red) !important; }
.pin-box { font-family:var(--font-display); font-size:36px; font-weight:700; letter-spacing:4px; text-align:center; background:var(--surface2); border-radius:12px; padding:14px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1><img class="logo-img" src="logo.png?v=2" alt="MNS">MNS Tours &amp; Travels</h1><div style="display:flex;gap:6px"><button class="icon-btn install-btn" hidden onclick="installApp()">⤓ Install</button><button class="icon-btn" onclick="loadData()">↻ Refresh</button></div></div>
  <div id="app"><div class="msg">Loading…</div></div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
/* ── Drivers log in on the main page (mobile + PIN). This screen uses that login. ── */
const WORKER_URL = 'https://mns-enterprises.naimuddinshaikh74667.workers.dev';
const AUTH_KEY = 'mnscar_auth_v1';
const apiBase = () => { try { return localStorage.getItem('mnscar_api_override') || WORKER_URL; } catch { return WORKER_URL; } };
const auth = (() => { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch { return null; } })();
function toLogin() { try { localStorage.removeItem(AUTH_KEY); } catch {} location.replace('index.html'); }
// Driver Manager (role "manager", was "driver" before) and drivers under him use this screen; owners/viewers have the full app
const SCREEN_ROLES = ['manager', 'driver'];
if (!auth || !SCREEN_ROLES.includes(auth.role)) location.replace('index.html');
let ROLE = auth && auth.role;          // confirmed with the server on every load (GET /me)

const RENT_DUE_HOUR = 20;    // daily rent is collected at 8 PM (covers last night + today)
let D = null, tab = 'days', showAll = false;
let rentErr = '';   // why "My rent" couldn't load, shown on that tab
let L = null, mainTab = 'rent', ldTab = 'days', ldShowAll = {};   // Driver Ledger data + view state
try { mainTab = localStorage.getItem('mnscar_drvtab_v1') || 'rent'; } catch {}

/* ── Helpers (same rules as the owner app) ── */
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const inr = n => { const r = Math.round(n); return (r < 0 ? '−₹' : '₹') + Math.abs(r).toLocaleString('en-IN'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const addMonths = (d, n) => { const r = new Date(d.getFullYear(), d.getMonth() + n, 1); r.setDate(Math.min(d.getDate(), new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate())); return r; };
const fmtDate = s => parseYmd(s).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
const fmtShort = s => parseYmd(s).toLocaleDateString('en-IN', { day:'numeric', month:'short' });
const todayStr = () => ymd(new Date());
function fmtRange(a, b) {
  if (a === b) return fmtShort(a);
  const A = parseYmd(a), B = parseYmd(b);
  return A.getMonth() === B.getMonth() ? A.getDate() + '–' + fmtShort(b) : fmtShort(a) + ' – ' + fmtShort(b);
}
const isOff = (date, half) => D.offs.some(o => o.date === date && o.half === half);
const halves = day => [{ date: ymd(addDays(parseYmd(day), -1)), half: 'night' }, { date: day, half: 'day' }];

function periods() {
  const drv = D.driver; if (!drv.startDate || !drv.rentAmount) return [];
  let last = todayStr();
  if (drv.rentCycle === 'daily' && new Date().getHours() < RENT_DUE_HOUR) last = ymd(addDays(new Date(), -1));
  const until = parseYmd(drv.endDate && drv.endDate < last ? drv.endDate : last);
  const out = []; let from = parseYmd(drv.startDate), i = 0;
  while (from <= until && i < 3000) {
    const next = drv.rentCycle === 'daily' ? addDays(from, 1) : drv.rentCycle === 'weekly' ? addDays(from, 7) : addMonths(parseYmd(drv.startDate), i + 1);
    const p = { from: ymd(from), to: ymd(addDays(next, -1)), due: num(drv.rentAmount), paid: 0, off: [] };
    if (drv.rentCycle === 'daily') { p.off = halves(p.from).filter(x => isOff(x.date, x.half)); p.due = num(drv.rentAmount) * (2 - p.off.length) / 2; }
    out.push(p); from = next; i++;
  }
  // Payments cover the oldest days first
  let pool = D.payments.reduce((s, x) => s + num(x.amount), 0);
  for (const p of out) { const t = Math.min(pool, p.due); p.paid = t; pool -= t; }
  // Then his "I've paid" amounts still waiting for the owner mark the next days "In process"
  let wait = waitingClaims().reduce((s, c) => s + num(c.amount), 0);
  for (const p of out) { const t = Math.min(wait, p.due - p.paid); p.wait = t; wait -= t; }
  return out;
}
const waitingClaims = () => (D.claims || []).filter(c => c.status === 'pending');
const shortLabel = p => label({ ...p, off: [] });
function rangeText(list) {
  if (!list.length) return '';
  return list.length === 1 ? shortLabel(list[0]) : shortLabel(list[0]) + ' to ' + shortLabel(list[list.length - 1]);
}
let sending = false;   // true while an "I've paid" is on its way — blocks double taps

/* Step 1: "I've paid" opens a confirm popup. Full day by default; small checkbox for a half day. */
function openPaid() {
  if (sending) return;
  const full = num(D.driver.rentAmount);
  const next = periods().find(p => p.paid + p.wait < p.due);
  const daily = D.driver.rentCycle === 'daily';
  document.getElementById('modal').innerHTML = `<h3>Confirm payment</h3>
    <div class="cf-amt" id="cfAmt">${inr(full)}</div>
    <div class="cf-for">${next ? 'Rent ' + esc(shortLabel(next)) : 'Rent advance'} · paid to the owner by UPI</div>
    ${daily ? `<label class="half-check"><input type="checkbox" id="cfHalf" onchange="updateConfirm()"> Half day only (${inr(full / 2)})</label>` : ''}
    <button class="pay" id="cfGo" onclick="sendPaid()">Confirm ${inr(full)}</button>
    <button class="more cf-cancel" id="cfCancel" onclick="closePaid()">Cancel</button>`;
  document.getElementById('overlay').classList.add('open');
}
const paidAmount = () => {
  const full = num(D.driver.rentAmount), half = document.getElementById('cfHalf');
  return half && half.checked ? full / 2 : full;
};
function updateConfirm() {   // checkbox ticked/unticked → update the amount shown
  document.getElementById('cfAmt').textContent = inr(paidAmount());
  document.getElementById('cfGo').textContent = 'Confirm ' + inr(paidAmount());
}
function closePaid() {
  if (sending) return;       // can't close while saving
  document.getElementById('overlay').classList.remove('open');
}
// Tap on the dark area outside the popup = Cancel
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closePaid(); });


/* Lock the popup and show a spinner while saving, so a second tap can't send it twice */
function setSending(on) {
  sending = on;
  const go = document.getElementById('cfGo');
  if (go) { go.disabled = on; go.innerHTML = on ? '<span class="spin"></span>Sending…' : 'Confirm ' + inr(paidAmount()); }
  ['cfCancel', 'cfHalf'].forEach(id => { const el = document.getElementById(id); if (el) el.disabled = on; });
}

/* Step 2: Confirm → send to the owner */
async function sendPaid() {
  if (sending) return;
  const amount = paidAmount(), half = amount < num(D.driver.rentAmount);
  // Label the next day this payment covers, e.g. "Rent 16–17 Oct" (+ "half day")
  const next = periods().find(p => p.paid + p.wait < p.due);
  const label = (next ? 'Rent ' + shortLabel(next) : 'Rent advance') + (half ? ' (half day)' : '');
  setSending(true);
  try {
    const res = await fetch(apiBase() + '/driver/claim', { method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + auth.token },
      body: JSON.stringify({ amount, label, day: next ? next.from : null }) });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401 || res.status === 403) { toLogin(); return; }
    if (!res.ok) { alert(body.error || 'Could not send — please try again'); return; }
    // Show it as "In process" straight away; the full refresh runs in the background
    D.claims = (D.claims || []).concat([{ id: body.id, amount, label, status: 'pending', createdAt: new Date().toISOString() }]);
    setSending(false); closePaid(); render();
    flash('✓ ' + inr(amount) + ' sent — waiting for the owner to confirm');
    loadData();
  } catch { alert('No internet — please try again'); }
  finally { if (sending) setSending(false); }
}
async function cancelClaim(id) {
  if (!confirm('Cancel this "I’ve paid"?')) return;
  await fetch(apiBase() + '/driver/claim/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + auth.token },
    body: JSON.stringify({ id }) }).catch(() => {});
  loadData();
}
function flash(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2800); }
const timeShort = s => new Date(s).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
function label(p) {
  if (D.driver.rentCycle !== 'daily') return fmtRange(p.from, p.to);
  const base = fmtRange(ymd(addDays(parseYmd(p.from), -1)), p.from);
  return p.off.length === 1 ? base + ' (' + p.off[0].half + ' off)' : base;
}
function status(p) {
  if (p.due === 0) return '<span class="badge b-off">Car off</span>';
  if (p.paid >= p.due) return '<span class="badge b-paid">Paid</span>';
  if (p.paid + (p.wait || 0) >= p.due) return '<span class="badge b-wait">In process</span>';
  if (p.paid > 0) return '<span class="badge b-part">Part ' + inr(p.paid) + '</span>';
  return '<span class="badge b-due">Pending</span>';
}

/* ── Render ── */
function render() {
  if (ROLE === 'driver') { renderLedger(); return; }
  const tabs = `<div class="tabs main-tabs"><button class="${mainTab === 'rent' ? 'on' : ''}" onclick="setMainTab('rent')">My rent</button>
    <button class="${mainTab === 'ledger' ? 'on' : ''}" onclick="setMainTab('ledger')">Driver ledger</button></div>`;
  if (mainTab === 'ledger') { renderLedger(tabs); return; }
  // Rent screen failed to load (e.g. his rent record was removed or changed) → say so instead of "Loading…" forever
  if (!D) { document.getElementById('app').innerHTML = tabs + (rentErr
    ? `<div class="msg"><b>Can\u2019t show your rent</b>${esc(rentErr)}<br><br>The Driver ledger tab still works.</div>`
    : '<div class="msg">Loading…</div>'); return; }
  renderRent(tabs);
}
function setMainTab(t) { mainTab = t; try { localStorage.setItem('mnscar_drvtab_v1', t); } catch {} render(); window.scrollTo(0, 0); }

function renderRent(tabs) {
  const P = periods();
  const due = P.reduce((s, p) => s + p.due, 0), paid = D.payments.reduce((s, x) => s + num(x.amount), 0);
  const waitAmt = waitingClaims().reduce((s, c) => s + num(c.amount), 0);
  const pending = Math.max(0, due - paid - waitAmt), advance = Math.max(0, paid - due);
  const pendDays = P.filter(p => p.paid + p.wait < p.due);
  const rejected = (D.claims || []).filter(c => c.status === 'rejected' && c.resolvedAt && (Date.now() - new Date(c.resolvedAt)) < 3 * 864e5);
  const cycle = { daily:'per day', weekly:'per week', monthly:'per month' }[D.driver.rentCycle] || '';
  const daysList = (showAll ? P.slice().reverse() : P.slice(-10).reverse());

  document.getElementById('app').innerHTML = tabs + `
    <div class="hello">Hi ${esc(D.driver.name.split(' ')[0])} 👋</div>
    <div class="sub">${esc(D.car.name)}${D.car.regNo ? ' · ' + esc(D.car.regNo) : ''} · ${inr(D.driver.rentAmount)} ${cycle}</div>

    <div class="card due ${pending ? 'pend' : 'clear'}">
      <div class="label">${pending ? 'Rent pending' : waitAmt ? 'Waiting for owner to confirm' : advance ? 'Paid in advance' : 'All rent paid'}</div>
      <div class="amt">${pending ? inr(pending) : waitAmt ? inr(waitAmt) : advance ? inr(advance) : '✓'}</div>
      <div class="sub">${pending ? pendDays.length + ' day' + (pendDays.length === 1 ? '' : 's') + ' pending · ' + pendDays.slice(0, 3).map(label).join(', ') + (pendDays.length > 3 ? '…' : '')
        : waitAmt ? 'You marked it paid — it shows as Paid once the owner confirms.' : 'Thank you! Nothing due right now.'}</div>
      <button class="pay" onclick="openPaid()">✓ I've paid ${inr(D.driver.rentAmount)}</button>
      <div class="note">Pay the owner by UPI as usual, then tap here.</div>
      ${D.driver.rentCycle === 'daily' ? `<div class="note">Daily rent is due at 8 PM and covers last night + today.</div>` : ''}
    </div>

    ${waitingClaims().length ? `<div class="card"><h3>Waiting for owner</h3>${waitingClaims().map(c => `<div class="row">
        <div><div class="t">${inr(c.amount)}</div><div class="s">${esc(c.label || '')} · sent ${timeShort(c.createdAt)}</div></div>
        <div class="r"><span class="badge b-wait">In process</span><button class="more" style="padding:0" onclick="cancelClaim('${c.id}')">Cancel</button></div></div>`).join('')}</div>` : ''}
    ${rejected.map(c => `<div class="card rej"><b>${inr(c.amount)} not received</b> — the owner marked your payment of ${timeShort(c.createdAt)} as not received. Please contact the owner.</div>`).join('')}

    <div class="tabs"><button class="${tab === 'days' ? 'on' : ''}" onclick="tab='days';render()">Rent days</button>
      <button class="${tab === 'pays' ? 'on' : ''}" onclick="tab='pays';render()">Payments</button></div>

    <div class="card">${tab === 'days'
      ? (daysList.map(p => `<div class="row"><div><div class="t">${label(p)}</div></div><div class="r">${inr(p.due)} ${status(p)}</div></div>`).join('') || '<div class="msg" style="padding:24px">No rent days yet</div>')
        + (P.length > 10 ? `<button class="more" onclick="showAll=!showAll;render()">${showAll ? 'Show latest only' : 'Show all ' + P.length + ' days'}</button>` : '')
      : (D.payments.slice().sort((a, b) => b.date.localeCompare(a.date)).map(x => `<div class="row"><div><div class="t">${fmtDate(x.date)}</div><div class="s">${esc(x.mode || 'Online')}</div></div><div class="r" style="color:var(--green)">${inr(x.amount)}</div></div>`).join('') || '<div class="msg" style="padding:24px">No payments yet</div>')
    }</div>
    <div class="foot">Updated ${new Date(D.updatedAt).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'numeric', minute:'2-digit' })} · View only · <a href="#" onclick="logoutDriver();return false" style="color:var(--text2)">Log out</a></div>`;
}
function showMsg(title, text) { document.getElementById('app').innerHTML = `<div class="msg"><b>${title}</b>${text}</div>`; }

function logoutDriver() {
  if (!confirm('Log out?')) return;
  fetch(apiBase() + '/logout', { method:'POST', headers: { Authorization: 'Bearer ' + auth.token } }).catch(() => {});
  toLogin();
}

const api = (path, opts = {}) => fetch(apiBase() + path, { cache: 'no-store', ...opts,
  headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + auth.token } })
  .then(async res => ({ status: res.status, ok: res.ok, body: await res.json().catch(() => ({})) }));

async function loadData() {
  if (!auth || !SCREEN_ROLES.includes(auth.role)) return;
  try {
    // Who am I really? (the old "driver" login was renamed to "manager" on the server)
    const me = await api('/me');
    if (me.status === 401) { toLogin(); return; }
    if (me.ok && me.body.role && me.body.role !== ROLE) {
      ROLE = me.body.role;
      if (!SCREEN_ROLES.includes(ROLE)) { location.replace('index.html'); return; }
      try { localStorage.setItem(AUTH_KEY, JSON.stringify({ ...auth, role: ROLE })); } catch {}
    }
    const [rent, led] = await Promise.all([ROLE === 'manager' ? api('/driver') : null, api('/ledger')]);
    if ((rent && (rent.status === 401 || rent.status === 403)) || led.status === 401) { toLogin(); return; }
    if (led.ok) L = led.body;
    if (rent) {
      if (!rent.ok) rentErr = rent.body.error || 'Please contact the owner.';
      else { D = rent.body; rentErr = ''; }
    }
    if (ROLE === 'driver' && !led.ok) { if (!L) showMsg('Can\u2019t open', esc(led.body.error || 'Please contact the owner.')); return; }
    if (!sending) render();
  } catch (e) {   // keep last view if a background refresh fails
    if (!D && !L) showMsg('No connection', 'Check your internet and tap Refresh.');
    else if (!D) { rentErr = 'No connection — tap Refresh.'; render(); }
  }
}

/* ════════════ Driver Ledger ════════════
   For each driver under the manager:
     driver owes = daily rent − platform money (Uber/Ola/Rapido…) that came to the manager's bank − cash he gave
   Positive balance = collect from the driver. Negative = the manager owes the driver. */
const KIND_LABEL = { credit: 'Platform money', cash: 'Cash from driver', waive: 'Rent off' };
// Exact rupees + paise, so amounts match the bank SMS (₹614.45, not ₹614)
const inr2 = n => { const a = Math.abs(Math.round(n * 100) / 100); const t = a.toLocaleString('en-IN', { minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return (n < -0.004 ? '−₹' : '₹') + t; };
const canEditLedger = () => ROLE === 'manager';
const ldEntries = id => (L ? L.entries : []).filter(e => e.driverId === id);

/* Day-wise rows from the start date to today (or the end date), oldest first, with a running balance. */
function ledgerDays(drv) {
  const es = ldEntries(drv.id), today = todayStr();
  const last = drv.endDate && drv.endDate < today ? drv.endDate : today;
  const dates = new Set();
  for (let d = parseYmd(drv.startDate), i = 0; ymd(d) <= last && i < 3000; d = addDays(d, 1), i++) dates.add(ymd(d));
  es.forEach(e => dates.add(e.date));
  let bal = 0;
  return [...dates].sort().map(date => {
    const of = k => es.filter(e => e.date === date && e.kind === k).reduce((s, e) => s + num(e.amount), 0);
    const rentDay = date >= drv.startDate && date <= last ? num(drv.rent) : 0;
    const waive = Math.min(of('waive'), rentDay), rent = rentDay - waive, credit = of('credit'), cash = of('cash');
    bal = Math.round((bal + rent - credit - cash) * 100) / 100;
    return { date, rent, waive, credit, cash, bal };
  });
}
function ledgerTotals(drv) {
  const days = ledgerDays(drv), es = ldEntries(drv.id);
  const byPlat = {};
  es.filter(e => e.kind === 'credit').forEach(e => byPlat[e.platform || 'Other'] = (byPlat[e.platform || 'Other'] || 0) + num(e.amount));
  const s = k => days.reduce((t, d) => t + d[k], 0);
  return { days, balance: days.length ? days[days.length - 1].bal : 0, rent: s('rent'), credit: s('credit'), cash: s('cash'), byPlat };
}

function renderLedger(tabs) {
  const app = document.getElementById('app');
  if (!L) { app.innerHTML = (tabs || '') + '<div class="msg">Loading…</div>'; return; }
  const mgr = canEditLedger(), drivers = L.drivers;
  const blocks = drivers.map(drv => {
    const T = ledgerTotals(drv), first = drv.name.split(' ')[0];
    const b = T.balance, owe = b > 0.004, back = b < -0.004;
    const head = mgr
      ? (owe ? 'Collect from ' + esc(first) : back ? 'You owe ' + esc(first) : 'All settled with ' + esc(first))
      : (owe ? 'You need to give' : back ? 'You will get back' : 'All settled');
    const plats = Object.keys(T.byPlat).sort();
    const days = T.days.slice().reverse(), shown = ldShowAll[drv.id] ? days : days.slice(0, 10);
    const es = ldEntries(drv.id).slice().sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
    return `
      ${mgr || L.drivers.length > 1 ? `<div class="hello" style="font-size:19px;margin-top:6px">${esc(drv.name)}</div>` : `<div class="hello">Hi ${esc(first)} 👋</div>`}
      <div class="sub">${inr2(drv.rent)} per day · since ${fmtDate(drv.startDate)}${drv.endDate ? ' · left ' + fmtDate(drv.endDate) : ''}</div>
      <div class="card due ${owe ? 'pend' : 'clear'}">
        <div class="label">${head}</div>
        <div class="amt">${owe || back ? inr2(Math.abs(b)) : '✓'}</div>
        <div class="sub">Rent ${inr2(T.rent)} − platform ${inr2(T.credit)} − cash ${inr2(T.cash)}</div>
        ${plats.length ? `<div class="plat">${plats.map(p => `<span>${esc(p)} <b>${inr2(T.byPlat[p])}</b></span>`).join('')}</div>` : ''}
        ${mgr ? `<div class="ld-acts"><button class="pay alt" onclick="openEntry('${drv.id}','credit')">+ Platform money</button>
            <button class="pay" onclick="openEntry('${drv.id}','cash')">+ Cash from ${esc(first)}</button></div>
          <div class="ld-links"><button class="more" onclick="openEntry('${drv.id}','waive')">Rent off day</button>
            <button class="more" onclick="shareLedger('${drv.id}')">Send on WhatsApp</button>
            <button class="more" onclick="driverLogin('${drv.id}')">${drv.hasLogin ? 'New PIN' : 'Send login'}</button>
            <button class="more" onclick="openLdDriver('${drv.id}')">Edit</button></div>`
          : `<div class="note">Platform money = what Uber/Ola/Rapido sent to the manager's bank for your trips.</div>`}
      </div>
      <div class="tabs"><button class="${ldTab === 'days' ? 'on' : ''}" onclick="ldTab='days';render()">Day-wise</button>
        <button class="${ldTab === 'entries' ? 'on' : ''}" onclick="ldTab='entries';render()">Entries</button></div>
      <div class="card">${ldTab === 'days'
        ? `<table class="dtable"><thead><tr><th>Day</th><th>Rent</th><th>Platform</th><th>Cash</th><th>Balance</th></tr></thead><tbody>
            ${shown.map(d => `<tr${mgr ? ` class="click" onclick="openDay('${drv.id}','${d.date}')"` : ''}><td>${fmtShort(d.date)}</td>
              <td${d.rent ? '' : ' class="z"'}>${d.waive && !d.rent ? 'off' : inr2(d.rent)}</td>
              <td${d.credit ? '' : ' class="z"'}>${d.credit ? inr2(d.credit) : '—'}</td>
              <td${d.cash ? '' : ' class="z"'}>${d.cash ? inr2(d.cash) : '—'}</td>
              <td class="${d.bal > 0.004 ? 'neg' : d.bal < -0.004 ? 'pos' : ''}"><b>${inr2(d.bal)}</b></td></tr>`).join('') || '<tr><td colspan="5">No days yet</td></tr>'}
          </tbody></table>
          ${days.length > 10 ? `<button class="more" onclick="ldShowAll['${drv.id}']=!ldShowAll['${drv.id}'];render()">${ldShowAll[drv.id] ? 'Show latest only' : 'Show all ' + days.length + ' days'}</button>` : ''}
          <div class="note">Balance in red = ${mgr ? esc(first) + ' still has to give' : 'you still have to give'}. Green = ${mgr ? 'you owe ' + esc(first) : 'you get back'}.</div>`
        : (es.map(e => entryRow(e, mgr)).join('') || '<div class="msg" style="padding:24px">No entries yet</div>')}
      </div>`;
  }).join('<div style="height:18px"></div>');
  app.innerHTML = (tabs || '') + (blocks || `<div class="card msg" style="padding:30px 18px"><b>No drivers yet</b>${mgr ? 'Add the driver who runs the car with you.' : 'Please contact the manager.'}</div>`)
    + (mgr ? `<button class="pay pay-other" style="margin-top:18px" onclick="openLdDriver()">+ Add driver</button>` : '')
    + `<div class="foot">${mgr ? 'Driver ledger' : 'View only'} · <a href="#" onclick="logoutDriver();return false" style="color:var(--text2)">Log out</a></div>`;
}
function entryRow(e, mgr) {
  const sign = e.kind === 'waive' ? '' : '−';
  return `<div class="row"${mgr ? ` style="cursor:pointer" onclick="openEntry('${e.driverId}','${e.kind}','${e.id}')"` : ''}>
    <div><div class="t">${e.kind === 'credit' ? esc(e.platform || 'Platform') + ' → bank' : KIND_LABEL[e.kind]}</div>
      <div class="s">${fmtDate(e.date)}${e.note ? ' · ' + esc(e.note) : ''}</div></div>
    <div class="r ${e.kind === 'waive' ? '' : 'pos'}">${sign}${inr2(e.amount)}</div></div>`;
}

/* Bottom-sheet form helpers (same sheet as the "I've paid" popup) */
function sheet(html) { document.getElementById('modal').innerHTML = html; document.getElementById('overlay').classList.add('open'); }
function closeSheet() { document.getElementById('overlay').classList.remove('open'); }
const ldDriver = id => L.drivers.find(d => d.id === id);

/* Tap a day → what was entered that day, plus quick add */
function openDay(driverId, date) {
  const es = ldEntries(driverId).filter(e => e.date === date);
  sheet(`<h3>${fmtDate(date)}</h3>
    <div style="margin-top:10px">${es.map(e => entryRow(e, true)).join('') || '<div class="msg" style="padding:16px">Nothing entered for this day</div>'}</div>
    <div class="ld-acts"><button class="pay alt" onclick="openEntry('${driverId}','credit',null,'${date}')">+ Platform money</button>
      <button class="pay" onclick="openEntry('${driverId}','cash',null,'${date}')">+ Cash</button></div>
    <button class="more cf-cancel" onclick="openEntry('${driverId}','waive',null,'${date}')">Mark rent off this day</button>
    <button class="more cf-cancel" onclick="closeSheet()">Close</button>`);
}

/* Add / edit one entry */
function openEntry(driverId, kind, id, date) {
  const drv = ldDriver(driverId), e = id ? L.entries.find(x => x.id === id) : null;
  const plats = L.platforms || ['Uber', 'Ola', 'Rapido', 'Other'];
  const title = { credit: 'Platform money to bank', cash: 'Cash from ' + drv.name.split(' ')[0], waive: 'Rent off day' }[kind];
  const help = { credit: 'Money Uber / Ola / Rapido sent to your bank for ' + drv.name.split(' ')[0] + '\u2019s trips. Type it exactly as in the bank SMS.',
                 cash: 'Cash (or UPI) ' + drv.name.split(' ')[0] + ' gave you towards rent.',
                 waive: 'Car didn\u2019t run — this much rent is not charged for the day.' }[kind];
  sheet(`<h3>${e ? 'Edit · ' : ''}${esc(title)}</h3><div class="cf-for" style="margin-top:4px">${esc(help)}</div>
    <form id="entForm">
      <div class="field"><label>Date</label><input name="date" type="date" required value="${esc(e ? e.date : date || todayStr())}"></div>
      ${kind === 'credit' ? `<div class="field"><label>Platform</label><select name="platform">${plats.map(p => `<option ${e && e.platform === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>Amount (₹)</label><input name="amount" type="number" step="0.01" inputmode="decimal" required value="${e ? e.amount : kind === 'waive' ? drv.rent : ''}"></div>
      <div class="field"><label>Note (optional)</label><input name="note" type="text" maxlength="120" value="${esc(e ? e.note : '')}"></div>
      <div class="err" id="entErr"></div>
      <button class="pay" id="entGo">Save</button>
    </form>
    ${e ? `<button class="more cf-cancel danger-link" onclick="deleteEntry('${e.id}')">Delete this entry</button>` : ''}
    <button class="more cf-cancel" onclick="closeSheet()">Cancel</button>`);
  const f = document.getElementById('entForm');
  setTimeout(() => { if (!e) f.amount.focus(); }, 80);
  f.onsubmit = async ev => {
    ev.preventDefault();
    const btn = document.getElementById('entGo'); if (btn.disabled) return;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Saving…';
    const d = Object.fromEntries(new FormData(f).entries());
    const r = await api('/ledger/entry', { method: 'POST', body: JSON.stringify({ ...d, id: e ? e.id : undefined, driverId, kind }) }).catch(() => null);
    if (!r || !r.ok) { btn.disabled = false; btn.textContent = 'Save'; document.getElementById('entErr').textContent = r ? (r.body.error || 'Could not save') : 'No internet — try again'; return; }
    closeSheet(); flash('✓ Saved'); await loadData();
  };
}
async function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  const r = await api('/ledger/entry/delete', { method: 'POST', body: JSON.stringify({ id }) }).catch(() => null);
  if (!r || !r.ok) { alert(r ? r.body.error || 'Could not delete' : 'No internet'); return; }
  closeSheet(); flash('Deleted'); loadData();
}

/* Add / edit a driver under the manager */
function openLdDriver(id) {
  const d = id ? ldDriver(id) : null;
  sheet(`<h3>${d ? 'Edit driver' : 'Add driver'}</h3>
    <form id="ldForm">
      <div class="field"><label>Name</label><input name="name" required value="${esc(d ? d.name : '')}"></div>
      <div class="field"><label>Mobile number</label><input name="mobile" type="tel" inputmode="numeric" placeholder="10-digit — needed for his login" value="${esc(d ? d.mobile : '')}"></div>
      <div class="field"><label>Rent per day (₹)</label><input name="rent" type="number" step="0.01" inputmode="decimal" required value="${d ? d.rent : 600}"></div>
      <div class="field"><label>Start date</label><input name="startDate" type="date" required value="${esc(d ? d.startDate : todayStr())}"></div>
      <div class="field"><label>Left on (only if he stopped)</label><input name="endDate" type="date" value="${esc(d ? d.endDate : '')}"></div>
      <div class="err" id="ldErr"></div>
      <button class="pay" id="ldGo">Save</button>
    </form><button class="more cf-cancel" onclick="closeSheet()">Cancel</button>`);
  const f = document.getElementById('ldForm');
  f.onsubmit = async ev => {
    ev.preventDefault();
    const btn = document.getElementById('ldGo'); if (btn.disabled) return; btn.disabled = true;
    const data = Object.fromEntries(new FormData(f).entries());
    const r = await api('/ledger/driver', { method: 'POST', body: JSON.stringify({ ...data, id: d ? d.id : undefined }) }).catch(() => null);
    if (!r || !r.ok) { btn.disabled = false; document.getElementById('ldErr').textContent = r ? (r.body.error || 'Could not save') : 'No internet — try again'; return; }
    closeSheet(); flash('✓ Saved'); loadData();
  };
}

/* Make / renew the driver's own login (read-only ledger) and send it on WhatsApp */
async function driverLogin(id) {
  const d = ldDriver(id);
  if ((d.mobile || '').replace(/\D/g, '').length !== 10) { alert('Add ' + d.name.split(' ')[0] + '\u2019s 10-digit mobile number first.'); openLdDriver(id); return; }
  if (d.hasLogin && !confirm('Make a new PIN for ' + d.name + '? His old PIN stops working.')) return;
  const r = await api('/ledger/login', { method: 'POST', body: JSON.stringify({ driverId: id }) }).catch(() => null);
  if (!r || !r.ok) { alert(r ? r.body.error || 'Could not create login' : 'No internet'); return; }
  const link = new URL('./', location.href).href;
  const msg = 'Hi ' + d.name.split(' ')[0] + ', your MNS Tours & Travels login to see your rent account:\n' + link + '\nMobile: ' + r.body.mobile + '\nPIN: ' + r.body.pin +
              '\n\nOpen the link in Chrome and tap "Install" to add it as an app.';
  window._pinMsg = msg;
  sheet(`<h3>Login ready</h3><div class="cf-for">${esc(d.name)} · ${esc(r.body.mobile)}</div>
    <div class="pin-box">${r.body.pin.replace(/(\d{3})(\d{3})/, '$1 $2')}</div>
    <div class="note" style="text-align:center">Send it now — the PIN can\u2019t be seen again (you can make a new one).</div>
    <button class="pay" onclick="window.open('https://wa.me/91${r.body.mobile}?text=' + encodeURIComponent(window._pinMsg), '_blank')">Send on WhatsApp</button>
    <button class="more cf-cancel" onclick="closeSheet();loadData()">Done</button>`);
}

/* Short statement for WhatsApp */
function shareLedger(id) {
  const d = ldDriver(id), T = ledgerTotals(d), b = T.balance;
  const last = T.days.slice(-7).reverse().map(x => `${fmtShort(x.date)}: rent ${inr2(x.rent)}${x.credit ? ', platform ' + inr2(x.credit) : ''}${x.cash ? ', cash ' + inr2(x.cash) : ''} → ${inr2(x.bal)}`).join('\n');
  const text = `*MNS Tours & Travels — Rent account*\n${d.name} · ${inr2(d.rent)}/day since ${fmtDate(d.startDate)}\n\n` +
    `Rent: ${inr2(T.rent)}\nPlatform money (to bank): ${inr2(T.credit)}\nCash given: ${inr2(T.cash)}\n` +
    `*${b > 0.004 ? 'To give: ' + inr2(b) : b < -0.004 ? 'To get back: ' + inr2(-b) : 'All settled ✅'}*\n\nLast days:\n${last}`;
  const phone = (d.mobile || '').replace(/\D/g, '').slice(-10);
  window.open('https://wa.me/' + (phone.length === 10 ? '91' + phone : '') + '?text=' + encodeURIComponent(text), '_blank');
}
loadData();
// Keep it fresh while open: every 30 s, and whenever he comes back to the app
setInterval(() => { if (!document.hidden && (D || L)) loadData(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && (D || L)) loadData(); });
// Recheck at 8 PM if left open
(() => { const n = new Date(), at = new Date(n); at.setHours(RENT_DUE_HOUR, 0, 5, 0); if (at > n) setTimeout(() => D && render(), at - n); })();
// "Install app" button — shown only when Chrome offers installation and the app isn't installed yet
var installEvt = null;   // var: read by the login screen, which can render before this line runs
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  document.querySelectorAll('.install-btn').forEach(b => b.hidden = false);
});
window.addEventListener('appinstalled', () => document.querySelectorAll('.install-btn').forEach(b => b.hidden = true));
function installApp() {
  if (!installEvt) return;
  installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; document.querySelectorAll('.install-btn').forEach(b => b.hidden = true); });
}
// Installable app + offline open
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
