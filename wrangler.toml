name = "tomahawk-returns"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "tomahawk-returns"
database_id = "93db4199-7fd1-4839-a6c7-3bf89006f846"

# Runs checkNewRoEmails() automatically every 15 minutes via the
# scheduled() handler in worker.js — no manual trigger, no dashboard
# click needed. Change the schedule here (and push) to adjust it later.
[triggers]
crons = ["*/15 * * * *"]
