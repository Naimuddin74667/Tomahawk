name = "tomahawk-returns"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "tomahawk-returns"
database_id = "93db4199-7fd1-4839-a6c7-3bf89006f846"

# Delhivery — plain (non-secret) config values. These must live HERE, not
# only in the Cloudflare Dashboard: a `wrangler deploy` treats this file as
# the full source of truth for vars and wipes anything set only via the
# Dashboard UI on the next deploy. Neither value is sensitive — the pickup
# location name and GST number are already printed on every shipping label.
# DELHIVERY_API_TOKEN stays a Dashboard/Wrangler *Secret* instead — never
# put that here, secrets are stored separately and survive redeploys fine.
[vars]
DELHIVERY_PICKUP_LOCATION = "INDUTRIAL TOOLS CORPORATION"
DELHIVERY_SELLER_GST = "27AAAFI9717N1ZV"

# Workers AI — powers the Ops Chatbot (chatAsk action in worker.js).
# Free within Cloudflare's Workers AI included usage, same account as
# everything else here — no separate API key/account needed.
[ai]
binding = "AI"

# Runs checkNewRoEmails() automatically every 15 minutes via the
# scheduled() handler in worker.js — no manual trigger, no dashboard
# click needed. Change the schedule here (and push) to adjust it later.
[triggers]
crons = ["*/15 * * * *"]
