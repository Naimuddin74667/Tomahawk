<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>Scanner Dashboard — Tomahawk</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&family=Roboto+Slab:wght@400;600&display=swap');

:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --surface3: #252535;
  --border: #2a2a3d;
  --accent: #F5A800;
  --accent-dim: rgba(245,168,0,0.12);
  --accent-glow: rgba(245,168,0,0.25);
  --green: #4ade80;
  --green-dim: rgba(74,222,128,0.12);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.12);
  --blue: #60a5fa;
  --blue-dim: rgba(96,165,250,0.12);
  --text: #e8eaf0;
  --text2: #8b90a7;
  --text3: #7a80a0;
  --mono: 'DM Sans', sans-serif;
  --sans: 'DM Sans', sans-serif;
  --display: 'Syne', sans-serif;
  --radius: 12px;
  --radius-sm: 8px;
}

html[data-theme="light"] {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface2: #f0f1f4;
  --surface3: #e4e6ec;
  --border: #d0d4e0;
  --accent: #d4920a;
  --accent-dim: rgba(212,146,10,0.12);
  --accent-glow: rgba(212,146,10,0.25);
  --text: #1a1d27;
  --text2: #5a6075;
  --text3: #8b90a7;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

/* ── SCREENS ── */
.screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
.screen.active { display: flex; }

/* ── TOP BAR ── */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: 62px;
  padding: 0 28px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.header-logo { display: flex; align-items: center; gap: 14px; text-decoration: none; flex-shrink: 0; }
.logo-svg-wrap { display: flex; align-items: center; color: var(--accent); }
.logo-svg-wrap svg { height: 42px; width: auto; display: block; fill: currentColor; flex-shrink: 0; }
.logo-divider { width: 2px; height: 36px; background: rgba(255,255,255,0.5); border-radius: 2px; flex-shrink: 0; }
html[data-theme="light"] .logo-divider { background: rgba(0,0,0,0.25); }
.logo-tagline { font-family: var(--sans); font-size: 16px; font-weight: 600; color: var(--text2); letter-spacing: .04em; flex-shrink: 0; white-space: nowrap; }
.topbar-avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800; color: #111; font-family: var(--sans);
  flex-shrink: 0;
}
.theme-toggle {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text2); transition: background .15s, border-color .15s, color .15s;
  flex-shrink: 0;
}
.theme-toggle:active { border-color: var(--accent); color: var(--accent); }
.theme-toggle svg { display: block; }
html:not([data-theme="light"]) .icon-sun { display: none; }
html[data-theme="light"] .icon-moon { display: none; }
.topbar-info { flex: 1; min-width: 0; }
.topbar-role {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.topbar-user {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-right { display: flex; gap: 8px; align-items: center; }
.btn-icon {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text2);
  font-size: 14px;
  padding: 8px 10px;
  cursor: pointer;
  font-family: var(--mono);
  transition: all 0.15s;
}
.btn-icon:active { background: var(--surface3); }
.btn-scanner-link { padding: 8px 14px; font-size: 11px; text-decoration: none; }

@media (max-width: 640px) {
  .site-header { padding: 0 12px; gap: 8px; height: 56px; }
  .logo-svg-wrap svg { height: 30px; }
  .logo-divider { display: none; }
  .logo-tagline { display: none; }
  .topbar-info { display: none; }
  .topbar-right { gap: 6px; }
  .btn-scanner-link { padding: 6px 10px; font-size: 10px; }
  .theme-toggle, .topbar-avatar { width: 28px; height: 28px; }
}

/* ── SESSION BANNER ── */
.session-banner {
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.session-banner.active-session { background: rgba(74,222,128,0.06); }
.session-banner.no-session { background: rgba(248,113,113,0.06); }
.session-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.session-dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse-dot 2s infinite; }
.session-dot.red { background: var(--red); }
@keyframes pulse-dot {
  0%,100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.session-name {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 4px 14px;
  cursor: pointer;
  transition: all 0.15s;
  border-top: 2px solid transparent;
  gap: 4px;
}
.nav-item.active { border-top-color: var(--accent); }
.nav-icon { font-size: 20px; line-height: 1; }
.nav-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text3);
  text-transform: uppercase;
}
.nav-item.active .nav-label { color: var(--accent); }

/* ── SCROLL CONTENT ── */
.scroll-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px;
}

/* Admin dashboard tab area — header/tabs above this stay static.
   Each tab panel manages its own internal scrolling instead of the
   whole page scrolling, so only the entries list moves. */
.admin-tab-content {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  padding: clamp(8px, 2vh, 14px) 14px;
  display: flex;
  flex-direction: column;
}
.tab-scroll-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
}
.card-title {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 12px 18px;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:active { background: #ffd060; }
.btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
.btn-success { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
.btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-full { width: 100%; }

/* ── FORM ELEMENTS ── */
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: var(--text2);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.form-group input, .form-group select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  padding: 12px 14px;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-group select option { background: var(--surface2); }

/* ── SCAN SCREEN ── */
#screen-user { background: var(--bg); }

.scan-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.scan-viewfinder {
  width: 100%;
  max-width: 320px;
  aspect-ratio: 1;
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: #000;
}

#scan-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.scan-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.scan-frame {
  width: 60%;
  height: 60%;
  position: relative;
}
.scan-frame::before, .scan-frame::after,
.scan-frame > span::before, .scan-frame > span::after {
  content: '';
  position: absolute;
  width: 24px; height: 24px;
  border-color: var(--accent);
  border-style: solid;
}
.scan-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
.scan-frame::after { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
.scan-frame > span::before { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
.scan-frame > span::after { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

.scan-line {
  position: absolute;
  left: 5%; right: 5%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  border-radius: 1px;
  animation: scan-sweep 2s ease-in-out infinite;
}
@keyframes scan-sweep {
  0% { top: 5%; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 95%; opacity: 0; }
}

.scan-status {
  margin-top: 16px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text2);
  text-align: center;
  letter-spacing: 0.5px;
}

/* Treat as Loose toggle */
.loose-toggle-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-top: 16px;
  width: 100%;
  max-width: 320px;
  cursor: pointer;
}
.toggle-label {
  flex: 1;
}
.toggle-label-main {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
}
.toggle-label-sub {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text3);
  margin-top: 2px;
}
.toggle-switch {
  width: 44px; height: 24px;
  background: var(--surface3);
  border-radius: 12px;
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle-switch.on { background: var(--accent); }
.toggle-knob {
  position: absolute;
  top: 3px; left: 3px;
  width: 18px; height: 18px;
  background: #fff;
  border-radius: 50%;
  transition: left 0.2s;
}
.toggle-switch.on .toggle-knob { left: 23px; }

/* Scan start button */
.btn-scan-start {
  margin-top: 20px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 50px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 16px 36px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.15s;
  box-shadow: 0 4px 20px rgba(240,180,41,0.3);
}
.btn-scan-start:active { transform: scale(0.97); }
.btn-scan-start.scanning {
  background: var(--surface2);
  color: var(--text2);
  box-shadow: none;
  border: 1px solid var(--border);
}

/* Canvas for QR processing - hidden */
#scan-canvas { display: none; }

/* ── QTY INPUT MODAL ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }

.modal-sheet {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  border: 1px solid var(--border);
  border-bottom: none;
  padding: 24px 24px 40px;
  width: 100%;
  max-width: 480px;
  animation: slide-up 0.25s ease-out;
}
@keyframes slide-up {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 20px;
}

.modal-sku-badge {
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 20px;
  font-family: var(--mono);
}
.modal-sku-label { font-size: 9px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
.modal-sku-value { font-size: 18px; font-weight: 700; color: var(--text); margin-top: 4px; }

.modal-title {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
}

.qty-input-big {
  width: 100%;
  background: var(--surface2);
  border: 2px solid var(--accent);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--mono);
  font-size: 32px;
  font-weight: 700;
  text-align: center;
  padding: 16px;
  outline: none;
  margin-bottom: 16px;
}

.modal-btns { display: flex; gap: 10px; }
.modal-btns .btn { flex: 1; padding: 14px; }

/* ── SUCCESS CARD ── */
.success-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(8px);
}
.success-overlay.show { display: flex; }

.success-card {
  background: var(--surface);
  border-radius: 20px;
  padding: 32px 28px;
  text-align: center;
  width: 100%;
  max-width: 320px;
  border: 1px solid var(--border);
  animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes pop-in {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.success-icon {
  font-size: 56px;
  margin-bottom: 16px;
  display: block;
  animation: bounce-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
}
@keyframes bounce-in {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

.success-type {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.success-type.sealed { color: var(--green); }
.success-type.loose { color: var(--accent); }

.success-sku {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.success-qty {
  font-family: var(--mono);
  font-size: 40px;
  font-weight: 700;
  margin-bottom: 4px;
}
.success-qty.sealed { color: var(--green); }
.success-qty.loose { color: var(--accent); }

.success-unit {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text2);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.success-bar {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 24px;
  overflow: hidden;
}
.success-bar-fill {
  height: 100%;
  border-radius: 2px;
  animation: drain 3s linear forwards;
}
.success-bar-fill.sealed { background: var(--green); }
.success-bar-fill.loose { background: var(--accent); }
@keyframes drain {
  from { width: 100%; }
  to { width: 0%; }
}

/* ── HISTORY SCREEN (User) ── */
.history-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.history-type-badge {
  width: 52px;
  padding: 4px 0;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1px;
  text-align: center;
  flex-shrink: 0;
  text-transform: uppercase;
}
.history-type-badge.sealed { background: var(--green-dim); color: var(--green); }
.history-type-badge.loose { background: var(--accent-dim); color: var(--accent); }
.history-info { flex: 1; min-width: 0; }
.history-sku {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-time {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  margin-top: 3px;
}
.history-qty {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  flex-shrink: 0;
}
.history-qty-unit {
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 1px;
}

/* ── ADMIN SCREEN ── */
#screen-admin { background: var(--bg); }

.admin-tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.admin-tabs::-webkit-scrollbar { display: none; }
.admin-tab {
  padding: 12px 18px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all 0.15s;
}
.admin-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.admin-panel { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.admin-panel.active { display: flex; }

/* Session tab is meant to fit without scrolling on normal screen heights.
   On unusually short viewports (small laptops, heavy zoom, split-screen)
   fall back to a scrollbar here instead of silently clipping content. */
@media (max-height: 700px) {
  #admin-panel-session { overflow-y: auto; -webkit-overflow-scrolling: touch; }
}

/* Session controls */
.session-control-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: clamp(9px, 2.3vh, 17px) 22px;
  margin-bottom: 8px;
}

.active-session-display {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: clamp(6px, 1.5vh, 12px);
}
.session-icon { font-size: 36px; }
.session-display-name {
  font-family: var(--mono);
  font-size: 19px;
  font-weight: 700;
  color: var(--text);
}
.session-display-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  margin-top: 3px;
}

/* Tally table */
.tally-table-header {
  display: grid;
  grid-template-columns: 3fr 2fr 2fr 2fr;
  gap: 14px;
  padding: 0 16px 8px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.tally-table-row {
  display: grid;
  grid-template-columns: 3fr 2fr 2fr 2fr;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-bottom: 6px;
}
.tally-sr {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text3);
}
.tally-sku {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
}
.tally-boxes-cell { text-align: right; }
.tally-boxes-total {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
}
.tally-boxes-pills { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.box-pill {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 8px;
  white-space: nowrap;
}
.box-pill.sealed { background: var(--green-dim); color: var(--green); }
.box-pill.loose { background: var(--accent-dim); color: var(--accent); }
.tally-qty-cell {
  text-align: right;
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}
.tally-qty-cell .unit { font-size: 9px; color: var(--text2); font-weight: 400; margin-left: 2px; }
.tally-qtybox-cell {
  text-align: right;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  white-space: nowrap;
}

/* Users list */
.user-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-avatar {
  width: 36px; height: 36px;
  background: var(--surface3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}
.user-role {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 3px;
}
.role-badge {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.role-badge.admin { background: var(--accent-dim); color: var(--accent); }
.role-badge.user { background: var(--blue-dim); color: var(--blue); }

/* Past sessions */
.past-session-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: clamp(6px, 1.5vh, 10px) 14px;
  margin-bottom: clamp(4px, 1vh, 6px);
  cursor: pointer;
  transition: border-color 0.15s;
}
.past-session-row:active { border-color: var(--accent); }
.past-session-name {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.past-session-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
}

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  text-align: center;
}
.stat-num {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
}
.stat-lbl {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
}
.stats-row-lg .stat-card { padding: clamp(6px, 1.5vh, 12px) 14px; }
.stats-row-lg .stat-num { font-size: 30px; }
.stats-row-lg .stat-lbl { font-size: 10px; margin-top: 6px; }

/* No session warning */
.no-session-warn {
  background: var(--red-dim);
  border: 1px solid var(--red);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--red);
  text-align: center;
  margin-bottom: 16px;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
}
.empty-icon { font-size: 40px; opacity: 0.3; margin-bottom: 12px; }

/* Toast */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 10px 20px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  white-space: nowrap;
  opacity: 0;
  transition: all 0.3s;
  z-index: 300;
  pointer-events: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--red); color: var(--red); }
.toast.success { border-color: var(--green); color: var(--green); }

/* Divider */
.divider {
  height: 1px;
  background: var(--border);
  margin: clamp(5px, 1.2vh, 8px) 0;
}

/* Loading spinner */
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Confirm modal */
.confirm-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 150;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(4px);
}
.confirm-modal.show { display: flex; }
.confirm-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 320px;
}
.confirm-title {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.confirm-msg {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 20px;
  line-height: 1.6;
}
.confirm-btns { display: flex; gap: 10px; }
.confirm-btns .btn { flex: 1; }

/* Session detail overlay */
.session-detail-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 120;
  display: none;
  flex-direction: column;
}
.session-detail-overlay.show { display: flex; }
.session-detail-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.back-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}
.session-detail-name {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
}

/* Scanning no-session state */
.scan-blocked {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  text-align: center;
}
.scan-blocked-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.4; }
.scan-blocked-title {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--text2);
  margin-bottom: 8px;
}
.scan-blocked-sub {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  line-height: 1.6;
}
</style>
</head>

    </div>

    <!-- ALL SCANS PANEL -->
    <div class="admin-panel" id="admin-panel-history">
      <div class="tab-scroll-list">
        <div id="admin-all-scans-list">
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            No scans in this session
          </div>
        </div>
      </div>
    </div>

  </div><!-- /scroll-content -->
</div>

<!-- ════════════════════════════════════════════
     MODALS & OVERLAYS
════════════════════════════════════════════ -->

<!-- Confirm modal -->
<div class="confirm-modal" id="confirm-modal">
  <div class="confirm-card">
    <div class="confirm-title" id="confirm-title">Are you sure?</div>
    <div class="confirm-msg" id="confirm-msg">This action cannot be undone.</div>
    <div class="confirm-btns">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok-btn" onclick="">Confirm</button>
    </div>
  </div>
</div>

<!-- Past session detail overlay -->
<div class="session-detail-overlay" id="session-detail-overlay">
  <div class="session-detail-header">
    <button class="back-btn" onclick="closeSessionDetail()">←</button>
    <div class="session-detail-name" id="session-detail-title">Session Detail</div>
    <button class="btn btn-ghost" style="font-size:11px;padding:8px 12px;" onclick="exportSessionCSV()">⬇ CSV</button>
  </div>
  <div class="scroll-content" id="session-detail-content"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════
const WORKER = 'https://tomahawk-returns.naimuddin.workers.dev';

// Default admin account — change password after first login
// Stored in D1 scanner_users table; this seeds it if missing

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
let currentUser   = null;   // { id, username, role }
let activeSession = null;   // { id, name, created_at, ... }
let allRecords    = [];     // current session records
let pastSessions  = [];
let viewedSession = null;   // for detail overlay

// ══════════════════════════════════════════════════════
// API HELPERS
// ══════════════════════════════════════════════════════
async function api(action, body = null) {
  try {
    const opts = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' } };
    const url  = body ? WORKER : `${WORKER}?action=${action}`;
    if (body) opts.body = JSON.stringify({ action, ...body });
    const session = getTmSession();
    if (session && session.token) opts.headers['X-Tomahawk-Session'] = session.token;
    const r = await fetch(url, opts);
    return await r.json();
  } catch (e) {
    console.error('API error:', e);
    return { ok: false, error: e.message };
  }
}

// ══════════════════════════════════════════════════════
// SCREEN MANAGEMENT
// ══════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// ══════════════════════════════════════════════════════
// AUTH — session comes from the Tomahawk hub, not this page.
// See the init() block near the end of this script for the
// actual gate/redirect logic.
// ══════════════════════════════════════════════════════
const TM_SESSION_KEY = 'tm_session_v1';

function getTmSession() {
  try { return JSON.parse(localStorage.getItem(TM_SESSION_KEY) || 'null'); } catch (e) { return null; }
}

function goToHub() {
  window.location.href = '../index.html';
}

const ROLE_LABELS = { admin: 'Administrator', manager: 'Manager', viewer: 'Viewer' };

// Admin and Manager have identical rights on this Dashboard — the only
// distinction enforced here is Viewer, which is view-only: session
// create/close controls are hidden and their functions refuse to run as
// a backstop even if triggered some other way.
function applyRolePermissions() {
  const roleEl = document.getElementById('topbar-role');
  if (roleEl) roleEl.textContent = ROLE_LABELS[currentUser.role] || currentUser.role;

  const isViewer = currentUser.role === 'viewer';
  document.querySelectorAll('.action-btn-restricted').forEach(btn => {
    btn.style.display = isViewer ? 'none' : '';
  });
}

function showAccessDenied() {
  document.body.innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;' +
    'font-family:\'DM Sans\',sans-serif;color:#e8e8f0;background:#0c0c14;text-align:center;padding:20px;">' +
    '<div style="font-size:15px;font-weight:700;">Scanner Dashboard is for Admin, Manager, and Viewer accounts</div>' +
    '<div style="font-size:13px;color:#888899;max-width:320px;">Team members who scan boxes should use the Scanner App on their phone instead.</div>' +
    '<a href="../index.html" style="margin-top:8px;color:#F5A800;font-size:13px;text-decoration:none;">← Back to Tomahawk Operations</a>' +
    '</div>';
}

async function doLogout() {
  const session = getTmSession();
  if (session && session.token) {
    try {
      await fetch(`${WORKER}?action=logout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Tomahawk-Session': session.token },
        body: JSON.stringify({ action: 'logout' })
      });
    } catch (e) { /* best-effort — clear locally regardless */ }
  }
  localStorage.removeItem(TM_SESSION_KEY);
  goToHub();
}


// ══════════════════════════════════════════════════════
// ROUTING — load data then show correct screen
// ══════════════════════════════════════════════════════
function initialsOf(name) {
  const clean = (name || '').trim();
  if (!clean) return '—';
  const parts = clean.split(/[\s._-]+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return clean.slice(0, 2).toUpperCase();
}
function toggleTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('tm_theme', 'dark'); }
  else { document.documentElement.setAttribute('data-theme', 'light'); localStorage.setItem('tm_theme', 'light'); }
}
async function loadAndRoute() {
  const r = await api('scannerLoadData');
  if (r.ok) {
    activeSession = r.activeSession || null;
    allRecords    = r.records || [];
    pastSessions  = r.pastSessions || [];
  }

  document.getElementById('admin-topbar-avatar').textContent = initialsOf(currentUser.username);
  renderAdminSession();
  renderTally();
  renderAllScans();
  renderPastSessions();
  showScreen('admin');
}

// ══════════════════════════════════════════════════════
function renderAdminSession() {
  const activeWrap = document.getElementById('admin-active-session-wrap');
  const noWrap     = document.getElementById('admin-no-session-wrap');

  if (activeSession) {
    noWrap.style.display = 'none';
    activeWrap.innerHTML = `
      <div class="session-control-card">
        <div class="card-title">Active Session</div>
        <div class="active-session-display">
          <div class="session-icon">📁</div>
          <div>
            <div class="session-display-name">${activeSession.name}</div>
            <div class="session-display-meta">Created by ${activeSession.created_by} · ${formatDate(activeSession.created_at)}</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="stats-row stats-row-lg" style="margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));">
          <div class="stat-card">
            <div class="stat-num">${allRecords.length}</div>
            <div class="stat-lbl">Total Scans</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${new Set(allRecords.map(r=>r.scanned_by)).size}</div>
            <div class="stat-lbl">Team Members</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${allRecords.length}</div>
            <div class="stat-lbl">Boxes Scanned</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${new Set(allRecords.map(r=>r.sku)).size}</div>
            <div class="stat-lbl">SKUs Recorded</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${allRecords.reduce((acc,r)=>acc+r.qty,0)}</div>
            <div class="stat-lbl">Qty Recorded</div>
          </div>
        </div>
        <div class="divider"></div>
        <button class="btn btn-danger btn-full action-btn-restricted" style="padding:9px 18px;" onclick="confirmCloseSession()">Close Session</button>
      </div>`;
  } else {
    activeWrap.innerHTML = '';
    noWrap.style.display = 'block';
  }
  applyRolePermissions();
}

async function createSession() {
  if (currentUser.role === 'viewer') { showToast('View only — you don\'t have permission for this', 'error'); return; }
  const name = document.getElementById('new-session-name').value.trim();
  if (!name) { showToast('Enter a session name', 'error'); return; }

  const r = await api('scannerCreateSession', { name, created_by: currentUser.username });
  if (!r.ok) { showToast('Failed to create session', 'error'); return; }

  activeSession = r.session;
  document.getElementById('new-session-name').value = '';
  allRecords = [];
  renderAdminSession();
  renderTally();
  showToast('Session created: ' + name, 'success');
}

function confirmCloseSession() {
  if (currentUser.role === 'viewer') { showToast('View only — you don\'t have permission for this', 'error'); return; }
  showConfirm(
    'Close Session?',
    `"${activeSession.name}" will be archived. All data is saved.`,
    closeSession
  );
}

async function closeSession() {
  const r = await api('scannerCloseSession', { session_id: activeSession.id });
  if (!r.ok) { showToast('Failed to close session', 'error'); return; }

  pastSessions.unshift({ ...activeSession, status: 'closed' });
  activeSession = null;
  allRecords = [];
  renderAdminSession();
  renderTally();
  renderPastSessions();
  showToast('Session closed and archived', 'success');
}

// ══════════════════════════════════════════════════════
// ADMIN — LIVE TALLY
// ══════════════════════════════════════════════════════
function renderTally() {
  const el = document.getElementById('tally-list');

  if (!activeSession || allRecords.length === 0) {
    document.getElementById('tally-stat-skus').textContent       = 0;
    document.getElementById('tally-stat-boxes').textContent      = 0;
    document.getElementById('tally-stat-total').textContent      = 0;
    document.getElementById('tally-stat-sealed-qty').textContent = 0;
    document.getElementById('tally-stat-loose-qty').textContent  = 0;
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div>No scans in active session</div>`;
    return;
  }

  // Aggregate per SKU — box count is a count of physical scans (each
  // sealed or loose scan = one box/container handled), qty is the sum of
  // pieces across all of them. sealedQtys tracks each sealed scan's own
  // qty so we can derive Qty/Box — the per-box quantity printed on the
  // label by Inward Label Generator.
  const bySkuMap = {};
  let sealedQtyTotal = 0, looseQtyTotal = 0;
  allRecords.forEach(r => {
    if (!bySkuMap[r.sku]) bySkuMap[r.sku] = { sku: r.sku, sealedCount: 0, looseCount: 0, totalQty: 0, sealedQtys: [] };
    if (r.type === 'sealed') { bySkuMap[r.sku].sealedCount++; bySkuMap[r.sku].sealedQtys.push(r.qty); sealedQtyTotal += r.qty; }
    else { bySkuMap[r.sku].looseCount++; looseQtyTotal += r.qty; }
    bySkuMap[r.sku].totalQty += r.qty;
  });

  const skus = Object.values(bySkuMap).sort((a,b) => a.sku.localeCompare(b.sku));
  const totalPcs   = skus.reduce((acc, s) => acc + s.totalQty, 0);
  const totalBoxes = allRecords.length;

  document.getElementById('tally-stat-skus').textContent       = skus.length;
  document.getElementById('tally-stat-boxes').textContent      = totalBoxes;
  document.getElementById('tally-stat-total').textContent      = totalPcs;
  document.getElementById('tally-stat-sealed-qty').textContent = sealedQtyTotal;
  document.getElementById('tally-stat-loose-qty').textContent  = looseQtyTotal;

  const header = `
    <div class="tally-table-header">
      <div>SKU</div>
      <div style="text-align:right;">Boxes</div>
      <div style="text-align:right;">Qty</div>
      <div style="text-align:right;">Qty/Box</div>
    </div>`;

  const rows = skus.map(s => {
    const totalBoxes = s.sealedCount + s.looseCount;
    // Qty/Box comes from the sealed boxes' printed quantity. If every
    // sealed scan for this SKU agrees, show that value; if they differ
    // (mixed batch), show the average with a ~ so it's clear it's not exact.
    let qtyPerBox = '—';
    if (s.sealedQtys.length) {
      const allSame = s.sealedQtys.every(q => q === s.sealedQtys[0]);
      qtyPerBox = allSame ? s.sealedQtys[0] : `~${Math.round(s.sealedQtys.reduce((a,b)=>a+b,0)/s.sealedQtys.length)}`;
    }
    return `
      <div class="tally-table-row">
        <div class="tally-sku">${s.sku}</div>
        <div class="tally-boxes-cell">
          <div class="tally-boxes-total">${totalBoxes}</div>
          <div class="tally-boxes-pills">
            ${s.sealedCount > 0 ? `<span class="box-pill sealed">Sealed ${s.sealedCount}</span>` : ''}
            ${s.looseCount > 0 ? `<span class="box-pill loose">Loose ${s.looseCount}</span>` : ''}
          </div>
        </div>
        <div class="tally-qty-cell">${s.totalQty}<span class="unit">pcs</span></div>
        <div class="tally-qtybox-cell">${qtyPerBox}</div>
      </div>`;
  }).join('');

  el.innerHTML = header + rows;
}

// ══════════════════════════════════════════════════════
// ADMIN — ALL SCANS
// ══════════════════════════════════════════════════════
function renderAllScans() {
  const el = document.getElementById('admin-all-scans-list');
  if (allRecords.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div>No scans in current session</div>`;
    return;
  }
  const sorted = [...allRecords].reverse();
  el.innerHTML = sorted.map(r => `
    <div class="history-item">
      <div class="history-type-badge ${r.type}">${r.type}</div>
      <div class="history-info">
        <div class="history-sku">${r.sku}</div>
        <div class="history-time">${r.scanned_by} · ${formatTime(r.scanned_at)}</div>
      </div>
      <div>
        <div class="history-qty">${r.qty}</div>
        <div class="history-qty-unit">pcs</div>
      </div>
    </div>`).join('');
}

// ══════════════════════════════════════════════════════
// ADMIN — PAST SESSIONS
// ══════════════════════════════════════════════════════
var _pastSessionsPage = 1;
var _pastSessionsPageSize = 5;

function renderPastSessions() {
  const el = document.getElementById('past-sessions-list');
  if (pastSessions.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📁</div>No past sessions yet</div>`;
    document.getElementById('pastSessionsPagerControls').style.display = 'none';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(pastSessions.length / _pastSessionsPageSize));
  if (_pastSessionsPage > totalPages) _pastSessionsPage = totalPages;
  if (_pastSessionsPage < 1) _pastSessionsPage = 1;
  const startIdx = (_pastSessionsPage - 1) * _pastSessionsPageSize;
  const pageRows = pastSessions.slice(startIdx, startIdx + _pastSessionsPageSize);

  el.innerHTML = pageRows.map(s => `
    <div class="past-session-row" onclick="openSessionDetail(${s.id})">
      <div class="past-session-name">📁 ${s.name}</div>
      <div class="past-session-meta">Closed · ${formatDate(s.created_at)} · tap to view →</div>
    </div>`).join('');

  renderPastSessionsPagination(pastSessions.length, totalPages);
}

// Updates the Prev/Next + page indicator controls. Deliberately does NOT
// rebuild any HTML — the buttons and span already exist in the page; we
// just toggle visibility, update the label text, and set disabled state.
function renderPastSessionsPagination(totalRows, totalPages) {
  const wrap = document.getElementById('pastSessionsPagerControls');
  if (totalRows <= _pastSessionsPageSize) { wrap.style.display = 'none'; return; } // single page — nothing to paginate
  wrap.style.display = 'flex';

  const startRow = (_pastSessionsPage - 1) * _pastSessionsPageSize + 1;
  const endRow = Math.min(_pastSessionsPage * _pastSessionsPageSize, totalRows);
  document.getElementById('pastSessionsPageIndicator').textContent =
    startRow + '–' + endRow + ' of ' + totalRows + ' · Page ' + _pastSessionsPage + ' of ' + totalPages;

  document.getElementById('pastSessionsPrevBtn').disabled = (_pastSessionsPage <= 1);
  document.getElementById('pastSessionsNextBtn').disabled = (_pastSessionsPage >= totalPages);
}

function pastSessionsGoToPage(p) {
  _pastSessionsPage = p;
  renderPastSessions();
}

async function openSessionDetail(sessionId) {
  const s = pastSessions.find(p => p.id === sessionId);
  if (!s) return;
  viewedSession = s;
  document.getElementById('session-detail-title').textContent = s.name;
  document.getElementById('session-detail-content').innerHTML = `<div class="spinner"></div>`;
  document.getElementById('session-detail-overlay').classList.add('show');

  const r = await api('scannerSessionRecords', { session_id: sessionId });
  if (!r.ok) { document.getElementById('session-detail-content').innerHTML = `<div class="empty-state">Failed to load</div>`; return; }

  const records = r.records || [];
  renderSessionDetail(records);
}

function renderSessionDetail(records) {
  const el = document.getElementById('session-detail-content');
  if (records.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div>No scans in this session</div>`;
    return;
  }

  // Aggregate per SKU — mirrors the Live Tally breakdown, plus who
  // scanned it and when, for the CSV export below.
  const bySkuMap = {};
  records.forEach(r => {
    if (!bySkuMap[r.sku]) {
      bySkuMap[r.sku] = {
        sku: r.sku, sealedCount: 0, looseCount: 0, sealedQty: 0, looseQty: 0,
        sealedQtys: [], scannedBy: new Set(), lastScannedAt: null
      };
    }
    const entry = bySkuMap[r.sku];
    if (r.type === 'sealed') { entry.sealedCount++; entry.sealedQtys.push(r.qty); entry.sealedQty += r.qty; }
    else { entry.looseCount++; entry.looseQty += r.qty; }
    entry.scannedBy.add(r.scanned_by);
    if (!entry.lastScannedAt || new Date(r.scanned_at) > new Date(entry.lastScannedAt)) entry.lastScannedAt = r.scanned_at;
  });

  const skus = Object.values(bySkuMap).sort((a,b) => a.sku.localeCompare(b.sku));
  const totalPcs     = records.reduce((acc, r) => acc + r.qty, 0);
  const teamMembers  = new Set(records.map(r => r.scanned_by)).size;
  const totalBoxes   = records.length;

  const header = `
    <div class="tally-table-header" style="grid-template-columns:40px 3fr 2fr 2fr 2fr;">
      <div>Sr.</div>
      <div>SKU</div>
      <div style="text-align:right;">Boxes</div>
      <div style="text-align:right;">Qty</div>
      <div style="text-align:right;">Qty/Box</div>
    </div>`;

  const rows = skus.map((s, idx) => {
    const skuBoxes = s.sealedCount + s.looseCount;
    const skuQty   = s.sealedQty + s.looseQty;
    let qtyPerBox = '—';
    if (s.sealedQtys.length) {
      const allSame = s.sealedQtys.every(q => q === s.sealedQtys[0]);
      qtyPerBox = allSame ? s.sealedQtys[0] : `~${Math.round(s.sealedQtys.reduce((a,b)=>a+b,0)/s.sealedQtys.length)}`;
    }
    return `
      <div class="tally-table-row" style="grid-template-columns:40px 3fr 2fr 2fr 2fr;">
        <div class="tally-sr">${idx + 1}</div>
        <div class="tally-sku">${s.sku}</div>
        <div class="tally-boxes-cell">
          <div class="tally-boxes-total">${skuBoxes}</div>
          <div class="tally-boxes-pills">
            ${s.sealedCount > 0 ? `<span class="box-pill sealed">Sealed ${s.sealedCount}</span>` : ''}
            ${s.looseCount > 0 ? `<span class="box-pill loose">Loose ${s.looseCount}</span>` : ''}
          </div>
        </div>
        <div class="tally-qty-cell">${skuQty}<span class="unit">pcs</span></div>
        <div class="tally-qtybox-cell">${qtyPerBox}</div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="stats-row stats-row-lg" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr));">
      <div class="stat-card"><div class="stat-num">${totalBoxes}</div><div class="stat-lbl">Total Scans</div></div>
      <div class="stat-card"><div class="stat-num">${teamMembers}</div><div class="stat-lbl">Team Members</div></div>
      <div class="stat-card"><div class="stat-num">${totalBoxes}</div><div class="stat-lbl">Boxes Scanned</div></div>
      <div class="stat-card"><div class="stat-num">${skus.length}</div><div class="stat-lbl">SKUs Recorded</div></div>
      <div class="stat-card"><div class="stat-num">${totalPcs}</div><div class="stat-lbl">Qty Recorded</div></div>
    </div>
    ${header}
    ${rows}`;

  // Store for CSV export
  viewedSession._records  = records;
  viewedSession._bySkuMap = bySkuMap;
}

function closeSessionDetail() {
  document.getElementById('session-detail-overlay').classList.remove('show');
  viewedSession = null;
}

function exportSessionCSV() {
  if (!viewedSession || !viewedSession._bySkuMap) return;
  const rows = [['SKU', 'Sealed Box Qty', 'Loose Box Qty', 'Total Box Qty', 'Scanned By', 'Time Stamp']];
  Object.values(viewedSession._bySkuMap)
    .sort((a, b) => a.sku.localeCompare(b.sku))
    .forEach(s => {
      const scannedBy = Array.from(s.scannedBy).join('; ');
      const timeStamp = s.lastScannedAt ? `${formatDate(s.lastScannedAt)} ${formatTime(s.lastScannedAt)}` : '—';
      rows.push([s.sku, s.sealedQty, s.looseQty, s.sealedQty + s.looseQty, scannedBy, timeStamp]);
    });
  downloadCSV(rows, viewedSession.name.replace(/\s+/g, '_') + '.csv');
  showToast('CSV exported');
}

// ══════════════════════════════════════════════════════
// ADMIN TAB SWITCH
// ══════════════════════════════════════════════════════
function switchAdminTab(tab) {
  document.querySelectorAll('.admin-tab').forEach((t,i) => {
    const tabs = ['tally','session','history'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('admin-panel-' + tab).classList.add('active');

  // Refresh on switch
  if (tab === 'tally') renderTally();
  if (tab === 'history') renderAllScans();
  if (tab === 'session') renderPastSessions();
}

// ══════════════════════════════════════════════════════
// CONFIRM MODAL
// ══════════════════════════════════════════════════════
let confirmCallback = null;
function showConfirm(title, msg, cb) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent   = msg;
  confirmCallback = cb;
  document.getElementById('confirm-modal').classList.add('show');
}
function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('show');
  confirmCallback = null;
}
document.getElementById('confirm-ok-btn').addEventListener('click', () => {
  if (confirmCallback) confirmCallback();
  closeConfirm();
});

// ══════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.className = 'toast', 3000);
}

function formatTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function downloadCSV(rows, filename) {
  const csv = rows.map(r => r.map(v => `"${String(v === null || v === undefined ? '' : v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = filename;
  a.click();
}

// ══════════════════════════════════════════════════════
// INIT — gate on the shared Tomahawk hub session
// ══════════════════════════════════════════════════════
const DASHBOARD_ROLES = ['admin', 'manager', 'viewer'];

(async function init() {
  const session = getTmSession();

  if (!session || !session.token) { goToHub(); return; }
  if (!DASHBOARD_ROLES.includes(session.role)) { showAccessDenied(); return; }

  // Optimistic render — the cached session already says a valid role, so
  // show the dashboard immediately rather than waiting on a network round-trip.
  currentUser = { username: session.username, role: session.role };
  showScreen('admin');
  await loadAndRoute();
  applyRolePermissions();

  // Confirm with the server in the background — catches an expired/revoked
  // session, or a role that was downgraded since this was cached.
  try {
    const res = await fetch(`${WORKER}?action=validateSession`, {
      headers: { 'X-Tomahawk-Session': session.token }
    }).then(r => r.json());
    if (!res.ok || !res.user) { goToHub(); return; }
    if (!DASHBOARD_ROLES.includes(res.user.role)) { showAccessDenied(); return; }
    currentUser = { username: res.user.username, role: res.user.role };
    applyRolePermissions();
  } catch (e) { /* network hiccup — keep the optimistic render, don't kick the user out */ }
})();
</script>
