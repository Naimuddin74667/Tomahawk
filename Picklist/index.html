<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picklist — TomahawkTools</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Times New Roman', Times, serif; background: #f0ede8; color: #111; font-size: 13px; }

/* UPLOAD */
#upload-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; }
#upload-screen h1 { font-size: 20px; font-weight: 700; }
#upload-screen p { color: #666; font-size: 13px; }
.drop-zone { width: 380px; border: 2px dashed #bbb; border-radius: 10px; padding: 40px 24px; text-align: center; cursor: pointer; background: #fff; transition: border-color 0.2s; }
.drop-zone:hover, .drop-zone.drag-over { border-color: #c8410a; background: #fdf5f2; }
.drop-zone .icon { font-size: 36px; margin-bottom: 10px; }
.drop-zone .label { font-size: 14px; color: #444; margin-bottom: 14px; }
#file-input { display: none; }
.btn { padding: 8px 20px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; }
.btn-dark { background: #111; color: #fff; }
.btn-dark:hover { background: #333; }
.btn-outline { background: #fff; border: 1.5px solid #ccc; color: #111; }

/* PICKLIST */
#picklist-screen { display: none; }
.topbar { background: #111; color: #fff; padding: 7px 16px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 99; }
.topbar-title { font-size: 14px; font-weight: 700; flex: 1; }
.topbar-meta { font-size: 11px; color: #aaa; }
.actionbar { padding: 6px 16px; display: flex; gap: 10px; align-items: center; background: #fff; border-bottom: 1px solid #ddd; }

/* SECTION DIVIDER */
.section-divider {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px 6px;
}
.section-divider-line { flex: 1; height: 1px; background: #bbb; }
.section-divider-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: #fff;
  background: #444; padding: 3px 12px; border-radius: 20px;
  white-space: nowrap;
}
.section-divider.combo-3 .section-divider-label { background: #c8410a; }
.section-divider.combo-2 .section-divider-label { background: #7a5500; }
.section-divider.single .section-divider-label { background: #1a4a1a; }

/* TABLE */
.tbl-wrap { padding: 0 16px 16px; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; margin-bottom: 0; }
th { background: #111; color: #fff; text-align: left; padding: 7px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
td { padding: 6px 10px; border-bottom: 1px solid #eee; vertical-align: middle; font-size: 13px; }
tr:last-child td { border-bottom: none; }
tr:nth-child(even) td { background: #fafafa; }
tr.combo-row td { background: #fffbeb !important; }

.sku { font-family: 'Times New Roman', Times, serif; font-size: 13px; font-weight: 700; color: #111; }
.sku-sell { font-family: 'Times New Roman', Times, serif; font-size: 12px; color: #444; }
.qty { font-size: 16px; font-weight: 700; text-align: center; }
.check-col { width: 32px; text-align: center; }
input[type=checkbox] { width: 15px; height: 15px; accent-color: #c8410a; cursor: pointer; }
.img-cell { width: 60px; text-align: center; padding: 3px 5px !important; }
.img-cell img { width: 46px; height: 46px; object-fit: contain; border-radius: 3px; border: 1px solid #e0e0e0; background: #fafafa; display: block; margin: 0 auto; }

/* COMBO BOX */
.combo-box { background: #fffbeb; border: 1px solid #f0c040; border-radius: 4px; padding: 4px 8px; display: inline-flex; flex-direction: column; gap: 2px; }
.combo-line { display: flex; align-items: baseline; gap: 5px; font-size: 12px; }
.combo-line .cx { font-weight: 700; color: #c8410a; font-size: 12px; min-width: 20px; }
.combo-line .cname { font-weight: 600; color: #111; }

@media print {
  .actionbar, .topbar .btn-outline { display: none !important; }
  body { background: #fff; font-size: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .topbar { position: static; background: #fff !important; color: #000 !important; border-bottom: 2px solid #000; }
  .topbar-title { color: #000 !important; font-size: 15px; }
  .topbar-meta { color: #333 !important; }
  .tbl-wrap { padding: 4px 8px; }
  table { border: 1px solid #999; }
  th { background: #111 !important; color: #fff !important; font-size: 11px !important; padding: 6px 8px !important; }
  td { font-size: 12px !important; padding: 5px 8px !important; border-bottom: 1px solid #ccc !important; color: #000 !important; }
  .sku { font-size: 12px !important; color: #000 !important; }
  .sku-sell { font-size: 11px !important; color: #333 !important; }
  .qty { font-size: 14px !important; color: #000 !important; }
  .img-cell img { width: 40px !important; height: 40px !important; }
  tr.combo-row td { background: #fffbeb !important; }
  tr:nth-child(even) td { background: #f5f5f5 !important; }
  .section-divider { padding: 6px 8px 3px; }
  .section-divider-label { font-size: 10px !important; }
  #upload-screen { display: none !important; }
  #picklist-screen { display: block !important; }
}
</style>
</head>
<body>

<div id="upload-screen">
  <div style="font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#c8410a;">TomahawkTools &bull; E3 Warehouse</div>
  <h1>Picklist Generator</h1>
  <p>Upload the Uniware shipments CSV export</p>
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="icon">&#128230;</div>
    <div class="label"><strong>Drop CSV here</strong> or click to browse</div>
    <input type="file" id="file-input" accept=".csv">
    <button class="btn btn-dark" onclick="event.stopPropagation();document.getElementById('file-input').click()">Choose File</button>
  </div>
  <p style="font-size:11px;color:#999;max-width:340px;text-align:center;line-height:1.6;">Shipments &rarr; New tab &rarr; Export CSV.<br>Combos auto-detected and sectioned.</p>
</div>

<div id="picklist-screen">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">&#128203; TomahawkTools Picklist</div>
    <span class="topbar-meta" id="gen-time"></span>
    <button class="btn btn-outline" onclick="resetApp()">&#8617; New CSV</button>
  </div>
  <div class="actionbar no-print">
    <button class="btn btn-dark" onclick="window.print()">&#128424; Print / Save PDF</button>
    <span id="combo-flag" style="display:none;background:#fffbeb;border:1px solid #f0c040;color:#7a5500;border-radius:5px;padding:4px 10px;font-size:12px;font-weight:600;"></span>
  </div>
  <div id="picklist-content"></div>
</div>

// Check if two SKUs are totally different
function skusDiffer(ucSku, chSku) {
  if (!ucSku || !chSku) return false;
  const clean = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  const tokenize = s => s.toLowerCase().replace(/[_\s]/g, '-').split('-').filter(Boolean);
  const a = clean(ucSku);
  const b = clean(chSku);
  const aToks = tokenize(ucSku);
  const bToks = tokenize(chSku);
  // Either contains the other (after cleaning)
  if (a.includes(b) || b.includes(a)) return false;
  // First token matches
  if (aToks[0] === bToks[0]) return false;
  // First token of one starts with digits stripped from first token of other
  // e.g. T80 vs T-80A -> both start with 't'
  if (aToks[0][0] === bToks[0][0] && (aToks[0].replace(/\d/g,'') === bToks[0].replace(/\d/g,''))) return false;
  return true;
}

function parseCSVLine(line) {
  const res = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === ',' && !q) { res.push(cur); cur = ''; }
    else cur += c;
  }
  res.push(cur); return res;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const rawH = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    rawH.forEach((h, idx) => {
      const k = h.trim();
      if (k === 'Shipment' && idx === 24) obj['SPCode'] = (vals[idx]||'').trim();
      else if (obj[k] === undefined) obj[k] = (vals[idx]||'').trim();
    });
    rows.push(obj);
  }
  return rows;
}

function processRows(rows) {
  // sections keyed by unique SKU count
  const sections = {};

  rows.forEach(r => {
    const skuRaw  = (r['Item Type SKUs']||'');
    const selRaw  = (r['Seller SKUs']||'');
    const imgRaw  = (r['Channel Product Images']||'');

    const skuList  = skuRaw.split(',').map(s=>s.trim()).filter(Boolean);
    const selList  = selRaw.split(',').map(s=>s.trim()).filter(Boolean);
    const uniqueSkus = [...new Map(skuList.map(s=>[s,s])).values()];
    const comboSize = uniqueSkus.length;

    const imgRawUrl = imgRaw.includes('~') ? imgRaw.split('~')[1].trim() : '';
    const imgUrl = (imgRawUrl && imgRawUrl !== 'NULL') ? imgRawUrl : (IMAGE_MAP[uniqueSkus[0]]||'');

    const key = uniqueSkus.slice().sort().join('|');

    if (!sections[comboSize]) sections[comboSize] = {};
    if (!sections[comboSize][key]) {
      const selMap = {};
      uniqueSkus.forEach((s,i) => { selMap[s] = selList[i]||selList[0]||''; });
      sections[comboSize][key] = {
        uniqueSkus, selMap, imgUrl, comboSize,
        qtyPerSku: Object.fromEntries(uniqueSkus.map(s=>[s,0])),
        skuCounts: Object.fromEntries(uniqueSkus.map(s=>[s,1])),
        qty: 0,
        orderCount: 0
      };
    }

    // qty = number of sets = how many times the first unique SKU appears
    // sets = appearances of the most-common SKU (defines how many combo sets in this shipment)
    const skuCounts = {};
    uniqueSkus.forEach(s => { skuCounts[s] = skuList.filter(x => x === s).length; });
    const sets = Math.min(...uniqueSkus.map(s => skuCounts[s]));
    // normalise: how many of each SKU per 1 set
    const normCounts = {};
    uniqueSkus.forEach(s => { normCounts[s] = skuCounts[s] / sets; });
    sections[comboSize][key].skuCounts = normCounts;
    sections[comboSize][key].qty = (sections[comboSize][key].qty||0) + sets;
    sections[comboSize][key].orderCount += 1;
    if (!sections[comboSize][key].imgUrl && imgUrl) sections[comboSize][key].imgUrl = imgUrl;
  });

  return sections;
}

function renderSection(groups, comboSize, rowNumStart) {
  let html = '';
  let rowNum = rowNumStart;
  const isCombo = comboSize > 1;
  const divClass = comboSize >= 3 ? 'combo-3' : comboSize === 2 ? 'combo-2' : 'single';
  const label = comboSize >= 3 ? comboSize+'-Item Combo Orders' : comboSize === 2 ? '2-Item Combo Orders' : 'Single Orders';

  html += `<div class="section-divider ${divClass}">
    <div class="section-divider-line"></div>
    <div class="section-divider-label">${label}</div>
    <div class="section-divider-line"></div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th class="check-col">&#10003;</th>
        <th style="width:28px">#</th>
        <th style="width:160px">UC SKU</th>
        <th style="width:150px">Channel SKU</th>
        ${isCombo ? '<th>Combo</th>' : ''}
        <th style="width:60px;text-align:center">Image</th>
        <th style="width:42px;text-align:center">Qty</th>
      </tr></thead>
      <tbody>`;

  // Sort groups by order count desc
  const sorted = Object.values(groups).sort((a,b) => b.orderCount - a.orderCount);

  sorted.forEach(group => {
    const isMultiRow = group.uniqueSkus.length > 1;
    const imgUrl = group.imgUrl || IMAGE_MAP[group.uniqueSkus[0]] || '';

    // combo chip html
    let comboHtml = '';
    if (isCombo) {
      comboHtml = '<div class="combo-box">' +
        group.uniqueSkus.map(s =>
          `<div class="combo-line"><span class="cx">${group.skuCounts[s]||1}&times;</span><span class="cname">${s}</span></div>`
        ).join('') + '</div>';
    }

    // For combos: one row per unique SKU but merged image/combo/qty
    if (isMultiRow) {
      // Check if all channel SKUs are the same
      const selVals = group.uniqueSkus.map(s => group.selMap[s]||'');
      const allSameSel = selVals.every(v => v === selVals[0]);

      group.uniqueSkus.forEach((sku, idx) => {
        const isFirst = idx === 0;
        const rowspan = group.uniqueSkus.length;
        const selDiff = skusDiffer(sku, group.selMap[sku]||'');
        const selCell = allSameSel
          ? (isFirst ? `<td rowspan="${rowspan}"><div class="sku-sell${skusDiffer(group.uniqueSkus[0], selVals[0]) ? ' diff' : ''}">${selVals[0]}</div></td>` : '')
          : `<td><div class="sku-sell${selDiff ? ' diff' : ''}">${group.selMap[sku]||''}</div></td>`;
        html += `<tr class="combo-row">
          ${isFirst ? `<td rowspan="${rowspan}" class="check-col"><input type="checkbox"></td>` : ''}
          ${isFirst ? `<td rowspan="${rowspan}" style="color:#999;font-size:11px">${rowNum}</td>` : ''}
          <td><div class="sku">${sku}</div></td>
          ${selCell}
          ${isCombo && isFirst ? `<td rowspan="${rowspan}">${comboHtml}</td>` : isCombo && !isFirst ? '' : ''}
          ${isFirst ? `<td rowspan="${rowspan}" class="img-cell">${imgUrl ? `<img src="${imgUrl}" alt="">` : ''}</td>` : ''}
          ${isFirst ? `<td rowspan="${rowspan}" class="qty">${group.qty||group.qtyPerSku[sku]}</td>` : ''}
        </tr>`;
      });
    } else {
      const sku = group.uniqueSkus[0];
      html += `<tr>
        <td class="check-col"><input type="checkbox"></td>
        <td style="color:#999;font-size:11px">${rowNum}</td>
        <td><div class="sku">${sku}</div></td>
        <td><div class="sku-sell${skusDiffer(sku, group.selMap[sku]||'') ? ' diff' : ''}">${group.selMap[sku]||''}</div></td>
        ${isCombo ? `<td>${comboHtml}</td>` : ''}
        <td class="img-cell">${imgUrl ? `<img src="${imgUrl}" alt="">` : ''}</td>
        <td class="qty">${group.qty||group.qtyPerSku[sku]}</td>
      </tr>`;
    }
    rowNum++;
  });

  html += '</tbody></table></div>';
  return { html, nextRow: rowNum };
}

function render(rows) {
  const sections = processRows(rows);
  const channel = (rows[0]['Channel']||'UNKNOWN').trim().toUpperCase();
  document.getElementById('topbar-title').textContent = `\u{1F4CB} ${channel} \u2014 ${rows.length} Orders`;
  document.getElementById('gen-time').textContent = new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });

  // combo count
  const comboOrders = rows.filter(r => {
    const skus = [...new Set((r['Item Type SKUs']||'').split(',').map(s=>s.trim()).filter(Boolean))];
    return skus.length > 1;
  }).length;
  const cf = document.getElementById('combo-flag');
  if (comboOrders) { cf.textContent = `⚠ ${comboOrders} combo orders`; cf.style.display='inline-block'; }

  let fullHtml = '';
  let rowNum = 1;

  // Render sections: 3+ first, then 2, then 1
  const sizes = Object.keys(sections).map(Number).sort((a,b) => b-a);
  sizes.forEach(size => {
    const result = renderSection(sections[size], size, rowNum);
    fullHtml += result.html;
    rowNum = result.nextRow;
  });

  document.getElementById('picklist-content').innerHTML = fullHtml;
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('picklist-screen').style.display = 'block';
}

// file handling
document.getElementById('file-input').addEventListener('change', e => { if (e.target.files[0]) load(e.target.files[0]); });
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });

function load(file) {
  const r = new FileReader();
  r.onload = e => {
    try {
      const rows = parseCSV(e.target.result);
      if (!rows.length) { alert('No data found.'); return; }
      render(rows);
    } catch(err) { alert('Error: ' + err.message); console.error(err); }
  };
  r.readAsText(file);
}

function resetApp() {
  document.getElementById('upload-screen').style.display = 'flex';
  document.getElementById('picklist-screen').style.display = 'none';
  document.getElementById('file-input').value = '';
}
