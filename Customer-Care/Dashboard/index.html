<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231a1a1a'/%3E%3Ctext x='32' y='48' font-family='Arial Black,sans-serif' font-weight='900' font-size='52' text-anchor='middle' fill='%23F5A800'%3ET%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="https://tomahawk.tools/cdn/shop/files/Frame_271.png?v=1733307291&width=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
<title>Customer Care Dashboard — Tomahawk</title>
<style>
/* ── Design tokens (matches the rest of the Tomahawk suite) ── */
:root {
  --bg:       #0c0c14;
  --surface:  #13131e;
  --surface2: #1a1a28;
  --border:   #1f1f2e;
  --accent:   #F5A800;
  --text:     #e8e8f0;
  --text2:    #888899;
  --green:    #4ade80;
  --red:      #f87171;
  --font-display: 'Syne', sans-serif;
  --font-body:    'DM Sans', sans-serif;
}
html[data-theme="light"] {
  --bg:       #f4f5f7;
  --surface:  #ffffff;
  --surface2: #f0f1f4;
  --border:   #d0d4e0;
  --accent:   #c98a00;
  --text:     #111118;
  --text2:    #555566;
  --green:    #16a34a;
  --red:      #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 13px; transition: background .2s, color .2s; }

/* ── Portal header (shared pattern) ── */
.site-header {
  position: sticky; top: 0; z-index: 100;
  height: 62px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 36px;
  justify-content: space-between; gap: 20px;
  transition: background .2s, border-color .2s;
}
.header-logo { display: flex; align-items: center; gap: 14px; text-decoration: none; flex-shrink: 0; }
.logo-svg-wrap { display: flex; align-items: center; color: var(--accent); }
.logo-divider { width: 2px; height: 36px; background: rgba(255,255,255,0.5); border-radius: 2px; }
html[data-theme="light"] .logo-divider { background: rgba(0,0,0,0.25); }
.logo-tagline { font-size: 16px; font-weight: 600; color: var(--text2); letter-spacing: .04em; font-family: var(--font-body); }
.header-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.sys-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; animation: hpulse 2.5s ease-in-out infinite; }
@keyframes hpulse { 0%,100%{opacity:1} 50%{opacity:.45} }
.header-theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text2); transition: border-color .15s, color .15s;
}
.header-theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
html:not([data-theme="light"]) .icon-sun  { display: none; }
html[data-theme="light"]       .icon-moon { display: none; }
.header-user { display: flex; align-items: center; gap: 9px; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px 6px 6px; }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #111; }
.user-name { font-size: 13px; color: var(--text2); font-family: var(--font-body); }
@media (max-width: 640px) {
  .site-header { padding: 12px 16px; height: auto; flex-wrap: wrap; gap: 10px; }
  .logo-tagline { font-size: 11px; }
  .sys-status span { display: none; }
  .user-name { display: none; }
  .header-user { padding: 5px; }
  .header-theme-toggle { width: 32px; height: 32px; }
}

/* ── Auth gate + role badge (shared pattern) ── */
.auth-gate{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-gate[hidden]{display:none}
.auth-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 28px 28px}
.auth-logo-row{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.auth-logo-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.auth-title{font-weight:700;font-size:16px;color:var(--text)}
.auth-sub{font-size:11px;color:var(--text2);margin-top:1px}
.header-logout-btn{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;flex-shrink:0}
.header-logout-btn:hover{border-color:var(--red);color:var(--red)}
.header-logout-btn[hidden]{display:none}
.header-user[hidden]{display:none}
.role-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:20px;background:var(--surface2);color:var(--accent);border:1px solid var(--border);margin-left:2px}
.access-denied-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);text-align:center;padding:20px}

/* ── Page layout ── */
.page { max-width: 1600px; margin: 0 auto; padding: 28px 32px 60px; }
.page-head { margin-bottom: 22px; }
.page-title { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--text); }
.page-sub { font-size: 12.5px; color: var(--text2); margin-top: 4px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
.panel-title {
  font-family: var(--font-display); font-size: 13px; font-weight: 800; color: var(--accent);
  letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.panel-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.form-row.single { grid-template-columns: 1fr; }
.form-row.three { grid-template-columns: 1fr 1fr 1fr; }
.field label { display: block; font-size: 10.5px; font-weight: 700; color: var(--text2); margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
.field label .opt { text-transform: none; font-weight: 500; color: var(--text2); opacity: .7; letter-spacing: 0; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); font-family: var(--font-body); font-size: 13px; padding: 9px 12px;
  outline: none; transition: border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field input[readonly] { color: var(--text2); cursor: not-allowed; background: var(--surface); }
/* Hide native up/down spinner arrows on all number fields (Chrome/Safari/Firefox) */
.field input[type="number"]::-webkit-inner-spin-button,
.field input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.field input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.field textarea { resize: vertical; min-height: 54px; }
.field-hint { font-size: 10.5px; color: var(--text2); margin-top: 5px; line-height: 1.5; }

.submit-btn {
  width: 100%; margin-top: 6px; padding: 12px; border-radius: 8px; border: none;
  background: var(--accent); color: #111; font-family: var(--font-body); font-weight: 700; font-size: 13.5px;
  cursor: pointer; transition: opacity .15s;
}
.submit-btn:hover { opacity: .9; }
.submit-btn:disabled { opacity: .5; cursor: not-allowed; }

.confirm-box {
  margin-top: 14px; padding: 16px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--accent);
  display: none;
}
.confirm-box.show { display: block; }
.confirm-box .confirm-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.confirm-box .confirm-amount { font-family: monospace; font-size: 20px; font-weight: 700; color: var(--accent); }
.confirm-box .confirm-note { font-size: 11px; color: var(--text2); margin: 6px 0 12px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions button {
  flex: 1; padding: 10px; border-radius: 7px; font-family: var(--font-body); font-weight: 700; font-size: 13px; cursor: pointer;
}
.btn-confirm-yes { background: var(--accent); color: #111; border: none; }
.btn-confirm-yes:hover { opacity: .9; }
.btn-confirm-no { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-confirm-no:hover { border-color: var(--red); color: var(--red); }

.viewer-note {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
  font-size: 12.5px; color: var(--text2); line-height: 1.6;
}

/* Result banner */
.result-box { margin-top: 16px; border-radius: 8px; padding: 14px; font-size: 12.5px; line-height: 1.6; display: none; }
.result-box.show { display: block; }
.result-box.success { background: color-mix(in srgb, var(--green) 12%, transparent); border: 1px solid color-mix(in srgb, var(--green) 40%, transparent); }
.result-box.error   { background: color-mix(in srgb, var(--red) 12%, transparent); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); }
.result-title { font-weight: 700; margin-bottom: 4px; }
.result-box.success .result-title { color: var(--green); }
.result-box.error .result-title { color: var(--red); }
.result-waybill { font-family: monospace; font-size: 13px; background: var(--surface2); padding: 2px 8px; border-radius: 5px; }

/* Log table */
.log-table-wrap { overflow-x: auto; }
table.log-table { width: 100%; border-collapse: collapse; font-size: 12px; }
table.log-table th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--text2); padding: 8px 10px; border-bottom: 1px solid var(--border);
}
table.log-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.log-table tr:last-child td { border-bottom: none; }
.badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .03em; }
.badge.created { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
.badge.failed  { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
.mono { font-family: monospace; font-size: 11.5px; }
.details-toggle { cursor: pointer; color: var(--accent); font-size: 11px; user-select: none; }
.details-json {
  display: none; margin-top: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px; font-family: monospace; font-size: 10.5px; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto;
}
.details-json.show { display: block; }
.log-empty { color: var(--text2); font-size: 12.5px; padding: 20px 0; text-align: center; }
.log-refresh { font-size: 11px; color: var(--text2); cursor: pointer; }
.log-refresh:hover { color: var(--accent); }
.field-hint.ok { color: var(--green); }
.field-hint.bad { color: var(--red); }
.panel-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.panel-head-row .panel-title { margin-bottom: 0; }

/* ── Customer Care landing: sub-card picker (same visual language as
   the Marketplace Shipments hub's platform cards) ── */
/* 3 cards per row like the main hub; 2 on tablets, 1 on phones */
.cc-landing-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .cc-landing-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .cc-landing-grid { grid-template-columns: 1fr; } }
.cc-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 28px; cursor: pointer; text-decoration: none; display: flex; flex-direction: column;
  position: relative; overflow: hidden;
  transition: border-color .15s, background .15s, transform .15s;
}
.cc-card:hover { border-color: var(--card-color); background: var(--surface2); transform: translateY(-2px); }
.cc-card-glow {
  position: absolute; top: -1px; right: -1px; width: 100px; height: 100px;
  border-radius: 0 14px 0 100px; background: var(--card-color); opacity: .06; pointer-events: none;
}
.cc-card-icon {
  width: 48px; height: 48px; border-radius: 10px;
  background: var(--card-color-dim); color: var(--card-color);
  display: flex; align-items: center; justify-content: center; margin-bottom: 18px; flex-shrink: 0;
}
.cc-card-platform {
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--card-color); font-weight: 600; margin-bottom: 6px;
}
.cc-card-name { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--text); margin-bottom: 8px; letter-spacing: -.01em; }
.cc-card-desc { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 20px; flex: 1; }
.cc-card-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 18px; }
.cc-chip {
  font-size: 9px; padding: 2px 8px; border-radius: 20px; font-weight: 500;
  color: var(--card-color); border: 1px solid var(--card-color-border); background: var(--card-color-dim);
}
.cc-chip.cc-chip-gray { color: var(--text2); border-color: var(--border); background: transparent; }
.cc-card-footer {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); padding-top: 14px;
}
.cc-card-cta { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--card-color); }
.cc-card-arrow {
  width: 26px; height: 26px; border-radius: 6px; background: var(--card-color-dim); color: var(--card-color);
  display: flex; align-items: center; justify-content: center; font-size: 14px; transition: transform .15s;
}
.cc-card:hover .cc-card-arrow { transform: translateX(3px); }
.cc-card-soon { cursor: default; opacity: .75; }
.cc-card-soon:hover { transform: none; border-color: var(--border); background: var(--surface); }
.cc-card-soon:hover .cc-card-arrow { transform: none; }

.sub-back {
  font-size: 12px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; transition: color .15s;
}
.sub-back a { color: var(--text2); text-decoration: none; }
.sub-back a:hover { color: var(--accent); }

.placeholder-panel {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  text-align: center; padding: 60px 20px; color: var(--text2); font-size: 13px;
}
.placeholder-panel .ph-title { font-family: var(--font-display); font-size: 16px; font-weight: 800; color: var(--text); }
/* ── Customer Care Dashboard ── */
.back-link { font-size: 12px; font-weight: 600; color: var(--text2); text-decoration: none; display: inline-block; margin-bottom: 10px; }
.back-link:hover { color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile-flag { font-size: 9.5px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 6px; margin-left: 4px; }
.tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  cursor: pointer; transition: border-color .12s, transform .12s; text-align: left; color: var(--text); font: inherit;
}
.tile:hover { border-color: var(--tile-c, var(--accent)); transform: translateY(-1px); }
.tile.active { border-color: var(--tile-c, var(--accent)); box-shadow: inset 0 0 0 1px var(--tile-c, var(--accent)); }
.tile-n { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--tile-c, var(--text)); line-height: 1.1; }
.tile-l { font-size: 11px; color: var(--text2); margin-top: 4px; font-weight: 600; }
.tile.attn .tile-n::after { content: ' •'; color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.panel-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-title { font-family: var(--font-display); font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tools input, .tools select {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
  padding: 7px 10px; font: inherit; font-size: 12px; outline: none;
}
.tools input { width: 260px; max-width: 100%; }
.tools input:focus, .tools select:focus { border-color: var(--accent); }
.log-refresh { font-size: 11px; color: var(--text2); cursor: pointer; white-space: nowrap; }
.log-refresh:hover { color: var(--accent); }
.table-wrap { overflow-x: auto; }
/* Fit-to-screen layout — same template as Blinkit / Flipkart / Amazon:
   the page fills the viewport (no page scroll), the cases panel takes
   the remaining height, the table stretches to fill it (10 equal rows,
   short pages padded), and the pager sits pinned at the panel bottom.
   Short or narrow screens fall back to normal page scrolling. */
@media (min-height: 640px) and (min-width: 761px) {
  body.cc-fit { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body.cc-fit .site-header { flex-shrink: 0; }
  body.cc-fit .page { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; }
  body.cc-fit .page > .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.cc-fit .page-head, body.cc-fit .tiles, body.cc-fit .panel-head-row { flex-shrink: 0; }
  body.cc-fit .table-wrap { flex: 1; min-height: 0; overflow: auto; }
  body.cc-fit .case-table { height: 100%; }
  body.cc-fit .case-table td { vertical-align: middle; padding-top: 4px; padding-bottom: 4px; }
  body.cc-fit .pager { flex-shrink: 0; }
}
/* Full width + height — no centred max-width, only a slim edge gutter
   (same as the Blinkit / Flipkart / Amazon pages). */
body.cc-fit .page { max-width: none; margin: 0; padding: 12px 16px; }
body.cc-fit .page-head { margin-bottom: 10px; }
body.cc-fit .tiles { margin-bottom: 10px; }
body.cc-fit .page > .panel { padding: 12px 14px; }
body.cc-fit .panel-head-row { margin-bottom: 8px; }
body.cc-fit .pager { padding-top: 8px; }
.case-table thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
/* Pagination footer — same pattern as the Blinkit RO Ledger */
.pager { display: none; align-items: center; justify-content: center; gap: 1rem; padding: 12px 0 0; border-top: 1px solid var(--border); margin-top: 4px; }
.pager-btn { padding: 5px 10px; font-size: 11px; font-weight: 600; border-radius: 5px; background: transparent; color: var(--text); border: 1px solid var(--border); cursor: pointer; font-family: inherit; }
.pager-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager-btn:disabled { opacity: .4; cursor: not-allowed; }
.pager-ind { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; white-space: nowrap; }
.case-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.case-table th { text-align: left; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.case-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.case-table tr.case-row { cursor: pointer; }
.case-table tr.case-row:hover td { background: var(--surface2); }
.case-table tr.attn td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.case-table tr.attn td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.mono { font-family: 'DM Mono', ui-monospace, monospace; font-size: 11.5px; }
.sub { font-size: 10.5px; color: var(--text2); margin-top: 2px; }
.muted { color: var(--text2); text-align: center; padding: 24px; }
.journey { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
.step { font-size: 9.5px; font-weight: 700; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text2); white-space: nowrap; }
.step.done { border-color: color-mix(in srgb, #22c55e 50%, transparent); color: #22c55e; background: color-mix(in srgb, #22c55e 10%, transparent); }
.step.now { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.step.bad { border-color: color-mix(in srgb, #f87171 50%, transparent); color: #f87171; }
.step-sep { color: var(--text2); font-size: 9px; opacity: .6; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; text-transform: uppercase; letter-spacing: .03em; }
.b-green { background: color-mix(in srgb, #22c55e 15%, transparent); color: #22c55e; }
.b-amber { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.b-blue { background: color-mix(in srgb, #60a5fa 15%, transparent); color: #60a5fa; }
.b-gray { background: var(--surface2); color: var(--text2); }
.b-red { background: color-mix(in srgb, #f87171 15%, transparent); color: #f87171; }
/* Status badge icon (sits right of the text): truck facing left = coming to
   us (amber), warehouse = in-house (blue), truck facing right = going out
   (green), check = closed (grey). */
.badge { display: inline-flex; align-items: center; gap: 6px; }
.b-ico { width: 22px; height: 13px; flex-shrink: 0; fill: currentColor; }
.b-ico.flip { transform: scaleX(-1); }
/* Stage text colour inside the badge (badge background + icon keep the
   phase colour): white = not moved yet, blue = moving, amber = final step
   happening now, green = done, red = problem. */
.bt-white { color: var(--text); }
.bt-blue  { color: #60a5fa; }
.bt-amber { color: #ffc940; }
.bt-green { color: #22c55e; }
.bt-red   { color: #f87171; }
html[data-theme="light"] .bt-blue  { color: #2563eb; }
html[data-theme="light"] .bt-amber { color: #b45309; }
html[data-theme="light"] .bt-green { color: #15803d; }
html[data-theme="light"] .bt-red   { color: #dc2626; }
.case-acts { display: contents; }
.case-act { font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; text-decoration: none; }
.case-act:hover, .case-act.primary { background: var(--accent); color: #111; }
.case-act:disabled { opacity: .5; cursor: progress; }
.case-act.danger { border-color: #f87171; color: #f87171; margin-left: auto; }
.case-act.danger:hover { background: #f87171; color: #111; }
/* popup */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 50px 16px; overflow-y: auto; }
.modal-backdrop[hidden] { display: none; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 900px; padding: 22px; }
/* Case popup — same layout as the Blinkit RO Detail: summary strip,
   small accent section headers (with their button on the right), and
   the action buttons in one row at the bottom. */
.cm-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 12px; }
.cm-summary .span2 { grid-column: span 2; }
.cm-k { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.cm-sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 8px; }
.cm-sec-title { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-family: 'DM Mono', monospace; }
.cm-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; font-size: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.cm-muted { font-size: 10.5px; color: var(--text2); margin-top: 1px; }
.sb-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 12px; margin-top: 2px; }
.sb-input:focus { outline: none; border-color: var(--accent); }
.sb-chips { display: flex; gap: 10px; flex-wrap: wrap; }
.sb-chip { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 200px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font: inherit; font-size: 12px; text-align: left; }
.sb-chip span { font-size: 11px; color: #22c55e; }
.sb-chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.sb-chip.off { cursor: not-allowed; opacity: .6; }
.sb-chip.off span { color: #f87171; }
.copy-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 0 0 0 6px; vertical-align: middle; line-height: 1; font-size: 12px; }
.copy-btn:hover { color: var(--accent); }
.copy-btn.copied { color: #22c55e; }
.cm-steps { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.cm-step { flex: 1; padding: 10px 12px; font-size: 11.5px; border-right: 1px solid var(--border); color: var(--text2); min-width: 0; }
.cm-step:last-child { border-right: none; }
.cm-step .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--border); margin-right: 6px; }
.cm-step.done { color: var(--text); }
.cm-step.done .dot { background: #22c55e; }
.cm-step.now { color: var(--text); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.cm-step.now .dot { background: var(--accent); }
.cm-step .when { font-size: 10.5px; color: var(--text2); margin-top: 3px; padding-left: 14px; }
.cm-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
@media (max-width: 700px) { .cm-summary, .cm-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cm-steps { flex-direction: column; } .cm-step { border-right: none; border-bottom: 1px solid var(--border); } }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.modal-title { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.modal-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }
.modal-close { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
.leg { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 12px; }
.leg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.leg-title { font-weight: 700; font-size: 13px; }
.leg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 14px; margin-top: 10px; font-size: 12px; }
.leg-grid .k { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.track-btn { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.track-btn:hover { background: var(--accent); color: #111; }
.track-box { margin-top: 10px; font-size: 12px; }
.scan-list { list-style: none; margin: 8px 0 0; padding: 0; border-left: 2px solid var(--border); }
.scan-list li { padding: 0 0 10px 12px; position: relative; }
.scan-list li::before { content: ''; position: absolute; left: -5px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.scan-list li:first-child::before { background: var(--accent); }
.scan-st { font-weight: 700; }
.scan-meta { font-size: 10.5px; color: var(--text2); }
@media (max-width: 640px) { .tools input { width: 100%; } }
</style>
</head>

<script>
// ══════════════════════════════════════════════════════════════════
// AUTH — session comes from the Tomahawk hub, same pattern as every
// other sub-app. picker_packer has no access here at all.
// ══════════════════════════════════════════════════════════════════
(function () {
  var TM_SESSION_KEY = 'tm_session_v1';
  var TM_WORKER = 'https://tomahawk-returns.naimuddin.workers.dev';

  function getSession() { try { return JSON.parse(localStorage.getItem(TM_SESSION_KEY) || 'null'); } catch (e) { return null; } }
  function clearSession() { localStorage.removeItem(TM_SESSION_KEY); }
  function goToHub() { window.location.href = '../../index.html'; }

  window.TM_ROLE = null;
  window.TM_WORKER = TM_WORKER;
  window.TM_getSession = getSession;

  function showApp(user) {
    document.getElementById('auth-gate').hidden = true;
    document.getElementById('header-user').hidden = false;
    document.getElementById('header-logout-btn').hidden = false;
    var label = user.display_name || user.username;
    document.getElementById('user-avatar').textContent = label.slice(0, 2).toUpperCase();
    document.getElementById('user-name-display').textContent = label;
    var roleLabels = { admin: 'Admin', manager: 'Manager', viewer: 'Viewer', picker_packer: 'Picker & Packer' };
    document.getElementById('user-role-badge').textContent = roleLabels[user.role] || user.role;
    window.TM_ROLE = user.role;
  }

  function showAccessDenied() {
    document.body.innerHTML =
      '<div class="access-denied-screen">' +
      '<div style="font-size:15px;font-weight:700;">You don\'t have access to this app</div>' +
      '<div style="font-size:13px;color:var(--text2);max-width:320px;">Picker &amp; Packer accounts only have access to the Scanner App.</div>' +
      '<a href="../../index.html" style="margin-top:8px;color:var(--accent);font-size:13px;text-decoration:none;">&#8592; Back to Tomahawk Operations</a>' +
      '</div>';
  }

  document.getElementById('header-logout-btn').addEventListener('click', async function () {
    var session = getSession();
    if (session && session.token) {
      try {
        await fetch(TM_WORKER + '?action=logout', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Tomahawk-Session': session.token },
          body: JSON.stringify({ action: 'logout' })
        });
      } catch (e) {}
    }
    clearSession();
    goToHub();
  });

  (async function initAuth() {
    var session = getSession();
    if (!session || !session.token) { goToHub(); return; }
    if (session.role !== 'admin' && session.role !== 'manager' && session.role !== 'viewer') {
      showAccessDenied(); return;
    }

    showApp(session);

    try {
      var res = await fetch(TM_WORKER + '?action=validateSession', { headers: { 'X-Tomahawk-Session': session.token } }).then(function (r) { return r.json(); });
      if (!res.ok || !res.user) { clearSession(); goToHub(); return; }
      if (res.user.role !== 'admin' && res.user.role !== 'manager' && res.user.role !== 'viewer') { showAccessDenied(); return; }
      localStorage.setItem(TM_SESSION_KEY, JSON.stringify({ token: session.token, username: res.user.username, role: res.user.role, display_name: res.user.display_name }));
      showApp(res.user);
    } catch (e) { /* network hiccup — keep the optimistic render */ }

  })();

  // ── Theme ──
  if (localStorage.getItem('tm_theme') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  window.toggleTheme = function () {
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
    localStorage.setItem('tm_theme', isLight ? 'dark' : 'light');
  };
})();
</script>

<script>
// ══════════════════════════════════════════════════════════════════
// CUSTOMER CARE DASHBOARD — every order from Create Parcel Pickup
// (delhiveryListOrders: Delhivery + Ekart, forward + reverse), compiled
// into CASES: a reverse pickup together with the forward order that sent
// it back (linked_order_id), or a standalone forward order (e.g. FOC).
// Stages follow the same rules as Create-Pickup's Recent lists.
// ══════════════════════════════════════════════════════════════════
(function () {
  var cases = [], tileFilter = '';
  var page = 1, PAGE_SIZE = 10;   // pagination — same 10-per-page as the Blinkit RO Ledger

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeJson(s) { try { return JSON.parse(s || '{}'); } catch (e) { return {}; } }
  function ship(o) { return (safeJson(o && o.payload_json).shipments || [])[0] || {}; }
  function fmtWhen(t) {
    if (!t) return '';
    var s = String(t); if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(s)) s = s.replace(' ', 'T') + 'Z';
    var d = new Date(s);
    return isNaN(d) ? String(t) : d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function api(q) {
    var s = window.TM_getSession(), h = {};
    if (s && s.token) h['X-Tomahawk-Session'] = s.token;
    return fetch(window.TM_WORKER + '?action=' + q, { headers: h }).then(function (r) { return r.json(); });
  }

  // Courier-side stage of one leg (same as Create-Pickup).
  function legStage(o) {
    if (!o) return '';
    if (!o.delhivery_ok) return 'Failed';
    var st = o.track_stage || 'Created';
    if (st === 'Created' && o.rtd_at && o.direction !== 'reverse') return 'RTD';
    return st;
  }
  // Badge text per courier stage, one table per leg direction.
  var PICKUP_LABEL = { 'Created': 'Booked', 'Out For Pickup': 'Out For Pickup', 'Picked': 'Picked',
    'In Transit': 'In Transit', 'At Last Mile': 'At Bhiwandi Hub', 'Out For Delivery': 'Out For Delivery',
    'Delivered': 'Delivered to us' };
  var DISPATCH_LABEL = { 'Created': 'Booked', 'RTD': 'Ready To Dispatch', 'In Transit': 'In Transit',
    'At Last Mile': 'Last Mile Hub', 'Out For Delivery': 'Out For Delivery', 'Delivered': 'Delivered' };

  // ── One status per case — drives the badge, tiles and filters.
  // Three paths:  Repair/Replace = Pickup → In-house → Dispatch
  //               Refund         = Pickup → In-house → Refunded
  //               FOC etc.       = Dispatch only
  // Returns { label, tone, attn } or null (case hidden: failed/cancelled).
  //   tone: 'in' (amber, coming to us) | 'house' (blue) | 'out' (green)
  //         'closed' (grey) | 'bad-in' / 'bad-out' (red, truck keeps its direction)
  function caseStatus(c) {
    var r = c.reverse, f = c.forward;
    if ((r || f).cancelled_at) return null;          // cancelled by an admin → hidden
    var fs = f && f.delhivery_ok ? legStage(f) : '';
    var fwdLive = fs && fs !== 'Cancelled';        // a failed/cancelled send-back is ignored → back to In Process
    if (!r) {
      if (!fwdLive) return null;
      return dispatchStatus(fs);
    }
    if (!r.delhivery_ok) return null;
    var rs = legStage(r);
    if (rs === 'Cancelled' && !r.received_at) return null;
    if (r.refunded_at) return { label: 'Refunded', tone: 'closed' };
    if (fwdLive) return dispatchStatus(fs);
    if (r.in_process_at || r.received_at) return { label: 'In Process', tone: 'house' }; // Received = In Process
    if (rs === 'RTO' || rs === 'Lost') return { label: 'Pickup ' + rs, tone: 'bad-in' };
    if (rs === 'Delivered') return { label: PICKUP_LABEL.Delivered, tone: 'in', attn: true }; // needs Verify received
    return { label: PICKUP_LABEL[rs] || rs, tone: 'in' };
  }
  function dispatchStatus(fs) {
    if (fs === 'Delivered') return { label: 'Delivered', tone: 'closed' }; // Delivered = case closed (grey)
    if (fs === 'RTO' || fs === 'Lost') return { label: fs, tone: 'bad-out' };
    return { label: DISPATCH_LABEL[fs] || fs, tone: 'out' };
  }

  // Badge = text + icon on the right.
  // Box truck facing right (cargo stripes + cab window + wheel hubs), flipped for incoming.
  var ICON_TRUCK = '<path fill-rule="evenodd" d="M1.2 0h11.6c.66 0 1.2.54 1.2 1.2V9.5H0V1.2C0 .54.54 0 1.2 0zM2 2.2v1.1h10V2.2zm0 2.4v1.1h10V4.6zm0 2.4v1.1h10V7z"/><path fill-rule="evenodd" d="M15 2.5h4.3c.35 0 .68.16.9.43l2.6 3.2c.13.17.2.37.2.58V9.5h-8zm1.3 1.2v2.6h4.9l-2-2.6z"/><path fill-rule="evenodd" d="M4.6 8.4a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6zm0 1.4a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8zM18.6 8.4a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6zm0 1.4a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8z"/>';
  var ICON_HOUSE = '<path fill-rule="evenodd" d="M3 5 11.5 0 20 5v7h-5V8H8v4H3z"/>';
  var ICON_CHECK = '<path d="M5 6.5 9 10.5 17 1.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
  var TONE = {
    'in':      { cls: 'b-amber', icon: ICON_TRUCK, flip: true },
    'bad-in':  { cls: 'b-red',   icon: ICON_TRUCK, flip: true },
    'house':   { cls: 'b-blue',  icon: ICON_HOUSE },
    'out':     { cls: 'b-green', icon: ICON_TRUCK },
    'bad-out': { cls: 'b-red',   icon: ICON_TRUCK },
    'closed':  { cls: 'b-gray',  icon: ICON_CHECK }
  };
  // Text colour per stage (see .bt-* CSS). Problem badges are always red.
  var STAGE_TEXT = {
    'Booked': 'white', 'Ready To Dispatch': 'white', 'Received': 'white',
    'Picked': 'blue', 'In Transit': 'blue', 'At Bhiwandi Hub': 'blue', 'Last Mile Hub': 'blue',
    'Out For Pickup': 'amber', 'Out For Delivery': 'amber', 'In Process': 'amber',
    'Delivered to us': 'green', 'Delivered': 'green', 'Refunded': 'green'
  };
  function badgeHtml(st) {
    var t = TONE[st.tone] || TONE.closed;
    var txt = /^bad/.test(st.tone) ? 'red' : (STAGE_TEXT[st.label] || 'white');
    return '<span class="badge ' + t.cls + '"><span class="bt-' + txt + '">' + esc(st.label) + '</span>' +
      '<svg class="b-ico' + (t.flip ? ' flip' : '') + '" viewBox="0 0 23 13" aria-hidden="true">' + t.icon + '</svg></span>';
  }

  // Four tiles (click to filter):
  //   All cases — everything
  //   Open      — not closed/refunded (red problem cases stay here)
  //   Upcoming  — amber: pickup booked until delivered to us (+ pickup problems)
  //   Going out — green: forward booked until delivered (+ delivery problems)
  var TILES = [
    { key: '', label: 'All cases', c: 'var(--text)', test: function () { return true; } },
    { key: 'open', label: 'Open cases', c: 'var(--text)', test: function (c) { return c.st.tone !== 'closed'; } },
    { key: 'upcoming', label: 'Upcoming', c: 'var(--accent)', test: function (c) { return c.st.tone === 'in' || c.st.tone === 'bad-in'; } },
    { key: 'goingout', label: 'Going out', c: '#22c55e', test: function (c) { return c.st.tone === 'out' || c.st.tone === 'bad-out'; } }
  ];
  function tileTest(key) { for (var i = 0; i < TILES.length; i++) if (TILES[i].key === key) return TILES[i].test; return TILES[0].test; }

  // Type column: Repair / Replace / Refund / Free Of Cost. From job_type,
  // falling back to the Order ID prefix for older orders saved without one
  // (RPR/FRPR = Repair, REP/RPL/FRPL = Replace, RFD = Refund, FOC).
  function caseType(c) {
    var lead = c.reverse || c.forward;
    var jt = String(lead.job_type || '').toLowerCase();
    if (/^repair/.test(jt)) return 'Repair';
    if (/^replace/.test(jt)) return 'Replace';
    if (jt === 'refund') return 'Refund';
    if (jt === 'foc') return 'Free Of Cost';
    var pre = String(lead.order_id || '').split('-')[0].toUpperCase();
    return { RPR: 'Repair', FRPR: 'Repair', REP: 'Replace', RPL: 'Replace', FRPL: 'Replace', RFD: 'Refund', FOC: 'Free Of Cost' }[pre] || '—';
  }

  function buildCases(orders) {
    var byId = {};
    orders.forEach(function (o) { if (o.order_id) byId[o.order_id] = byId[o.order_id] || o; });
    var used = {}, out = [];
    orders.forEach(function (o) {
      if (o.direction !== 'reverse') return;
      var f = o.linked_order_id ? byId[o.linked_order_id] : null;
      if (f) used[f.order_id] = true;
      out.push({ id: o.order_id, reverse: o, forward: f, created: o.created_at });
    });
    orders.forEach(function (o) {
      if (o.direction === 'reverse' || used[o.order_id]) return;
      out.push({ id: o.order_id, reverse: null, forward: o, created: o.created_at });
    });
    out.forEach(function (c) {
      c.st = caseStatus(c);
      var lead = c.reverse || c.forward, sh = ship(lead);
      c.customer = sh.name || '';
      c.city = [sh.city, sh.state].filter(Boolean).join(', ');
      c.product = String(sh.products_desc || '').replace(/^(Repair|Replacement|Refund|Repaired|FOC)\s*-\s*/i, '');
      c.kind = c.reverse ? (c.reverse.job_type || 'Reverse') : 'forward';
      c.type = caseType(c);
      c.search = [c.id, c.forward && c.forward.order_id, c.reverse && c.reverse.waybill, c.forward && c.forward.waybill, c.customer, c.product, sh.phone].join(' ').toLowerCase();
    });
    // Failed bookings and cancelled shipments aren't shown at all.
    out = out.filter(function (c) { return !!c.st; });
    out.sort(function (a, b) { return String(b.created || '').localeCompare(String(a.created || '')); });
    return out;
  }

  function renderTiles() {
    var el = document.getElementById('tiles');
    el.innerHTML = TILES.map(function (t) {
      var n = cases.filter(t.test).length;
      var verify = t.key === 'upcoming' ? cases.filter(function (c) { return c.st.attn; }).length : 0;
      return '<button class="tile' + (tileFilter === t.key ? ' active' : '') + '" data-f="' + t.key + '" style="--tile-c:' + t.c + '">' +
        '<div class="tile-n">' + n + '</div><div class="tile-l">' + esc(t.label) +
        (verify ? ' <span class="tile-flag">' + verify + ' to verify</span>' : '') + '</div></button>';
    }).join('');
    el.querySelectorAll('.tile').forEach(function (t) {
      t.addEventListener('click', function () { tileFilter = t.dataset.f; page = 1; renderTiles(); renderTable(); });
    });
  }

  function renderTable() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var kind = document.getElementById('f-kind').value;
    var rows = cases.filter(function (c) {
      return tileTest(tileFilter)(c) && (!kind || c.type === kind) && (!q || c.search.indexOf(q) !== -1);
    });
    var body = document.getElementById('case-body');
    if (!rows.length) { body.innerHTML = '<tr><td colspan="5" class="muted">No cases match.</td></tr>'; renderPager(0, 1); return; }
    var totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (page > totalPages) page = totalPages;
    if (page < 1) page = 1;
    var total = rows.length;
    rows = rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
    body.innerHTML = '';
    rows.forEach(function (c) {
      var tr = document.createElement('tr');
      tr.className = 'case-row' + (c.st.attn ? ' attn' : '');
      var ids = c.reverse
        ? '<div class="mono">' + esc(c.reverse.order_id) + '</div>' + (c.forward ? '<div class="sub mono">&#8627; ' + esc(c.forward.order_id) + '</div>' : '')
        : '<div class="mono">' + esc(c.forward.order_id) + '</div>';
      var kindLabel = c.reverse ? esc(c.kind) + ' · ' + esc(c.reverse.courier || 'Delhivery') : 'Forward · ' + esc(c.forward.courier || 'Delhivery');
      tr.innerHTML =
        '<td>' + ids + '<div class="sub">' + kindLabel + '</div></td>' +
        '<td>' + esc(c.customer || '—') + (c.city ? '<div class="sub">' + esc(c.city) + '</div>' : '') + '</td>' +
        '<td>' + esc(c.product || '—') + '</td>' +
        '<td>' + esc(c.type) + '</td>' +
        '<td>' + badgeHtml(c.st) + '</td>';
      tr.addEventListener('click', function () { openCase(c); });
      body.appendChild(tr);
    });
    // Pad a short page with blank rows so the table always has 10 equal
    // rows — same shape on every page, pager never moves.
    {
      for (var i = rows.length; i < PAGE_SIZE; i++) {
        var pad = document.createElement('tr');
        pad.setAttribute('aria-hidden', 'true');
        pad.innerHTML = '<td colspan="5">&nbsp;<div class="sub">&nbsp;</div></td>';
        body.appendChild(pad);
      }
    }
    renderPager(total, totalPages);
  }

  function renderPager(total, totalPages) {
    var wrap = document.getElementById('pager');
    if (total <= PAGE_SIZE) { wrap.style.display = 'none'; return; } // single page — nothing to paginate
    wrap.style.display = 'flex';
    document.getElementById('pager-ind').textContent =
      ((page - 1) * PAGE_SIZE + 1) + '\u2013' + Math.min(page * PAGE_SIZE, total) + ' of ' + total + ' \u00b7 Page ' + page + ' of ' + totalPages;
    document.getElementById('pager-prev').disabled = page <= 1;
    document.getElementById('pager-next').disabled = page >= totalPages;
  }
  function goToPage(p) { page = p; renderTable(); }
  document.getElementById('pager-prev').addEventListener('click', function () { goToPage(page - 1); });
  document.getElementById('pager-next').addEventListener('click', function () { goToPage(page + 1); });

  // ── Case popup: both legs + live tracking per leg ──
  var modal = document.getElementById('case-modal');
  function closeCase() { modal.hidden = true; }
  document.getElementById('case-close').addEventListener('click', closeCase);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeCase(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeCase(); });

  // One courier leg: section header (+ Track now) and courier facts only.
  // Customer/product details live once in the summary strip above.
  function legHtml(o, title, idx) {
    var st = legStage(o);
    var stLabel = (o.direction === 'reverse' ? PICKUP_LABEL[st] : DISPATCH_LABEL[st]) || st;
    var raw = String(o.track_status || '');
    var showRaw = raw && raw.toLowerCase().replace(/l+/g, 'l') !== String(stLabel).toLowerCase().replace(/l+/g, 'l');
    var f = function (k, v, sub) { return '<div><div class="cm-k">' + k + '</div><div>' + (v || '&#8212;') + '</div>' + (sub ? '<div class="cm-muted">' + sub + '</div>' : '') + '</div>'; };
    return '<div class="cm-sec"><div class="cm-sec-title">' + esc(title) + ' &mdash; <span class="mono">' + esc(o.order_id) + '</span></div>' +
        '</div>' +
      '<div class="cm-grid">' +
        f('Courier', esc(o.courier || 'Delhivery')) +
        f('AWB Number', o.waybill ? '<span class="mono">' + esc(o.waybill) + '</span>' +
          '<button class="copy-btn" data-copy="' + esc(o.waybill) + '" title="Copy AWB number" aria-label="Copy AWB number">' +
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>' : '') +
        f('Courier status', esc(stLabel), showRaw ? esc(raw) : '') +
        f('Booked by', esc(o.created_by || ''), esc(fmtWhen(o.created_at))) +
      '</div><div class="track-box" id="track-' + idx + '" hidden></div>';
  }

  // ── Next-step button for reverse cases (admin / manager only; the
  //   Worker enforces the same). Send back itself is booked in Create
  //   Parcel Pickup, so that one is just a link.
  function actionsHtml(c) {
    var html = nextStepHtml(c);
    return html ? '<div class="case-acts">' + html + '</div>' : '';
  }
  function nextStepHtml(c) {
    if (window.TM_ROLE !== 'admin' && window.TM_ROLE !== 'manager') return '';
    var r = c.reverse, f = c.forward;
    var btn = function (act, label) { return '<button class="case-act primary" data-act="' + act + '">' + label + '</button>'; };
    var fs = f && f.delhivery_ok ? legStage(f) : '';
    // Forward shipment booked but label not printed yet → Download label
    // (printing it is what moves the case to Ready To Dispatch).
    if (fs === 'Created' && f.waybill && !f.rtd_at) return btn('label', '&#11015; Download label');
    if (!r || !r.delhivery_ok || r.refunded_at) return '';
    if (fs && fs !== 'Cancelled') return '';
    if (!r.received_at) return legStage(r) === 'Delivered' ? btn('recv', 'Received') : '';
    if (r.job_type === 'Refund') return btn('refund', 'Refund given');
    return btn('sendback', 'Send back &#8594;');
  }

  // ══ SEND BACK — one click books the forward shipment to the exact same
  // customer (name / number / address), same product, package and courier
  // as the reverse pickup. Steps: build order → check the PIN is
  // serviceable for forward delivery → show estimate + details → on
  // confirm, get the next FRPR/FRPL Order ID and create it, linked to
  // the pickup. Create Parcel Pickup's own "Send back →" (pre-filled
  // form) stays as the fallback when anything needs editing.
  var SEND_BACK_TYPE = { Repair: { job: 'Repaired', prefix: 'FRPR' }, Replacement: { job: 'Replacement', prefix: 'FRPL' } };

  function sendBackOrder(r) {
    var sh = ship(r), t = SEND_BACK_TYPE[r.job_type] || SEND_BACK_TYPE.Repair;
    var sku = String(sh.products_desc || '').replace(/^(Repair|Replacement)\s*-\s*/i, '').trim();
    return {
      linked_order_id: r.order_id,
      name: sh.name || '', phone: String(sh.phone || '').replace(/\D/g, '').slice(-10),
      add: sh.add || '', pin: String(sh.pin || ''), city: sh.city || '', state: sh.state || '',
      products_desc: t.job + ' - ' + sku, job_type: t.job, remark: r.remark || '',
      direction: 'forward', payment_mode: 'Prepaid',
      quantity: sh.quantity || '1', total_amount: sh.total_amount || '', hsn_code: sh.hsn_code || '8467',
      weight: sh.weight || undefined,
      length: sh.shipment_length || undefined, width: sh.shipment_width || undefined, height: sh.shipment_height || undefined,
      courier: r.courier === 'Ekart' ? 'Ekart' : 'Delhivery',
      _prefix: t.prefix, _sku: sku
    };
  }
  var COURIERS = ['Delhivery', 'Ekart'];
  function ckey(name) { return name === 'Ekart' ? 'ekart' : 'delhivery'; }

  // ── Send-back confirm panel (editable) ─────────────────────────────
  //   Product — defaults to the pickup's SKU; pick/type another if a
  //             different item goes out. A known SKU also refreshes value,
  //             weight and size from the listing data.
  //   Value   — editable.
  //   Courier — Delhivery / Ekart chips, each showing its serviceability
  //             for the PIN and estimate; click to switch. Starts on the
  //             pickup's courier, or the other one if it can't deliver.
  var sb = null;          // current panel state
  var skuList = null, skuInfo = null;   // loaded once, on first use

  async function loadSkuSources() {
    if (skuList) return;
    skuList = [];
    try {
      var r = await api('ucsku_getList');
      skuList = ((r && r.skus) || []).slice().sort();
    } catch (e) {}
    try {
      var info = await api('delhiveryAmzProductInfo');
      if (info && info.ok && info.products) skuInfo = info.products;
    } catch (e) {}
  }
  function skuKey(x) { return String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function lookupSku(sku) {
    if (!skuInfo) return null;
    if (skuInfo[sku]) return skuInfo[sku];
    var want = skuKey(sku);
    for (var k in skuInfo) if (skuKey(k) === want) return skuInfo[k];
    return null;
  }

  async function startSendBack(c, btn) {
    var o = sendBackOrder(c.reverse);
    if (!o.name || !o.phone || !o.add || !/^\d{6}$/.test(o.pin)) {
      alert('The pickup is missing the name, number, address or PIN — use Create Parcel Pickup to send it back.');
      return;
    }
    btn.disabled = true; btn.textContent = 'Checking…';
    sb = { c: c, o: o, btn: btn, sv: {}, refused: {}, note: '' };
    await Promise.all([loadSkuSources(), checkCouriers()]);
    // Start on the pickup's courier if it can deliver, else the other.
    if (!sb.sv[o.courier] || !sb.sv[o.courier].ok) {
      var alt = COURIERS.filter(function (x) { return x !== o.courier && sb.sv[x] && sb.sv[x].ok; })[0];
      if (alt) { sb.note = o.courier + " can't deliver to " + o.pin + ' — using ' + alt + '.'; o.courier = alt; }
    }
    btn.style.display = 'none';
    renderSendBack();
  }

  // Serviceability + estimate for both couriers (in parallel).
  async function checkCouriers() {
    var o = sb.o;
    var qs = new URLSearchParams({ pin: o.pin, weight: o.weight || '500', payment_mode: 'Prepaid',
      length: o.length || '5', width: o.width || '5', height: o.height || '5',
      invoice_amount: o.total_amount || '0', direction: 'forward' }).toString();
    await Promise.all(COURIERS.map(async function (name) {
      var st = { ok: false, text: 'Checking…', cost: '' };
      try {
        var pr = await api(ckey(name) + 'CheckPincode&pin=' + o.pin);
        if (!pr || !pr.ok) st.text = 'Couldn\u2019t check';
        else if (!pr.serviceable || pr.prepaid === false) st.text = 'Not serviceable';
        else {
          st.ok = true; st.text = 'Serviceable';
          // Each courier wants city/state in its own format (Delhivery
          // gives "MH", Ekart needs "Maharashtra") — keep what it returned.
          st.city = pr.city || ''; st.state = pr.state || '';
          try {
            var est = await api(ckey(name) + 'EstimateCharge&' + qs);
            if (est && est.ok && est.estimated && est.totalAmount != null) st.cost = '₹' + est.totalAmount;
          } catch (e) {}
        }
      } catch (e) { st.text = 'Couldn\u2019t check'; }
      if (sb.refused[name]) { st.ok = false; st.text = 'Refused this PIN'; }
      sb.sv[name] = st;
    }));
  }

  // City/State shown under the address — from the selected courier's PIN
  // lookup when available (that's what gets booked), else the pickup's.
  function cityState() {
    var st = sb.sv[sb.o.courier] || {};
    return [st.city || sb.o.city, st.state || sb.o.state].filter(Boolean).join(', ');
  }

  function renderSendBack() {
    var o = sb.o, panel = document.getElementById('cm-confirm');
    var anyOk = COURIERS.some(function (x) { return sb.sv[x] && sb.sv[x].ok; });
    var chips = COURIERS.map(function (name) {
      var st = sb.sv[name] || { text: '…' };
      return '<button type="button" class="sb-chip' + (o.courier === name ? ' on' : '') + (st.ok ? '' : ' off') + '" data-courier="' + name + '"' + (st.ok ? '' : ' disabled') + '>' +
        '<b>' + name + '</b><span>' + (st.ok ? '&#10003; ' : '&#10007; ') + esc(st.text) + (st.cost ? ' · ' + esc(st.cost) : '') + '</span></button>';
    }).join('');
    panel.innerHTML =
      '<div class="cm-sec-title" style="margin-bottom:8px">Confirm send back</div>' +
      '<div class="cm-summary">' +
        '<div><div class="cm-k">Deliver to</div><div>' + esc(o.name) + '</div></div>' +
        '<div><div class="cm-k">Contact Number</div><div>' + esc(o.phone) + '</div></div>' +
        '<div><div class="cm-k">Payment</div><div>Prepaid</div></div>' +
        '<div class="span2"><div class="cm-k">Address (edit if the customer gave a corrected one)</div>' +
          '<input class="sb-input" id="sb-address" value="' + esc(o.add) + '" autocomplete="off">' +
          '<div class="cm-muted">' + esc(cityState()) + '</div></div>' +
        '<div><div class="cm-k">PIN</div><input class="sb-input" id="sb-pin" inputmode="numeric" maxlength="6" value="' + esc(o.pin) + '"></div>' +
        '<div class="span2"><div class="cm-k">Product (change if sending a different item)</div>' +
          '<input class="sb-input" id="sb-product" list="sb-skus" value="' + esc(o._sku) + '" autocomplete="off">' +
          '<datalist id="sb-skus">' + (skuList || []).map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist></div>' +
        '<div><div class="cm-k">Value (₹)</div><input class="sb-input" id="sb-value" type="number" min="1" value="' + esc(o.total_amount) + '"></div>' +
      '</div>' +
      '<div class="cm-k" style="margin:12px 0 6px">Courier partner &amp; serviceability for ' + esc(o.pin) + '</div>' +
      '<div class="sb-chips">' + chips + '</div>' +
      '<div class="cm-acts" style="border-top:none;padding-top:0;margin-top:12px">' +
        '<button class="case-act primary" id="sb-yes"' + (anyOk ? '' : ' disabled') + '>Book send back</button>' +
        '<button class="case-act" id="sb-no">Cancel</button>' +
        '<span class="cm-muted" style="margin-left:auto">' + (sb.note ? '<b style="color:var(--accent)">' + esc(sb.note) + '</b> ' : '') +
          (anyOk ? 'Nothing is booked until you confirm.' : 'Neither courier delivers here — send it another way.') + '</span>' +
      '</div>';
    panel.hidden = false;

    panel.querySelectorAll('.sb-chip').forEach(function (ch) {
      ch.addEventListener('click', function () { o.courier = ch.dataset.courier; sb.note = ''; readInputs(); renderSendBack(); });
    });
    // Product / value change → refresh package from listing data and re-check estimates.
    var t = null;
    function changed(e) {
      clearTimeout(t);
      t = setTimeout(async function () {
        var prevSku = o._sku;
        readInputs();
        if (e && e.target.id === 'sb-product' && o._sku !== prevSku) {
          var info = lookupSku(o._sku);
          if (info) {
            // Same rules as Create Parcel Pickup: listing price × qty,
            // weight = 50% of the listing weight (rounded up).
            if (info.price) o.total_amount = String(+(info.price * (parseInt(o.quantity, 10) || 1)).toFixed(2));
            if (info.weight) o.weight = Math.ceil(Number(info.weight) * 0.5);
            if (info.length && info.width && info.height) { o.length = Math.ceil(info.length); o.width = Math.ceil(info.width); o.height = Math.ceil(info.height); }
          }
        }
        await checkCouriers();
        if (!sb.sv[o.courier] || !sb.sv[o.courier].ok) {
          var alt = COURIERS.filter(function (x) { return sb.sv[x] && sb.sv[x].ok; })[0];
          if (alt) o.courier = alt;
        }
        renderSendBack();
      }, 600);
    }
    document.getElementById('sb-product').addEventListener('change', changed);
    document.getElementById('sb-value').addEventListener('change', changed);
    document.getElementById('sb-pin').addEventListener('change', function (e) {
      var v = e.target.value.replace(/\D/g, '');
      if (!/^\d{6}$/.test(v)) { alert('Enter a valid 6-digit PIN.'); e.target.value = o.pin; return; }
      if (v === o.pin) return;
      o.pin = v; sb.refused = {}; sb.note = '';   // new PIN → both couriers get a fresh chance
      changed(e);
    });
    document.getElementById('sb-no').addEventListener('click', function () {
      panel.hidden = true; panel.innerHTML = '';
      sb.btn.style.display = ''; sb.btn.disabled = false; sb.btn.innerHTML = 'Send back &#8594;';
      sb = null;
    });
    document.getElementById('sb-yes').addEventListener('click', function () { readInputs(); bookSendBack(this); });
  }

  function readInputs() {
    var p = document.getElementById('sb-product'), v = document.getElementById('sb-value');
    if (p) sb.o._sku = p.value.trim() || sb.o._sku;
    if (v && v.value) sb.o.total_amount = v.value;
    var ad = document.getElementById('sb-address');
    if (ad && ad.value.trim()) sb.o.add = ad.value.trim();
    sb.o.products_desc = sb.o.job_type + ' - ' + sb.o._sku;
  }

  async function bookSendBack(yesBtn) {
    var c = sb.c, o = sb.o;
    if (!o._sku) { alert('Enter the product being sent.'); return; }
    yesBtn.disabled = true; yesBtn.textContent = 'Booking…';
    try {
      var idRes = await api('delhiveryNextOrderId&prefix=' + o._prefix);
      if (!idRes || !idRes.ok || !idRes.orderId) throw new Error("Couldn't get the next Order ID — try again.");
      var order = Object.assign({}, o, { order: idRes.orderId });
      delete order._prefix; delete order._sku;
      // City/State exactly as the chosen courier's PIN lookup returned them
      // (same as Create Parcel Pickup); fall back to the pickup's values.
      var cs = sb.sv[order.courier] || {};
      if (cs.city) order.city = cs.city;
      if (cs.state) order.state = cs.state;
      var res, attempts = 0;
      while (true) {                 // same duplicate-ID retry as Create Parcel Pickup
        res = await post(order.courier === 'Ekart' ? 'ekartCreateOrder' : 'delhiveryCreateOrder', { order: order });
        if (res.ok) break;
        var pkg = res.response && res.response.packages && res.response.packages[0];
        var remarks = [res.error].concat(pkg && pkg.remarks ? [].concat(pkg.remarks) : []);
        if (!remarks.some(function (x) { return /duplicate|already exists/i.test(String(x || '')); }) || ++attempts >= 5) break;
        var m = /^([A-Z]+-\d{6})(\d+)$/.exec(order.order);
        if (!m) break;
        order.order = m[1] + String(parseInt(m[2], 10) + 1).padStart(2, '0');
      }
      if (!res.ok) {
        var p = res.response && res.response.packages && res.response.packages[0];
        var msg = res.error || (p && [].concat(p.remarks || []).join(', ')) || 'booking failed';
        // Courier refused the PIN at booking time (its pincode check can't
        // know e.g. same area as our warehouse) → mark it refused and move
        // the selection to the other courier for a fresh confirm.
        if (/serviceable|not service|pincode/i.test(msg)) {
          sb.refused[order.courier] = true;
          sb.sv[order.courier] = { ok: false, text: 'Refused this PIN' };
          var alt = COURIERS.filter(function (x) { return sb.sv[x] && sb.sv[x].ok; })[0];
          sb.note = order.courier + ' refused PIN ' + o.pin + (alt ? ' — switched to ' + alt + '.' : '.');
          if (alt) o.courier = alt;
          renderSendBack();
          return;
        }
        throw new Error(msg);
      }
      // Reload and reopen this case — it now shows the green Booked badge
      // and the Download label button.
      sb = null;
      await load(false);
      var fresh = cases.filter(function (x) { return x.id === c.id; })[0];
      if (fresh) openCase(fresh); else closeCase();
    } catch (e) {
      alert("Couldn't book the send back: " + e.message);
      yesBtn.disabled = false; yesBtn.textContent = 'Book send back';
    }
  }

  function post(action, body) {
    var s = window.TM_getSession(), h = { 'Content-Type': 'application/json' };
    if (s && s.token) h['X-Tomahawk-Session'] = s.token;
    return fetch(window.TM_WORKER + '?action=' + action, {
      method: 'POST', headers: h, body: JSON.stringify(Object.assign({ action: action }, body))
    }).then(function (r) { return r.json(); });
  }

  // Download the forward label (courier's own 4×6 PDF). The Worker stamps
  // rtd_at on the first download → case moves to Ready To Dispatch.
  async function downloadFwdLabel(c, btn) {
    var f = c.forward;
    btn.disabled = true; btn.textContent = 'Downloading…';
    try {
      var s = window.TM_getSession(), h = {};
      if (s && s.token) h['X-Tomahawk-Session'] = s.token;
      var url = window.TM_WORKER + '?action=' + (f.courier === 'Ekart' ? 'ekartGetLabel&waybill=' : 'delhiveryGetLabel&file=1&waybill=') + encodeURIComponent(f.waybill);
      var resp = await fetch(url, { headers: h });
      if (!resp.ok || (resp.headers.get('Content-Type') || '').indexOf('application/pdf') === -1) {
        var err = {}; try { err = await resp.json(); } catch (e2) {}
        throw new Error(err.error || ('HTTP ' + resp.status));
      }
      var blob = await resp.blob(), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = f.order_id + '.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      await load(false);
      var fresh = cases.filter(function (x) { return x.id === c.id; })[0];
      if (fresh) openCase(fresh);
    } catch (e) {
      alert("Couldn't download the label: " + e.message);
      btn.disabled = false; btn.innerHTML = '&#11015; Download label';
    }
  }

  var ACTS = {
    recv:    { worker: 'delhiveryMarkReceived',  ask: 'Confirm the parcel has physically arrived at the warehouse? It moves to In Process.' },
    process: { worker: 'delhiveryMarkInProcess', ask: 'Start processing this case (repair / replacement / refund check)?' },
    refund:  { worker: 'delhiveryMarkRefunded',  ask: 'Refund given? This closes the case.' }
  };
  // Marks every leg of the case cancelled in Tomahawk and hides it. Does
  // NOT cancel the booking with the courier — do that in their panel.
  async function cancelCase(c, btn) {
    if (!confirm('Cancel ' + c.id + ' and remove it from the Dashboard?\n\nThis only marks it cancelled in Tomahawk — the courier booking itself is NOT cancelled.')) return;
    var ids = [c.reverse && c.reverse.order_id, c.forward && c.forward.order_id].filter(Boolean);
    btn.disabled = true;
    try {
      var s = window.TM_getSession(), h = { 'Content-Type': 'application/json' };
      if (s && s.token) h['X-Tomahawk-Session'] = s.token;
      var res = await fetch(window.TM_WORKER + '?action=delhiveryCancelCase', {
        method: 'POST', headers: h, body: JSON.stringify({ action: 'delhiveryCancelCase', order_ids: ids })
      }).then(function (r) { return r.json(); });
      if (!res.ok) throw new Error(res.error || 'failed');
      closeCase();
      load(false);
    } catch (e) {
      alert("Couldn't cancel: " + e.message);
      btn.disabled = false;
    }
  }

  async function caseAction(c, btn) {
    if (btn.dataset.act === 'sendback') return startSendBack(c, btn);
    if (btn.dataset.act === 'label') return downloadFwdLabel(c, btn);
    var a = ACTS[btn.dataset.act];
    if (!a || !confirm(c.id + ': ' + a.ask)) return;
    btn.disabled = true;
    try {
      var s = window.TM_getSession(), h = { 'Content-Type': 'application/json' };
      if (s && s.token) h['X-Tomahawk-Session'] = s.token;
      var res = await fetch(window.TM_WORKER + '?action=' + a.worker, {
        method: 'POST', headers: h, body: JSON.stringify({ action: a.worker, order_id: c.reverse.order_id })
      }).then(function (r) { return r.json(); });
      if (!res.ok) throw new Error(res.error || 'failed');
      closeCase();
      load(false);
    } catch (e) {
      alert("Couldn't update: " + e.message);
      btn.disabled = false;
    }
  }

  function openCase(c) {
    var legs = [];
    if (c.reverse) legs.push([c.reverse, 'Reverse pickup']);
    if (c.forward) legs.push([c.forward, c.reverse ? 'Send-back shipment' : 'Forward shipment']);
    var lead = c.reverse || c.forward, sh = ship(lead);
    document.getElementById('case-title').textContent = c.id;
    document.getElementById('case-sub').textContent = '';
    var f = function (k, v, cls) { return '<div' + (cls ? ' class="' + cls + '"' : '') + '><div class="cm-k">' + k + '</div><div>' + (v ? esc(v) : '&#8212;') + '</div></div>'; };
    // Summary: name · number · type / product · status
    var summary = '<div class="cm-summary">' +
      f('Customer', sh.name) + f('Contact Number', sh.phone) + f('Type', c.type) +
      f('Product', c.product) +
      f('Courier Partner', [c.reverse && (c.reverse.courier || 'Delhivery'), c.forward && (c.forward.courier || 'Delhivery')]
        .filter(function (x, i, a) { return x && a.indexOf(x) === i; }).join(' / ')) +
      '<div><div class="cm-k">Status</div><div>' + badgeHtml(c.st) + '</div></div>' +
      '</div>';
    // Bottom row: next-step button(s), then Track now per leg on the right.
    var trackBtns = legs.map(function (l, i) {
      var o = l[0];
      if (!o.delhivery_ok || !o.waybill) return '';
      var lbl = legs.length > 1 ? (o.direction === 'reverse' ? 'Track pickup' : 'Track send-back') : 'Track now';
      return '<button class="track-btn" data-leg="' + i + '">' + lbl + '</button>';
    }).join('');
    var acts = actionsHtml(c) + (trackBtns ? '<span style="margin-left:auto;display:flex;gap:8px">' + trackBtns + '</span>' : '');
    var box = document.getElementById('case-body-modal');
    box.innerHTML = summary +
      legs.map(function (l, i) { return legHtml(l[0], l[1], i); }).join('') +
      '<div id="cm-confirm" style="margin-top:18px" hidden></div>' +
      (acts ? '<div class="cm-acts">' + acts + '</div>' : '');
    box.querySelectorAll('.case-act[data-act]').forEach(function (b) {
      b.addEventListener('click', function () { caseAction(c, b); });
    });
    var cb = box.querySelector('.case-act[data-cancel]');
    if (cb) cb.addEventListener('click', function () { cancelCase(c, cb); });
    // Copy AWB number — icon briefly turns into a green tick.
    box.querySelectorAll('.copy-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var done = function () { var h = b.innerHTML; b.classList.add('copied'); b.innerHTML = '&#10003;'; setTimeout(function () { b.innerHTML = h; b.classList.remove('copied'); }, 1200); };
        if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, function () {});
      });
    });
    box.querySelectorAll('.track-btn').forEach(function (b) {
      b.addEventListener('click', function () { track(legs[+b.dataset.leg][0], b); });
    });
    modal.hidden = false;
  }

  async function track(o, btn) {
    var box = document.getElementById('track-' + btn.dataset.leg);
    box.hidden = false; box.innerHTML = 'Tracking…'; btn.disabled = true;
    try {
      var t = await api((o.courier === 'Ekart' ? 'ekartTrack' : 'delhiveryTrack') + '&waybill=' + encodeURIComponent(o.waybill));
      if (!t || !t.ok) throw new Error((t && t.error) || 'no data');
      var scans = t.scans || [];
      box.innerHTML = '<div><b>' + esc(t.status || 'No status yet') + '</b>' +
        (t.location ? ' · ' + esc(t.location) : '') + (t.at ? ' · ' + esc(fmtWhen(t.at)) : '') + '</div>' +
        (t.detail ? '<div class="scan-meta">' + esc(t.detail) + '</div>' : '') +
        (t.expectedDelivery ? '<div class="scan-meta">Expected: ' + esc(fmtWhen(t.expectedDelivery)) + '</div>' : '') +
        (scans.length ? '<ul class="scan-list">' + scans.map(function (s) {
          return '<li><div class="scan-st">' + esc(s.status) + '</div><div class="scan-meta">' +
            esc([s.location, fmtWhen(s.at)].filter(Boolean).join(' · ')) + (s.detail ? ' — ' + esc(s.detail) : '') + '</div></li>';
        }).join('') + '</ul>' : '<div class="scan-meta">No scans yet.</div>');
    } catch (e) {
      box.innerHTML = '<span style="color:#f87171">Couldn\'t load tracking: ' + esc(e.message) + '</span>';
    }
    btn.disabled = false; btn.textContent = 'Refresh tracking';
  }

  async function load(force) {
    try {
      var res = await api('delhiveryListOrders&limit=500' + (force ? '&refresh=1' : ''));
      if (!res || !res.ok) throw new Error((res && res.error) || 'failed');
      cases = buildCases(res.orders || []);
      renderTiles(); renderTable();
    } catch (e) {
      document.getElementById('case-body').innerHTML = '<tr><td colspan="5" class="muted">Couldn\'t load cases: ' + esc(e.message) + '</td></tr>';
    }
  }
  document.getElementById('q').addEventListener('input', function () { page = 1; renderTable(); });
  document.getElementById('f-kind').addEventListener('change', function () { page = 1; renderTable(); });
  document.getElementById('refresh-btn').addEventListener('click', function () { load(true); });
  load(false);
})();
</script>

</body>
</html>
