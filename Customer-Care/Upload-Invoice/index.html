<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Upload invoice — TOMAHAWK Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════
  UPLOAD INVOICE — public page for customers (no login). 29-Oct-2026.
  Opened from the single-use link the Customer Care Dashboard makes with
  "Ask for invoice again" on an NV- request (…/Upload-Invoice/?t=TOKEN).
  Up to 3 photos / PDFs, 10 MB each. The Worker checks the token (7 days,
  single use), saves the files on the request tagged "Invoice" and sends
  the request back to the team's review.
  Worker actions: invoiceUploadInfo (GET), invoiceUploadSubmit (POST).
  Same look as /Refund/.
  ══════════════════════════════════════════════════════════════════
-->
<style>
:root { --bg:#0b0b10; --surface:#14141c; --surface2:#1b1b25; --border:#2a2a36; --text:#e8e8f0; --text2:#9a9aab; --accent:#F5A800; --red:#f87171; --green:#22c55e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; }
header { padding: 18px 20px; border-bottom: 1px solid var(--border); color: var(--accent); display: flex; justify-content: center; }
main { max-width: 520px; margin: 0 auto; padding: 24px 18px 48px; }
h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 24px; margin: 0 0 6px; }
.sub { color: var(--text2); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); margin-bottom: 3px; }
.v { font-weight: 600; word-break: break-word; }
.note { border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 14px; line-height: 1.5; white-space: pre-line; }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 2px dashed var(--border); border-radius: 12px;
  padding: 26px 14px; text-align: center; cursor: pointer; color: var(--text2); font-size: 14px; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--text); }
.drop b { color: var(--accent); font-size: 16px; }
.files { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.file { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.file img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
.file .pdf { width: 44px; height: 44px; border-radius: 6px; background: #3a1d1d; color: var(--red); font-weight: 800; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.file .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .x { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; padding: 0 4px; width: auto; margin: 0; }
.hint { font-size: 12px; color: var(--text2); margin-top: 8px; }
button.main { width: 100%; margin-top: 18px; padding: 14px; border: none; border-radius: 10px; background: var(--accent); color: #111; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
button.main:disabled { opacity: .5; cursor: progress; }
.err { background: color-mix(in srgb, var(--red) 12%, transparent); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); color: var(--red); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 14px; }
.state { text-align: center; padding: 30px 18px; }
.state .big { font-size: 44px; margin-bottom: 10px; }
.secure { text-align: center; font-size: 12px; color: var(--text2); margin-top: 18px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><svg xmlns="http://www.w3.org/2000/svg" viewBox="474 509 6803 1270" style="height:40px;width:auto;display:block;fill:currentColor;">

<main>
  <div id="loading" class="card state"><div class="sub">Loading…</div></div>

  <div id="message" class="card state" hidden>
    <div class="big" id="msg-icon">⚠</div>
    <h1 id="msg-title">Link not valid</h1>
    <div class="sub" id="msg-text"></div>
  </div>

  <div id="form-wrap" hidden>
    <h1>Upload your invoice</h1>
    <div class="sub">Hi <span id="first-name"></span>, we need your invoice again to verify your service request.</div>
    <div class="card facts">
      <div><div class="k">Request ID</div><div class="v" id="claim-id"></div></div>
      <div><div class="k">Product</div><div class="v" id="product"></div></div>
      <div style="grid-column:span 2" id="note-wrap"><div class="k">Message from our team</div><div class="note" id="note"></div></div>
    </div>

    <div class="card">
      <label class="drop" id="drop" for="file-in">
        <b>+ Add invoice photo or PDF</b>
        <span>Take a clear photo of the full invoice — order no., date and product should be readable.</span>
      </label>
      <input type="file" id="file-in" accept="image/*,application/pdf" multiple hidden>
      <div class="files" id="files"></div>
      <div class="hint">Up to 3 files · photos or PDF · max 10 MB each.</div>
      <div class="err" id="err" hidden></div>
      <button class="main" id="submit" disabled>Upload invoice</button>
    </div>
    <div class="secure">🔒 Sent securely to TOMAHAWK Tools customer care. This link works once.</div>
  </div>
</main>

<script>
(function () {
  var WORKER = 'https://tomahawk-returns.naimuddin.workers.dev';
  var MAX_FILES = 3, MAX_BYTES = 10 * 1024 * 1024;
  var token = new URLSearchParams(location.search).get('t') || '';
  var picked = [];   // File objects chosen by the customer
  var $ = function (id) { return document.getElementById(id); };

  function show(id) { ['loading', 'message', 'form-wrap'].forEach(function (x) { $(x).hidden = x !== id; }); }
  function message(icon, title, text) { $('msg-icon').textContent = icon; $('msg-title').textContent = title; $('msg-text').textContent = text; show('message'); }
  function err(text) { $('err').textContent = text || ''; $('err').hidden = !text; }

  async function init() {
    if (!token) return message('⚠', 'Link not valid', 'Please open the full link sent to you by our customer care team.');
    try {
      var res = await fetch(WORKER + '?action=invoiceUploadInfo&t=' + encodeURIComponent(token)).then(function (r) { return r.json(); });
      if (!res.ok) return message('⚠', 'Link not available', res.error || 'Please contact our customer care team.');
      $('first-name').textContent = res.first_name || 'there';
      $('claim-id').textContent = res.claim_id;
      $('product').textContent = res.product || '—';
      if (res.note) $('note').textContent = res.note; else $('note-wrap').hidden = true;
      show('form-wrap');
    } catch (e) {
      message('⚠', 'Something went wrong', 'Please check your internet connection and open the link again.');
    }
  }

  // Add files (from the picker or drag & drop) — images and PDFs only, 3 max, 10 MB each
  function addFiles(list) {
    err('');
    Array.prototype.forEach.call(list, function (f) {
      if (!/^image\//.test(f.type) && f.type !== 'application/pdf') return err('Only photos or PDF files, please.');
      if (f.size > MAX_BYTES) return err('"' + f.name + '" is larger than 10 MB — please use a smaller photo.');
      if (picked.length >= MAX_FILES) return err('Up to 3 files, please.');
      picked.push(f);
    });
    renderFiles();
  }
  function renderFiles() {
    var box = $('files');
    box.innerHTML = '';
    picked.forEach(function (f, i) {
      var row = document.createElement('div');
      row.className = 'file';
      var thumb;
      if (f.type === 'application/pdf') { thumb = document.createElement('div'); thumb.className = 'pdf'; thumb.textContent = 'PDF'; }
      else { thumb = document.createElement('img'); thumb.src = URL.createObjectURL(f); thumb.alt = ''; }
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = f.name;
      var x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.setAttribute('aria-label', 'Remove'); x.innerHTML = '&times;';
      x.addEventListener('click', function () { picked.splice(i, 1); renderFiles(); });
      row.appendChild(thumb); row.appendChild(nm); row.appendChild(x);
      box.appendChild(row);
    });
    $('submit').disabled = !picked.length;
    $('drop').hidden = picked.length >= MAX_FILES;
  }
  $('file-in').addEventListener('change', function (e) { addFiles(e.target.files); e.target.value = ''; });
  var drop = $('drop');
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
  drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });

  function toBase64(f) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.onerror = reject;
      r.readAsDataURL(f);
    });
  }

  $('submit').addEventListener('click', async function () {
    var btn = $('submit');
    if (!picked.length) return;
    btn.disabled = true; btn.textContent = 'Uploading…'; err('');
    try {
      var files = [];
      for (var i = 0; i < picked.length; i++) files.push({ name: picked[i].name, type: picked[i].type, data: await toBase64(picked[i]) });
      var res = await fetch(WORKER + '?action=invoiceUploadSubmit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'invoiceUploadSubmit', t: token, files: files }) }).then(function (r) { return r.json(); });
      if (!res.ok) throw new Error(res.error || 'Upload failed — please try again.');
      message('✅', 'Invoice received', 'Thank you! Our team will check it and update you on request ' + res.claim_id + '.');
    } catch (e) {
      err(e.message);
      btn.disabled = false; btn.textContent = 'Upload invoice';
    }
  });

  init();
})();
</script>
</body>
</html>
