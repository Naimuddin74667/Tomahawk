<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRP Label · Tomahawk Operations</title>
<script>try{document.documentElement.setAttribute("data-theme", localStorage.getItem("tm_theme") || "dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same design tokens as the other Tomahawk tools (dark default, amber accent) */
  :root {
    --bg-base:        #0c0c14;
    --bg-surface:     #13131e;
    --bg-raised:      #1a1a28;
    --border-subtle:  #1f1f2e;
    --border-default: #2a2a38;
    --text-primary:   #e8e8f0;
    --text-secondary: #888899;
    --text-muted:     #6a6a80;
    --accent:         #F5A800;
    --accent-dim:     #F5A80018;
    --accent-border:  #F5A80044;
    --danger:         #f87171;
    --danger-dim:     #f8717115;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --font-display: 'Syne', sans-serif;
    --font-body:    'DM Sans', sans-serif;
  }
  html[data-theme="light"] {
    --bg-base:        #f4f4f7;
    --bg-surface:     #ffffff;
    --bg-raised:      #ededf3;
    --border-subtle:  #e0e0ea;
    --border-default: #d0d0dd;
    --text-primary:   #111118;
    --text-secondary: #555566;
    --text-muted:     #888899;
    --accent:         #c98a00;
    --accent-dim:     #F5A80014;
    --accent-border:  #F5A80055;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .site-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 24px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    border-left: 3px solid var(--accent);
  }
  .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .back-link {
    color: var(--text-secondary); text-decoration: none; font-size: 13px;
    padding: 6px 10px; border: 1px solid var(--border-default); border-radius: var(--radius-sm);
    white-space: nowrap;
  }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }
  .site-title { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
  .header-theme-toggle {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--bg-raised); border: 1px solid var(--border-default);
    color: var(--text-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .header-theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .header-theme-toggle .icon-sun { display: none; }
  html[data-theme="light"] .header-theme-toggle .icon-sun { display: block; }
  html[data-theme="light"] .header-theme-toggle .icon-moon { display: none; }

  .intro { max-width: 1200px; margin: 0 auto; padding: 22px 24px 4px; }
  .intro h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.2; }
  .intro p { margin-top: 6px; color: var(--text-secondary); }

  main {
    max-width: 1200px; margin: 0 auto; padding: 16px 24px 48px;
    display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; align-items: start;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; padding: 12px 14px 32px; }
    .intro { padding: 18px 14px 2px; }
    .site-header { padding: 12px 14px; }
  }

  .panel {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); padding: 16px;
  }
  .panel label.title { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 340px; resize: vertical;
    font: 13px/1.55 Consolas, "Courier New", monospace;
    color: var(--text-primary); background: var(--bg-base);
    border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 10px;
  }
  textarea::placeholder { color: var(--text-muted); }
  textarea:focus, input:focus, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  [hidden] { display: none !important; }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px;
    border-radius: var(--radius-md); border: 1px solid var(--accent);
    background: var(--accent); color: #111; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--accent); }
  button.ghost:hover { background: var(--accent-dim); filter: none; }
  button:disabled { opacity: .4; cursor: not-allowed; filter: none; }

  .count { color: var(--text-secondary); margin-bottom: 10px; }
  .empty {
    border: 1px dashed var(--border-default); border-radius: var(--radius-lg);
    padding: 36px 20px; text-align: center; color: var(--text-secondary);
    background: var(--bg-surface);
  }
  .cards { display: grid; gap: 16px; }
  .card {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); padding: 14px;
  }
  .card.bad { border-color: var(--danger); }
  /* The preview is a piece of paper, so it stays white with black text in both themes */
  .preview {
    width: 100%; max-width: 600px; aspect-ratio: 2 / 1; display: block;
    background: #fff; border: 1px solid var(--border-default); border-radius: 4px;
  }
  .fields {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin-top: 12px;
  }
  .fields label { font-size: 12px; color: var(--text-secondary); display: block; }
  .fields input {
    width: 100%; margin-top: 3px; padding: 7px 9px; font: inherit;
    color: var(--text-primary); background: var(--bg-base);
    border: 1px solid var(--border-default); border-radius: var(--radius-sm);
  }
  .fields input.err { border-color: var(--danger); background: var(--danger-dim); }
  .msg { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .note { color: var(--text-secondary); font-size: 13px; margin-top: 10px; }
</style>
<style id="tm-std-header">
/* ═══════════════════════════════════════════════════════════════════
   TOMAHAWK STANDARD HEADER — v1
   Identical copy in every team app so they all look like one product.
   If you change anything here, change it in EVERY app (search the repo
   for "TOMAHAWK STANDARD HEADER"). Colours are private --tmh-* tokens so
   the header looks the same whatever variable names the page uses.
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --tmh-bg: #13131e; --tmh-raised: #1a1a28; --tmh-hover: #1f1f30;
  --tmh-border: #1f1f2e; --tmh-border2: #2a2a38;
  --tmh-text2: #888899; --tmh-muted: #6b6b82;
  --tmh-logo: #F5A800; --tmh-accent: #F5A800; --tmh-accent-dim: #F5A80018; --tmh-accent-border: #F5A80044;
  --tmh-green: #4ade80; --tmh-red: #f87171; --tmh-divider: rgba(255,255,255,.5);
}
html[data-theme="light"] {
  --tmh-bg: #ffffff; --tmh-raised: #ededf3; --tmh-hover: #e4e4ee;
  --tmh-border: #e0e0ea; --tmh-border2: #d0d0dd;
  --tmh-text2: #555566; --tmh-muted: #888899;
  --tmh-logo: #c98a00; --tmh-accent: #c98a00; --tmh-accent-dim: #F5A80014; --tmh-accent-border: #F5A80055;
  --tmh-green: #16a34a; --tmh-red: #dc2626; --tmh-divider: rgba(0,0,0,.25);
}
html .site-header {
  position: sticky !important; top: 0 !important; z-index: 100 !important;
  box-sizing: border-box !important; width: 100% !important; max-width: none !important;
  height: 62px !important; min-height: 62px !important; margin: 0 !important;
  padding: 0 36px !important; display: flex !important; flex-wrap: nowrap !important;
  align-items: center !important; justify-content: space-between !important; gap: 20px !important;
  background: var(--tmh-bg) !important; border: 0 !important; border-bottom: 1px solid var(--tmh-border) !important;
  border-radius: 0 !important; box-shadow: none !important;
  font-family: 'DM Sans', system-ui, sans-serif !important; line-height: 1.4 !important;
  transition: background .2s ease, border-color .2s ease;
}
html .site-header * { box-sizing: border-box; }
html .site-header .header-logo {
  display: flex !important; align-items: center !important; gap: 14px !important;
  min-width: 0; flex-shrink: 0; text-decoration: none !important; margin: 0 !important; padding: 0 !important;
}
html .site-header .logo-svg-wrap {
  display: flex !important; align-items: center !important; color: var(--tmh-logo) !important;
  text-decoration: none !important; margin: 0 !important; padding: 0 !important; flex-shrink: 0;
}
html .site-header .logo-svg-wrap svg {
  height: 54px !important; width: auto !important; display: block !important; fill: currentColor !important;
}
html .site-header .logo-divider {
  display: block !important; width: 2px !important; height: 36px !important; flex-shrink: 0; margin: 0 !important;
  background: var(--tmh-divider) !important; border-radius: 2px !important;
}
html .site-header .logo-tagline {
  font-family: 'DM Sans', system-ui, sans-serif !important; font-size: 16px !important; font-weight: 600 !important;
  letter-spacing: .04em !important; color: var(--tmh-text2) !important; white-space: nowrap;
  display: block !important; min-width: 0; overflow: hidden; text-overflow: ellipsis; margin: 0 !important; text-transform: none !important;
}
html .site-header .tmh-crumb { color: inherit !important; text-decoration: none !important; }
html .site-header .tmh-crumb:hover { color: var(--tmh-accent) !important; }
html .site-header .tmh-sep { margin: 0 8px; opacity: .6; }

html .site-header .header-right {
  display: flex !important; align-items: center !important; gap: 14px !important;
  flex-shrink: 0; margin: 0 0 0 auto !important; padding: 0 !important;
}
html .site-header .sys-status {
  display: flex !important; align-items: center !important; gap: 6px !important;
  font-size: 12px !important; color: var(--tmh-muted) !important; white-space: nowrap;
}
html .site-header .status-dot {
  width: 8px !important; height: 8px !important; border-radius: 50% !important; flex-shrink: 0;
  background: var(--tmh-green); animation: tmh-pulse 2.5s ease-in-out infinite;
}
html .site-header .status-dot.is-error { background: var(--tmh-red); animation: none; }
@keyframes tmh-pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

/* Theme toggle — pages use one of three class names for the same button */
html .site-header .theme-toggle,
html .site-header .header-theme-toggle,
html .site-header .hdr-theme-toggle {
  width: 36px !important; height: 36px !important; padding: 0 !important; margin: 0 !important;
  border-radius: 50% !important; background: var(--tmh-raised) !important; border: 1px solid var(--tmh-border2) !important;
  color: var(--tmh-muted) !important; cursor: pointer; flex-shrink: 0;
  display: flex !important; align-items: center !important; justify-content: center !important;
  transition: border-color .15s, color .15s;
}
html .site-header .theme-toggle:hover,
html .site-header .header-theme-toggle:hover,
html .site-header .hdr-theme-toggle:hover { border-color: var(--tmh-accent) !important; color: var(--tmh-accent) !important; }
html .site-header .icon-moon, html .site-header .icon-sun { width: 18px; height: 18px; }
html:not([data-theme="light"]) .site-header .icon-sun  { display: none !important; }
html:not([data-theme="light"]) .site-header .icon-moon { display: block !important; }
html[data-theme="light"]       .site-header .icon-moon { display: none !important; }
html[data-theme="light"]       .site-header .icon-sun  { display: block !important; }

/* User pill — avatar, name, role badge */
html .site-header .header-user, html .site-header .hdr-user {
  display: flex !important; align-items: center !important; gap: 9px !important;
  background: var(--tmh-raised) !important; border: 1px solid var(--tmh-border2) !important;
  border-radius: 20px !important; padding: 6px 14px 6px 6px !important; margin: 0 !important; flex-shrink: 0;
}
html .site-header .user-avatar, html .site-header .hdr-user-avatar {
  width: 30px !important; height: 30px !important; border-radius: 50% !important; flex-shrink: 0;
  background: #F5A800 !important; color: #111 !important; font-size: 10px !important; font-weight: 800 !important;
  display: flex !important; align-items: center !important; justify-content: center !important;
}
html .site-header .user-name, html .site-header .hdr-user-name {
  font-size: 13px !important; color: var(--tmh-text2) !important; white-space: nowrap;
}
html .site-header .role-badge, html .site-header .hdr-role-badge {
  font-size: 9px !important; font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: .05em !important;
  padding: 2px 7px !important; border-radius: 20px !important; margin-left: 2px !important; white-space: nowrap;
  background: var(--tmh-accent-dim) !important; color: var(--tmh-accent) !important; border: 1px solid var(--tmh-accent-border) !important;
}
/* Log out */
html .site-header .header-logout-btn, html .site-header .hdr-logout-btn {
  width: 34px !important; height: 34px !important; padding: 0 !important; margin: 0 !important;
  border-radius: 50% !important; background: var(--tmh-raised) !important; border: 1px solid var(--tmh-border2) !important;
  color: var(--tmh-muted) !important; cursor: pointer; flex-shrink: 0;
  display: flex !important; align-items: center !important; justify-content: center !important;
  transition: border-color .15s, color .15s;
}
html .site-header .header-logout-btn:hover, html .site-header .hdr-logout-btn:hover { border-color: var(--tmh-red) !important; color: var(--tmh-red) !important; }
/* Small page-specific header actions (Sync, Export, Refresh…) */
html .site-header .tmh-action {
  display: flex !important; align-items: center !important; gap: 6px; height: 34px !important;
  padding: 0 13px !important; margin: 0 !important; border-radius: 20px !important; white-space: nowrap;
  background: var(--tmh-raised) !important; border: 1px solid var(--tmh-border2) !important; color: var(--tmh-text2) !important;
  font: 600 12px 'DM Sans', system-ui, sans-serif !important; cursor: pointer; text-decoration: none !important;
}
html .site-header .tmh-action:hover { border-color: var(--tmh-accent) !important; color: var(--tmh-accent) !important; }

/* JS shows/hides these with the hidden attribute — keep that working */
html .site-header [hidden] { display: none !important; }

/* Tablet */
@media (min-width: 641px) and (max-width: 900px) {
  html .site-header { padding: 0 20px !important; height: 54px !important; min-height: 54px !important; }
  html .site-header .logo-svg-wrap svg { height: 40px !important; }
  html .site-header .sys-status { font-size: 11px !important; }
  html .site-header .user-name, html .site-header .hdr-user-name { display: none !important; }
}
/* Phone */
@media (max-width: 640px) {
  html .site-header { height: auto !important; min-height: 0 !important; padding: 12px 16px !important; flex-wrap: wrap !important; gap: 12px !important; }
  html .site-header .header-logo { gap: 10px !important; flex-shrink: 1 !important; max-width: 100%; }
  html .site-header .logo-svg-wrap svg { height: 32px !important; }
  html .site-header .logo-divider { height: 16px !important; }
  html .site-header .logo-tagline { font-size: 11px !important; }
  html .site-header .header-right { gap: 10px !important; }
  html .site-header .sys-status span { display: none !important; }
  html .site-header .user-name, html .site-header .hdr-user-name { display: none !important; }
  html .site-header .header-user, html .site-header .hdr-user { padding: 5px !important; }
  html .site-header .theme-toggle, html .site-header .header-theme-toggle, html .site-header .hdr-theme-toggle { width: 32px !important; height: 32px !important; }
  html .site-header .tmh-action .tmh-action-label { display: none; }
}
@media print { html .site-header { display: none !important; } }
</style>
</head>

<script>
/* Standard header: user pill + log out (same behaviour as every Tomahawk app) */
(function () {
  var KEY = 'tm_session_v1', WORKER = 'https://tomahawk-returns.naimuddin.workers.dev';
  var ROLE_LABELS = { admin: 'Admin', manager: 'Manager', viewer: 'Viewer', picker_packer: 'Picker & Packer', custom: 'Custom' };
  var s = null; try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!s || !s.token) { window.location.href = '/Tomahawk/'; return; }
  var label = s.display_name || s.username || '';
  document.getElementById('user-avatar').textContent = label.slice(0, 2).toUpperCase();
  document.getElementById('user-name-display').textContent = label;
  document.getElementById('user-role-badge').textContent = ROLE_LABELS[s.role] || s.role;
  document.getElementById('header-user').hidden = false;
  var btn = document.getElementById('header-logout-btn');
  btn.hidden = false;
  btn.addEventListener('click', async function () {
    try {
      await fetch(WORKER + '?action=logout', { method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Tomahawk-Session': s.token },
        body: JSON.stringify({ action: 'logout' }) });
    } catch (e) {}
    localStorage.removeItem(KEY);
    window.location.href = '/Tomahawk/';
  });
})();
</script>

<div class="intro">
  <h1>MRP Label</h1>
  <p>Paste the label text, check the preview, download a 150 &times; 75 mm PDF.</p>
</div>

<main>
  <section class="panel">
    <label class="title" for="src">Label text</label>
    <textarea id="src" spellcheck="false" placeholder="Commodity: HANDSAW
Model: 738-24
MRP Rs. 499/-(inclusive of all taxes)
Date of Manufacture: July-26
Imported By&quot;Industrial Tools Corporation
E,3,Parasnath complex,Valpada,Bhiwandi-421302
District Thane,Maharashtra
Country of Origin:P.R.C
For Consumer Complaints write to the manager at
the above address OR Call us on+9189289415 Or
email us at care@bullet.co.in"></textarea>
    <div class="row">
      <button id="clear" class="ghost" type="button">Clear</button>
    </div>
    <p class="note">You can paste several labels one after another. Each new "Commodity:" line starts a new label.</p>
  </section>

  <section>
    <p class="count" id="count"></p>
    <div id="out"></div>
    <div class="row" id="dlRow" hidden>
      <button id="dl" type="button">Download PDF</button>
    </div>
  </section>
</main>

<script>
/* ---------- core: parse + draw (shared by preview and PDF) ---------- */
// CORE-START
var LABEL_W = 150, LABEL_H = 75;       // mm
var TOP_PT = 15, BODY_PT = 12.5;       // font sizes, same as the PDFs made so far
var PT_TO_MM = 25.4 / 72;
var LEFT = 5;                          // mm

var FIXED = {
  importer: 'Industrial Tools Corporation',
  addr1: 'E-3, Parasnath Complex, Valpada, Bhiwandi-421302',
  addr2: 'District Thane, Maharashtra',
  complaint1: 'For Consumer Complaints write to the Manager at the above address OR',
  complaint2: 'Call us on +91 8928949415 Or email us at care@bullet.co.in'
};

function clean(s) { return (s || '').replace(/\s+/g, ' ').trim(); }

function parseLabels(text) {
  var lines = String(text || '').replace(/\r/g, '').split('\n');
  var blocks = [], cur = null;
  lines.forEach(function (ln) {
    if (/^\s*Commodity\s*:/i.test(ln)) { cur = []; blocks.push(cur); }
    if (cur) cur.push(ln);
  });
  return blocks.map(function (b) {
    var t = b.join('\n');
    var pick = function (re) { var m = t.match(re); return m ? clean(m[1]) : ''; };
    var mrp = t.match(/MRP\s*:?\s*Rs\.?\s*:?\s*(\d[\d,]*(?:\.\d+)?)/i);
    return {
      commodity: pick(/^\s*Commodity\s*:\s*(.*)$/im),
      model: pick(/^\s*Model\s*:\s*(.*)$/im),
      mrp: mrp ? mrp[1] : '',
      date: pick(/Date of Manufacture\s*:\s*(.*)$/im) || 'July-26',
      country: pick(/Country of Origin\s*:\s*(.*)$/im) || 'P.R.C'
    };
  });
}

function problems(d) {
  var p = [];
  if (!d.commodity) p.push('Commodity is missing.');
  if (!d.model) p.push('Model is missing.');
  if (!d.mrp) p.push('MRP is missing. Write it like "MRP Rs. 499/-" or type it in the field above.');
  return p;
}

// y positions (mm from top of label), baseline of each line
function layout(d) {
  return [
    { y: 7,    pt: TOP_PT,  bold: 'Commodity: ',           val: d.commodity },
    { y: 15,   pt: TOP_PT,  bold: 'Model: ',               val: d.model },
    { y: 23,   pt: TOP_PT,  boldAll: 'MRP Rs.' + d.mrp + '/- (inclusive of all taxes)' },
    { y: 31.5, pt: BODY_PT, bold: 'Date of Manufacture: ', val: d.date },
    { y: 38.3, pt: BODY_PT, bold: 'Country of Origin: ',   val: d.country },
    { y: 45.6, pt: BODY_PT, bold: 'Imported By: ',         val: FIXED.importer },
    { y: 51.6, pt: BODY_PT, val: FIXED.addr1 },
    { y: 57.6, pt: BODY_PT, val: FIXED.addr2 },
    { y: 64.1, pt: BODY_PT, val: FIXED.complaint1 },
    { y: 70.1, pt: BODY_PT, val: FIXED.complaint2 }
  ];
}

function drawLabel(doc, d) {
  layout(d).forEach(function (r) {
    doc.setFontSize(r.pt);
    if (r.boldAll) {
      doc.setFont('helvetica', 'bold');
      doc.text(r.boldAll, LEFT, r.y);
      return;
    }
    var x = LEFT;
    if (r.bold) {
      doc.setFont('helvetica', 'bold');
      doc.text(r.bold, x, r.y);
      x += doc.getTextWidth(r.bold);
    }
    doc.setFont('helvetica', 'normal');
    doc.text(r.val, x, r.y);
  });
}

function newDoc() {
  return new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: [LABEL_W, LABEL_H] });
}

function fileName(d) {
  var m = (d.model || 'label').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '');
  return 'label-' + (m || 'label') + '.pdf';
}
// CORE-END

/* ---------- UI ---------- */
var labels = [];
var $src = document.getElementById('src');
var $out = document.getElementById('out');
var $count = document.getElementById('count');
var $dlRow = document.getElementById('dlRow');
var $dl = document.getElementById('dl');

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function previewSvg(d) {
  var parts = layout(d).map(function (r) {
    var size = (r.pt * PT_TO_MM).toFixed(3);
    var body;
    if (r.boldAll) {
      body = '<tspan font-weight="700">' + esc(r.boldAll) + '</tspan>';
    } else {
      body = (r.bold ? '<tspan font-weight="700">' + esc(r.bold) + '</tspan>' : '') +
             '<tspan>' + esc(r.val) + '</tspan>';
    }
    return '<text x="' + LEFT + '" y="' + r.y + '" font-size="' + size +
           '" xml:space="preserve">' + body + '</text>';
  });
  return '<svg class="preview" viewBox="0 0 ' + LABEL_W + ' ' + LABEL_H + '" ' +
         'xmlns="http://www.w3.org/2000/svg" role="img" ' +
         'aria-label="Label preview" font-family="Helvetica, Arial, sans-serif" fill="#000">' +
         parts.join('') + '</svg>';
}

function render() {
  if (!labels.length) {
    $count.textContent = '';
    $dlRow.hidden = true;
    $out.innerHTML = '<div class="empty">Paste the label text on the left. The label preview appears here.</div>';
    return;
  }
  var okCount = labels.filter(function (d) { return !problems(d).length; }).length;
  $count.textContent = labels.length + (labels.length === 1 ? ' label' : ' labels') +
    (okCount !== labels.length ? ' (' + (labels.length - okCount) + ' need attention)' : '');

  $out.innerHTML = '<div class="cards">' + labels.map(function (d, i) {
    var p = problems(d);
    return '<div class="card' + (p.length ? ' bad' : '') + '" data-i="' + i + '">' +
      previewSvg(d) +
      '<div class="fields">' +
        '<label>Commodity<input data-k="commodity" value="' + esc(d.commodity) + '"' + (d.commodity ? '' : ' class="err"') + '></label>' +
        '<label>Model<input data-k="model" value="' + esc(d.model) + '"' + (d.model ? '' : ' class="err"') + '></label>' +
        '<label>MRP (Rs.)<input data-k="mrp" value="' + esc(d.mrp) + '"' + (d.mrp ? '' : ' class="err"') + '></label>' +
        '<label>Date of Manufacture<input data-k="date" value="' + esc(d.date) + '"></label>' +
      '</div>' +
      (p.length ? '<div class="msg">' + p.map(esc).join(' ') + '</div>' : '') +
    '</div>';
  }).join('') + '</div>';

  $dlRow.hidden = false;
  $dl.disabled = okCount !== labels.length;
}

function reparse() {
  labels = parseLabels($src.value);
  render();
}

// One button: a single label saves as label-<model>.pdf, several save as one multi-page PDF
function download() {
  if (!labels.length || labels.some(function (d) { return problems(d).length; })) return;
  var doc = newDoc();
  labels.forEach(function (d, i) {
    if (i > 0) doc.addPage([LABEL_W, LABEL_H], 'landscape');
    drawLabel(doc, d);
  });
  doc.save(labels.length === 1 ? fileName(labels[0]) : 'mrp-labels-' + labels.length + '.pdf');
}

$src.addEventListener('input', reparse);

document.getElementById('clear').addEventListener('click', function () {
  $src.value = '';
  reparse();
  $src.focus();
});

$dl.addEventListener('click', download);

// Edits in the small fields update just that label (no full re-render, so typing keeps focus)
$out.addEventListener('input', function (e) {
  var inp = e.target.closest('input[data-k]');
  if (!inp) return;
  var card = inp.closest('.card');
  var i = Number(card.getAttribute('data-i'));
  labels[i][inp.getAttribute('data-k')] = clean(inp.value);
  var d = labels[i];
  var p = problems(d);
  card.classList.toggle('bad', p.length > 0);
  card.querySelector('.preview').outerHTML = previewSvg(d);
  inp.classList.toggle('err', !clean(inp.value) && inp.getAttribute('data-k') !== 'date');
  var msg = card.querySelector('.msg');
  if (p.length) {
    if (!msg) { msg = document.createElement('div'); msg.className = 'msg'; card.querySelector('.fields').after(msg); }
    msg.textContent = p.join(' ');
  } else if (msg) { msg.remove(); }
  var okCount = labels.filter(function (x) { return !problems(x).length; }).length;
  $dl.disabled = okCount !== labels.length;
  $count.textContent = labels.length + (labels.length === 1 ? ' label' : ' labels') +
    (okCount !== labels.length ? ' (' + (labels.length - okCount) + ' need attention)' : '');
});

document.getElementById('theme-toggle').addEventListener('click', function () {
  var html = document.documentElement;
  var next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('tm_theme', next); } catch (e) {}
});

render();
</script>
