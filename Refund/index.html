<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Refund bank details — TOMAHAWK Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════
  REFUND BANK DETAILS — public page for customers (no login).
  Opened from the single-use link the Customer Care Dashboard makes
  (…/Refund/?t=TOKEN). The Worker checks the token (7 days, single use,
  5 wrong attempts max) and the last 4 digits of the customer's phone.
  NEFT only (no UPI). IFSC → bank/branch via ifsc.razorpay.com (public).
  Worker actions: refundFormInfo (GET), refundSubmitBank (POST).
  ══════════════════════════════════════════════════════════════════
-->
<style>
:root { --bg:#0b0b10; --surface:#14141c; --surface2:#1b1b25; --border:#2a2a36; --text:#e8e8f0; --text2:#9a9aab; --accent:#F5A800; --red:#f87171; --green:#22c55e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; }
header { padding: 18px 20px; border-bottom: 1px solid var(--border); color: var(--accent); display: flex; justify-content: center; }
main { max-width: 520px; margin: 0 auto; padding: 24px 18px 48px; }
h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 24px; margin: 0 0 6px; }
.sub { color: var(--text2); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); margin-bottom: 3px; }
.v { font-weight: 600; }
.amt { color: var(--accent); font-size: 20px; font-weight: 700; }
label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
label:first-child { margin-top: 0; }
input[type=text], input[type=tel], input[type=password] { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px; font: inherit; font-size: 16px; }
input:focus { outline: none; border-color: var(--accent); }
.hint { font-size: 12px; color: var(--text2); margin-top: 5px; }
.hint.ok { color: var(--green); } .hint.bad { color: var(--red); }
.consent { font-weight: 400; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text2); line-height: 1.5; margin-top: 16px; }
.consent input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
button { width: 100%; margin-top: 18px; padding: 14px; border: none; border-radius: 10px; background: var(--accent); color: #111; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
button:disabled { opacity: .5; cursor: progress; }
.err { background: color-mix(in srgb, var(--red) 12%, transparent); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); color: var(--red); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 14px; }
.state { text-align: center; padding: 30px 18px; }
.state .big { font-size: 44px; margin-bottom: 10px; }
.secure { text-align: center; font-size: 12px; color: var(--text2); margin-top: 18px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><svg xmlns="http://www.w3.org/2000/svg" viewBox="474 509 6803 1270" style="height:40px;width:auto;display:block;fill:currentColor;">

        <path d="M7160.73 529.99c52.95,0 95.89,42.94 95.89,95.95 0,52.95 -42.94,95.89 -95.89,95.89 -53,0 -95.97,-42.94 -95.97,-95.89 0,-53.01 42.97,-95.95 95.97,-95.95zm-42.35 149.95l0 -110.28 46.91 0c11.77,0 20.35,1.01 25.65,3.01 5.34,1.97 9.65,5.52 12.86,10.57 3.22,5.05 4.8,10.81 4.8,17.39 0,8.2 -2.44,15.09 -7.3,20.45 -4.85,5.38 -12.16,8.8 -21.83,10.2 4.84,2.81 8.84,5.9 11.95,9.27 3.13,3.36 7.34,9.3 12.66,17.89l13.46 21.5 -26.6 0 -16.09 -23.99c-5.74,-8.56 -9.67,-13.99 -11.76,-16.2 -2.1,-2.26 -4.33,-3.73 -6.7,-4.58 -2.37,-0.83 -6.08,-1.25 -11.2,-1.25l-4.5 0 0 46.02 -22.31 0zm22.31 -63.65l16.45 0c10.69,0 17.35,-0.44 20.02,-1.32 2.65,-0.87 4.74,-2.48 6.23,-4.68 1.53,-2.18 2.3,-4.96 2.3,-8.25 0,-3.76 -1.01,-6.69 -3,-8.99 -1.97,-2.32 -4.75,-3.73 -8.39,-4.34 -1.8,-0.25 -7.21,-0.37 -16.25,-0.37l-17.36 0 0 27.95zm20.04 -72.89c45.53,0 82.45,36.94 82.45,82.54 0,45.52 -36.92,82.49 -82.45,82.49 -45.59,0 -82.53,-36.97 -82.53,-82.49 0,-45.6 36.94,-82.54 82.53,-82.54z"/>

<main>
  <div id="loading" class="card state"><div class="sub">Loading…</div></div>

  <div id="message" class="card state" hidden>
    <div class="big" id="msg-icon">⚠</div>
    <h1 id="msg-title">Link not valid</h1>
    <div class="sub" id="msg-text"></div>
  </div>

  <div id="form-wrap" hidden>
    <h1>Refund bank details</h1>
    <div class="sub">Hi <span id="first-name"></span>, please share the bank account where you'd like to receive your refund by NEFT.</div>
    <div class="card facts">
      <div><div class="k">Case</div><div class="v" id="case-id"></div></div>
      <div><div class="k">Refund amount</div><div class="amt" id="amount"></div></div>
      <div style="grid-column:span 2"><div class="k">Product</div><div class="v" id="product"></div></div>
    </div>

    <div class="card">
      <label for="last4">Last 4 digits of your registered mobile number</label>
      <input type="tel" id="last4" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="XXXX">

      <label for="holder">Account holder name</label>
      <input type="text" id="holder" maxlength="80" autocomplete="name" placeholder="As printed on your passbook">

      <label for="acct">Account number</label>
      <input type="password" id="acct" inputmode="numeric" maxlength="18" autocomplete="off" placeholder="9–18 digits">

      <label for="acct2">Re-enter account number</label>
      <input type="text" id="acct2" inputmode="numeric" maxlength="18" autocomplete="off">
      <div class="hint" id="acct-hint"></div>

      <label for="ifsc">IFSC code</label>
      <input type="text" id="ifsc" maxlength="11" autocomplete="off" placeholder="e.g. SBIN0001234" style="text-transform:uppercase">
      <div class="hint" id="ifsc-hint">11 characters — printed on your cheque book / passbook.</div>

      <label class="consent"><input type="checkbox" id="consent">
        <span>I confirm these are my bank details and I agree to TOMAHAWK Tools (Industrial Tools and Hardware) using them only to send this refund. They are deleted 30 days after the refund is made.</span></label>

      <div class="err" id="err" hidden></div>
      <button id="submit">Submit bank details</button>
    </div>
    <div class="secure">🔒 Sent securely. We will never ask for your OTP, PIN, card number or password.</div>
  </div>
</main>

<script>
(function () {
  var WORKER = 'https://tomahawk-returns.naimuddin.workers.dev';
  var token = new URLSearchParams(location.search).get('t') || '';
  var bank = { name: '', branch: '', ok: false };
  var $ = function (id) { return document.getElementById(id); };

  function show(id) { ['loading', 'message', 'form-wrap'].forEach(function (x) { $(x).hidden = x !== id; }); }
  function message(icon, title, text) { $('msg-icon').textContent = icon; $('msg-title').textContent = title; $('msg-text').textContent = text; show('message'); }
  function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }

  async function init() {
    if (!token) return message('⚠', 'Link not valid', 'Please open the full link sent to you by our customer care team.');
    try {
      var res = await fetch(WORKER + '?action=refundFormInfo&t=' + encodeURIComponent(token)).then(function (r) { return r.json(); });
      if (!res.ok) return message('⚠', 'Link not available', res.error || 'Please contact our customer care team.');
      $('first-name').textContent = res.first_name || 'there';
      $('case-id').textContent = res.case_id;
      $('amount').textContent = money(res.amount);
      $('product').textContent = res.product || '—';
      show('form-wrap');
    } catch (e) {
      message('⚠', 'Something went wrong', 'Please check your internet connection and open the link again.');
    }
  }

  // Account number match hint
  function checkAcct() {
    var a = $('acct').value.replace(/\s/g, ''), b = $('acct2').value.replace(/\s/g, ''), h = $('acct-hint');
    if (!b) { h.textContent = ''; h.className = 'hint'; return; }
    var same = a === b;
    h.textContent = same ? '✓ Account numbers match' : 'Account numbers don’t match';
    h.className = 'hint ' + (same ? 'ok' : 'bad');
  }
  $('acct').addEventListener('input', checkAcct);
  $('acct2').addEventListener('input', checkAcct);

  // IFSC → bank + branch (public Razorpay IFSC directory)
  var ifscSeq = 0;
  $('ifsc').addEventListener('input', async function () {
    var v = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    this.value = v;
    var h = $('ifsc-hint'), seq = ++ifscSeq;
    bank = { name: '', branch: '', ok: false };
    if (v.length < 11) { h.textContent = '11 characters — printed on your cheque book / passbook.'; h.className = 'hint'; return; }
    if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(v)) { h.textContent = 'This doesn’t look like a valid IFSC code.'; h.className = 'hint bad'; return; }
    h.textContent = 'Checking…'; h.className = 'hint';
    try {
      var r = await fetch('https://ifsc.razorpay.com/' + v);
      if (seq !== ifscSeq) return;
      if (!r.ok) { h.textContent = 'IFSC code not found — please check it.'; h.className = 'hint bad'; return; }
      var d = await r.json();
      bank = { name: d.BANK || '', branch: [d.BRANCH, d.CITY].filter(Boolean).join(', '), ok: true };
      h.textContent = '✓ ' + bank.name + (bank.branch ? ' — ' + bank.branch : ''); h.className = 'hint ok';
    } catch (e) {
      if (seq !== ifscSeq) return;
      bank.ok = true;   // lookup unavailable — let the team verify the IFSC
      h.textContent = 'Couldn’t verify the IFSC right now — please double-check it.'; h.className = 'hint';
    }
  });

  function fail(msg) { var e = $('err'); e.textContent = msg; e.hidden = false; }

  $('submit').addEventListener('click', async function () {
    $('err').hidden = true;
    var last4 = $('last4').value.replace(/\D/g, '');
    var holder = $('holder').value.trim();
    var acct = $('acct').value.replace(/\s/g, ''), acct2 = $('acct2').value.replace(/\s/g, '');
    var ifsc = $('ifsc').value.trim().toUpperCase();
    if (last4.length !== 4) return fail('Enter the last 4 digits of your mobile number.');
    if (holder.length < 2) return fail('Enter the account holder name.');
    if (!/^\d{9,18}$/.test(acct)) return fail('Account number should be 9–18 digits.');
    if (acct !== acct2) return fail('The two account numbers don’t match.');
    if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)) return fail('Enter a valid 11-character IFSC code.');
    if (!bank.ok) return fail('Please check the IFSC code — we couldn’t find that branch.');
    if (!$('consent').checked) return fail('Please tick the consent box.');
    var btn = this;
    btn.disabled = true; btn.textContent = 'Submitting…';
    try {
      var res = await fetch(WORKER + '?action=refundSubmitBank', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'refundSubmitBank', t: token, last4: last4, holder_name: holder,
          account_number: acct, ifsc: ifsc, bank_name: bank.name, branch: bank.branch, consent: true })
      }).then(function (r) { return r.json(); });
      if (!res.ok) { fail(res.error || 'Couldn’t submit — please try again.'); btn.disabled = false; btn.textContent = 'Submit bank details'; return; }
      message('✅', 'Thank you!', 'We’ve received your bank details. Your refund will be sent by NEFT and usually reaches your account within 2–3 working days.');
    } catch (e) {
      fail('Network problem — please try again.'); btn.disabled = false; btn.textContent = 'Submit bank details';
    }
  });

  init();
})();
</script>
</body>
</html>
