name: Txn Capture APK

# Builds the personal Txn Capture Android app (Txn-Capture-App/) into an APK.
# Download the APK from the run's "Artifacts" section.
on:
  push:
    paths:
      - 'Txn-Capture-App/**'
      - '.github/workflows/txn-capture-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Txn-Capture-App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test parser + build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TxnCapture.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TxnCapture-apk
          path: Txn-Capture-App/TxnCapture.apk
      - name: Publish APK as release (direct phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: txn-capture-latest
          name: Txn Capture APK (latest)
          body: Personal salary / expense tracker. Download TxnCapture.apk on the phone and install. Each new build replaces this file; install over the old app (data stays).
          prerelease: true
          make_latest: false
          files: Txn-Capture-App/TxnCapture.apk
