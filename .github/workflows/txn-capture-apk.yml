name: Txn Capture APK

# Builds the personal Txn Capture Android app (Txn-Capture-App/) into an APK.
# Download the APK from the run's "Artifacts" section.
on:
  push:
    paths:
      - 'Txn-Capture-App/**'
      - '.github/workflows/txn-capture-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Txn-Capture-App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test parser + build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TxnCapture.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TxnCapture-apk
          path: Txn-Capture-App/TxnCapture.apk
